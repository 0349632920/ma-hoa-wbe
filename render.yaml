services:
  - type: web
    name: ma-hoa-web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9        # ← Đổi thành 3.11.9
      - key: ADMIN_USER
        value: Hùng
      - key: ADMIN_PASSWORD
        value: admin123
      - key: DATABASE_URL
        sync: false
