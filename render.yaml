services:
  - type: web
    name: mahoa-web
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mahoa-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: mahoa-db
    plan: free
    region: singapore
