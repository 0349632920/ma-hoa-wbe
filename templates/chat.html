<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💬 Tin nhắn</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }

        /* ═══ LAYOUT 2 CỘT ═══ */
        .chat-container {
            display: grid;
            grid-template-columns: 340px 1fr;
            height: 100vh;
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
        }

        /* ═══ SIDEBAR — DANH SÁCH CHAT ═══ */
        .sidebar {
            background: rgba(15, 15, 25, 0.95);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            backdrop-filter: blur(20px);
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .sidebar-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .sidebar-title {
            font-size: 1.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #b8b8ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .back-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 1rem;
            text-decoration: none;
        }
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.1);
        }

        .search-input {
            width: 100%;
            padding: 11px 16px;
            border-radius: 22px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.2s;
        }
        .search-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }
        .search-input::placeholder { color: #666; }

        /* Conversation list */
        .conversation-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 12px;
        }

        .conversation-list::-webkit-scrollbar { width: 6px; }
        .conversation-list::-webkit-scrollbar-track { background: transparent; }
        .conversation-list::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 3px; }
        .conversation-list::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }

        .conv-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.15s;
            position: relative;
        }

        .conv-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .conv-item.active {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.2), rgba(218, 112, 214, 0.15));
        }

        .conv-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.2rem;
            color: #fff;
            flex-shrink: 0;
            position: relative;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .conv-avatar.super {
            background: linear-gradient(135deg, #ffd700, #ffa502);
            color: #1a1a2e;
        }

        .online-dot {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #2ed573;
            border: 3px solid #0f0f1a;
            box-shadow: 0 0 10px #2ed573;
        }

        .conv-info {
            flex: 1;
            min-width: 0;
        }

        .conv-name {
            font-weight: 700;
            font-size: 0.95rem;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .conv-name .super-icon {
            font-size: 0.75rem;
        }

        .conv-last {
            font-size: 0.82rem;
            color: #9999bb;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .conv-meta {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
            flex-shrink: 0;
        }

        .conv-time {
            font-size: 0.72rem;
            color: #666;
            font-family: 'JetBrains Mono', monospace;
        }

        .unread-badge {
            background: linear-gradient(135deg, #ff6b9d, #f5576c);
            color: #fff;
            font-size: 0.7rem;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 10px;
            min-width: 20px;
            text-align: center;
            box-shadow: 0 4px 12px rgba(245, 87, 108, 0.4);
        }

        .empty-conv {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }
        .empty-conv .icon { font-size: 3rem; display: block; margin-bottom: 12px; opacity: 0.4; }

        /* ═══ MAIN — KHU VỰC CHAT ═══ */
        .chat-area {
            display: flex;
            flex-direction: column;
            background: rgba(10, 10, 20, 0.5);
            position: relative;
            overflow: hidden;
        }

        .chat-header {
            padding: 16px 24px;
            background: rgba(15, 15, 25, 0.9);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            gap: 14px;
            backdrop-filter: blur(20px);
            flex-shrink: 0;
        }

        .chat-header .conv-avatar {
            width: 44px;
            height: 44px;
            font-size: 1.1rem;
        }

        .chat-header-info {
            flex: 1;
            min-width: 0;
        }

        .chat-header-name {
            font-weight: 800;
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chat-header-status {
            font-size: 0.82rem;
            color: #9999bb;
            margin-top: 2px;
        }

        .chat-header-status.online { color: #2ed573; }

        .chat-header-actions {
            display: flex;
            gap: 8px;
        }

        .chat-header-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .chat-header-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.1);
        }

        /* Messages */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            scroll-behavior: smooth;
        }

        .messages-container::-webkit-scrollbar { width: 8px; }
        .messages-container::-webkit-scrollbar-track { background: transparent; }
        .messages-container::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 4px; }
        .messages-container::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }

        .msg-row {
            display: flex;
            gap: 10px;
            margin-bottom: 8px;
            animation: msgIn 0.25s ease;
        }

        @keyframes msgIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .msg-row.me {
            flex-direction: row-reverse;
        }

        .msg-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 0.8rem;
            color: #fff;
            flex-shrink: 0;
            align-self: flex-end;
        }

        .msg-avatar.super {
            background: linear-gradient(135deg, #ffd700, #ffa502);
            color: #1a1a2e;
        }

        .msg-bubble {
            max-width: 70%;
            padding: 10px 16px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 0.95rem;
            line-height: 1.5;
            word-wrap: break-word;
            word-break: break-word;
            position: relative;
            transition: all 0.15s;
        }

        .msg-bubble:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .msg-row.me .msg-bubble {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-color: transparent;
            color: #fff;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .msg-time {
            font-size: 0.7rem;
            color: #666;
            margin-top: 4px;
            padding: 0 6px;
        }

        .msg-row.me .msg-time {
            text-align: right;
        }

        .msg-delete-btn {
            position: absolute;
            top: -8px;
            right: -8px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #e74c3c;
            color: #fff;
            border: 2px solid #0f0f1a;
            font-size: 0.7rem;
            cursor: pointer;
            opacity: 0;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .msg-row.me .msg-bubble:hover .msg-delete-btn {
            opacity: 1;
        }
        .msg-delete-btn:hover {
            transform: scale(1.15);
        }

        /* Welcome state */
        .welcome-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }
        .welcome-state .icon {
            font-size: 6rem;
            margin-bottom: 20px;
            opacity: 0.3;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-15px); }
        }
        .welcome-state h2 {
            font-size: 1.4rem;
            color: #c8c8e0;
            margin-bottom: 8px;
        }
        .welcome-state p {
            font-size: 0.95rem;
            line-height: 1.6;
        }

        /* Input */
        .input-bar {
            padding: 16px 24px;
            background: rgba(15, 15, 25, 0.9);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            gap: 12px;
            align-items: flex-end;
            backdrop-filter: blur(20px);
            flex-shrink: 0;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        .message-input {
            width: 100%;
            padding: 12px 18px;
            border-radius: 22px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
            resize: none;
            min-height: 44px;
            max-height: 120px;
            line-height: 1.4;
            overflow-y: auto;
        }
        .message-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }
        .message-input::placeholder { color: #666; }

        .send-btn {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        .send-btn:hover:not(:disabled) {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ═══ SEARCH RESULTS OVERLAY ═══ */
        .search-results {
            position: absolute;
            top: 100%;
            left: 20px;
            right: 20px;
            background: rgba(20, 20, 35, 0.98);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            margin-top: 8px;
            max-height: 320px;
            overflow-y: auto;
            z-index: 100;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(20px);
            display: none;
        }
        .search-results.show { display: block; }

        .search-result-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            cursor: pointer;
            transition: all 0.15s;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .search-result-item:last-child { border-bottom: none; }
        .search-result-item:hover {
            background: rgba(102, 126, 234, 0.15);
        }

        .search-result-item .conv-avatar {
            width: 42px;
            height: 42px;
            font-size: 1rem;
        }

        .search-result-item .info {
            flex: 1;
            min-width: 0;
        }

        .search-result-item .name {
            font-weight: 700;
            font-size: 0.92rem;
            margin-bottom: 2px;
        }

        .search-result-item .username {
            font-size: 0.78rem;
            color: #9999bb;
            font-family: monospace;
        }

        /* ═══ TOAST ═══ */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #27ae60;
            color: #fff;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 700;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transition: all 0.4s;
            pointer-events: none;
            z-index: 9999;
            max-width: 90vw;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        .toast.error { background: #e74c3c; }

        /* ═══ MOBILE ═══ */
        .mobile-back-btn {
            display: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: 1.1rem;
            cursor: pointer;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        @media (max-width: 768px) {
            .chat-container {
                grid-template-columns: 1fr;
            }

            .sidebar {
                position: absolute;
                inset: 0;
                z-index: 50;
                transition: transform 0.3s ease;
            }

            .sidebar.hidden {
                transform: translateX(-100%);
            }

            .mobile-back-btn {
                display: flex;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <!-- ═══ SIDEBAR ═══ -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title-row">
                    <div class="sidebar-title">💬 Tin nhắn</div>
                    <a href="{{ url_for('index') }}" class="back-btn" title="Về trang chủ">🏠</a>
                </div>
                <div style="position: relative;">
                    <input type="text" class="search-input" id="searchInput"
                           placeholder="🔍 Tìm người để chat..."
                           autocomplete="off">
                    <div class="search-results" id="searchResults"></div>
                </div>
            </div>

            <div class="conversation-list" id="conversationList">
                <div class="empty-conv">
                    <span class="icon">💬</span>
                    <div>Đang tải...</div>
                </div>
            </div>
        </div>

        <!-- ═══ CHAT AREA ═══ -->
        <div class="chat-area" id="chatArea">
            <div class="welcome-state" id="welcomeState">
                <div class="icon">💬</div>
                <h2>Chào mừng đến với Tin nhắn</h2>
                <p>Chọn một cuộc trò chuyện<br>hoặc tìm người mới để bắt đầu chat</p>
            </div>

            <!-- Chat content (hiện khi có người chat) -->
            <div id="chatContent" style="display: none; flex: 1; display: none; flex-direction: column;">
                <div class="chat-header" id="chatHeader">
                    <button class="mobile-back-btn" onclick="closeChatMobile()">←</button>
                    <div class="conv-avatar" id="headerAvatar">?</div>
                    <div class="chat-header-info">
                        <div class="chat-header-name" id="headerName">—</div>
                        <div class="chat-header-status" id="headerStatus">Đang hoạt động</div>
                    </div>
                    <div class="chat-header-actions">
                        <button class="chat-header-btn" onclick="refreshMessages()" title="Làm mới">🔄</button>
                    </div>
                </div>

                <div class="messages-container" id="messagesContainer"></div>

                <div class="input-bar">
                    <div class="input-wrapper">
                        <textarea class="message-input" id="messageInput"
                                  placeholder="Nhập tin nhắn..."
                                  rows="1"
                                  maxlength="1000"></textarea>
                    </div>
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()">📤</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ═══════════════════════════════════════════════════════════
        //  STATE
        // ═══════════════════════════════════════════════════════════
        let currentPartner = null;         // Username người đang chat
        let currentPartnerData = null;     // Thông tin người đang chat
        let pollTimer = null;              // Polling timer
        let lastMsgCount = 0;              // Số tin nhắn lần trước
        const POLL_INTERVAL = 2000;        // 2 giây

        const myUsername = '{{ username }}';

        // ═══════════════════════════════════════════════════════════
        //  LOAD CONVERSATIONS
        // ═══════════════════════════════════════════════════════════
        async function loadConversations() {
            try {
                const res = await fetch('/api/chat/conversations');
                if (res.status === 401) { window.location.href = '/login'; return; }

                const data = await res.json();
                if (!data.success) return;

                renderConversations(data.conversations || []);
            } catch (e) {
                console.error(e);
            }
        }

        function renderConversations(convs) {
            const list = document.getElementById('conversationList');

            if (convs.length === 0) {
                list.innerHTML = `
                    <div class="empty-conv">
                        <span class="icon">💭</span>
                        <div>Chưa có cuộc trò chuyện</div>
                        <div style="font-size:0.85rem;margin-top:6px;color:#555;">
                            Tìm người để bắt đầu chat
                        </div>
                    </div>
                `;
                return;
            }

            list.innerHTML = convs.map(c => {
                const isActive = currentPartner === c.username;
                const firstLetter = (c.display_name || c.username)[0].toUpperCase();
                const superClass = c.is_super_admin ? 'super' : '';
                const superIcon = c.is_super_admin ? '<span class="super-icon">👑</span>' : '';

                return `
                    <div class="conv-item ${isActive ? 'active' : ''}"
                         onclick="openChat('${escapeJs(c.username)}')"
                         data-username="${escapeHtml(c.username)}">
                        <div class="conv-avatar ${superClass}">
                            ${escapeHtml(firstLetter)}
                            <div class="online-dot"></div>
                        </div>
                        <div class="conv-info">
                            <div class="conv-name">
                                ${escapeHtml(c.display_name || c.username)}
                                ${superIcon}
                            </div>
                            <div class="conv-last">${escapeHtml(c.last_message || 'Bắt đầu trò chuyện...')}</div>
                        </div>
                        <div class="conv-meta">
                            <div class="conv-time">${formatTimeShort(c.last_time)}</div>
                            ${c.unread > 0 ? `<div class="unread-badge">${c.unread}</div>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ═══════════════════════════════════════════════════════════
        //  OPEN CHAT
        // ═══════════════════════════════════════════════════════════
        async function openChat(partnerUsername) {
            currentPartner = partnerUsername;

            // Ẩn welcome, hiện chat
            document.getElementById('welcomeState').style.display = 'none';
            const content = document.getElementById('chatContent');
            content.style.display = 'flex';

            // Mobile: ẩn sidebar
            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.add('hidden');
            }

            // Load messages
            await loadMessages();

            // Highlight conversation
            document.querySelectorAll('.conv-item').forEach(el => {
                el.classList.toggle('active', el.dataset.username === partnerUsername);
            });

            // Focus input
            document.getElementById('messageInput').focus();

            // Bắt đầu polling
            startPolling();
        }

        function closeChatMobile() {
            document.getElementById('sidebar').classList.remove('hidden');
            stopPolling();
            currentPartner = null;
        }

        // ═══════════════════════════════════════════════════════════
        //  LOAD MESSAGES
        // ═══════════════════════════════════════════════════════════
        async function loadMessages() {
            if (!currentPartner) return;

            try {
                const res = await fetch(`/api/chat/messages/${encodeURIComponent(currentPartner)}`);
                const data = await res.json();

                if (!data.success) {
                    showToast('❌ ' + (data.error || 'Lỗi'), true);
                    return;
                }

                currentPartnerData = data.partner;
                renderChatHeader(data.partner);
                renderMessages(data.messages || []);
                lastMsgCount = (data.messages || []).length;
            } catch (e) {
                console.error(e);
            }
        }

        function renderChatHeader(partner) {
            const avatar = document.getElementById('headerAvatar');
            const name = document.getElementById('headerName');

            avatar.textContent = (partner.display_name || partner.username)[0].toUpperCase();
            avatar.className = 'conv-avatar' + (partner.is_super_admin ? ' super' : '');

            name.innerHTML = escapeHtml(partner.display_name || partner.username) +
                (partner.is_super_admin ? ' <span style="font-size:0.75rem;">👑</span>' : '');
        }

        function renderMessages(messages) {
            const container = document.getElementById('messagesContainer');

            if (messages.length === 0) {
                container.innerHTML = `
                    <div style="text-align:center;padding:40px 20px;color:#666;font-size:0.9rem;">
                        💬 Hãy gửi tin nhắn đầu tiên!
                    </div>
                `;
                return;
            }

            const wasAtBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 100;

            container.innerHTML = messages.map(m => {
                const firstLetter = m.from_display[0].toUpperCase();
                const avatarClass = 'msg-avatar';

                return `
                    <div class="msg-row ${m.is_me ? 'me' : ''}">
                        ${!m.is_me ? `<div class="${avatarClass}">${escapeHtml(firstLetter)}</div>` : ''}
                        <div class="msg-bubble">
                            ${escapeHtml(m.content)}
                            ${m.is_me ? `<button class="msg-delete-btn" onclick="deleteMessage('${m.id}')" title="Xóa">✕</button>` : ''}
                            <div class="msg-time">${formatTimeShort(m.time)}</div>
                        </div>
                    </div>
                `;
            }).join('');

            // Auto scroll
            if (wasAtBottom || messages.length !== lastMsgCount) {
                setTimeout(() => {
                    container.scrollTop = container.scrollHeight;
                }, 50);
            }
        }

        // ═══════════════════════════════════════════════════════════
        //  SEND MESSAGE
        // ═══════════════════════════════════════════════════════════
        async function sendMessage() {
            if (!currentPartner) return;

            const input = document.getElementById('messageInput');
            const content = input.value.trim();

            if (!content) return;

            const btn = document.getElementById('sendBtn');
            btn.disabled = true;

            try {
                const res = await fetch('/api/chat/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ to: currentPartner, content })
                });

                const data = await res.json();

                if (data.success) {
                    input.value = '';
                    input.style.height = 'auto';
                    await loadMessages();
                    loadConversations();
                } else {
                    showToast('❌ ' + (data.error || 'Lỗi gửi tin nhắn'), true);
                }
            } catch (e) {
                showToast('❌ Lỗi kết nối!', true);
            } finally {
                btn.disabled = false;
                input.focus();
            }
        }

        // ═══════════════════════════════════════════════════════════
        //  DELETE MESSAGE
        // ═══════════════════════════════════════════════════════════
        async function deleteMessage(msgId) {
            if (!confirm('Xóa tin nhắn này?')) return;

            try {
                const res = await fetch(`/api/chat/delete/${msgId}`, { method: 'POST' });
                const data = await res.json();

                if (data.success) {
                    showToast('🗑️ Đã xóa');
                    loadMessages();
                } else {
                    showToast('❌ ' + (data.error || 'Lỗi'), true);
                }
            } catch (e) {
                showToast('❌ Lỗi kết nối!', true);
            }
        }

        // ═══════════════════════════════════════════════════════════
        //  POLLING — TỰ ĐỘNG CẬP NHẬT MỖI 2 GIÂY
        // ═══════════════════════════════════════════════════════════
        function startPolling() {
            stopPolling();
            pollTimer = setInterval(async () => {
                if (!currentPartner) return;
                if (document.hidden) return;

                try {
                    const res = await fetch(`/api/chat/messages/${encodeURIComponent(currentPartner)}`);
                    const data = await res.json();

                    if (data.success && data.messages) {
                        const newCount = data.messages.length;
                        if (newCount !== lastMsgCount) {
                            lastMsgCount = newCount;
                            renderMessages(data.messages);
                        }
                    }

                    // Refresh conversation list mỗi 10 giây
                    if (Math.random() < 0.2) {
                        loadConversations();
                    }
                } catch (e) {}
            }, POLL_INTERVAL);
        }

        function stopPolling() {
            if (pollTimer) {
                clearInterval(pollTimer);
                pollTimer = null;
            }
        }

        // ═══════════════════════════════════════════════════════════
        //  SEARCH USERS
        // ═══════════════════════════════════════════════════════════
        let searchTimer;
        document.getElementById('searchInput').addEventListener('input', (e) => {
            clearTimeout(searchTimer);
            const q = e.target.value.trim();

            if (!q) {
                document.getElementById('searchResults').classList.remove('show');
                return;
            }

            searchTimer = setTimeout(() => searchUsers(q), 300);
        });

        document.getElementById('searchInput').addEventListener('focus', (e) => {
            if (e.target.value.trim()) {
                searchUsers(e.target.value.trim());
            }
        });

        async function searchUsers(q) {
            try {
                const res = await fetch(`/api/chat/search?q=${encodeURIComponent(q)}`);
                const data = await res.json();
                if (!data.success) return;

                renderSearchResults(data.users || []);
            } catch (e) {}
        }

        function renderSearchResults(users) {
            const box = document.getElementById('searchResults');

            if (users.length === 0) {
                box.innerHTML = `
                    <div style="padding:20px;text-align:center;color:#666;font-size:0.9rem;">
                        Không tìm thấy user nào
                    </div>
                `;
                box.classList.add('show');
                return;
            }

            box.innerHTML = users.map(u => {
                const firstLetter = (u.display_name || u.username)[0].toUpperCase();
                const superClass = u.is_super_admin ? 'super' : '';
                return `
                    <div class="search-result-item" onclick="openChatFromSearch('${escapeJs(u.username)}')">
                        <div class="conv-avatar ${superClass}">${escapeHtml(firstLetter)}</div>
                        <div class="info">
                            <div class="name">
                                ${escapeHtml(u.display_name || u.username)}
                                ${u.is_super_admin ? '👑' : ''}
                            </div>
                            <div class="username">@${escapeHtml(u.username)}</div>
                        </div>
                    </div>
                `;
            }).join('');

            box.classList.add('show');
        }

        function openChatFromSearch(username) {
            document.getElementById('searchResults').classList.remove('show');
            document.getElementById('searchInput').value = '';
            openChat(username);
        }

        // Ẩn search results khi click ra ngoài
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-input') && !e.target.closest('.search-results')) {
                document.getElementById('searchResults').classList.remove('show');
            }
        });

        // ═══════════════════════════════════════════════════════════
        //  KEYBOARD — ENTER ĐỂ GỬI
        // ═══════════════════════════════════════════════════════════
        const msgInput = document.getElementById('messageInput');
        msgInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Auto resize textarea
        msgInput.addEventListener('input', () => {
            msgInput.style.height = 'auto';
            msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + 'px';
        });

        // ═══════════════════════════════════════════════════════════
        //  REFRESH
        // ═══════════════════════════════════════════════════════════
        function refreshMessages() {
            if (currentPartner) loadMessages();
            loadConversations();
            showToast('🔄 Đã làm mới');
        }

        // ═══════════════════════════════════════════════════════════
        //  UTILS
        // ═══════════════════════════════════════════════════════════
        function formatTimeShort(iso) {
            if (!iso) return '';
            try {
                const d = new Date(iso);
                const now = new Date();
                const diffMs = now - d;
                const diffMin = Math.floor(diffMs / 60000);
                const diffHour = Math.floor(diffMs / 3600000);
                const diffDay = Math.floor(diffMs / 86400000);

                if (diffMin < 1) return 'Vừa xong';
                if (diffMin < 60) return `${diffMin} phút`;
                if (diffHour < 24) return `${diffHour} giờ`;
                if (diffDay < 7) return `${diffDay} ngày`;

                return d.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit' });
            } catch (e) {
                return '';
            }
        }

        function escapeHtml(s) {
            if (!s) return '';
            return String(s).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;',
                '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        function escapeJs(s) {
            return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        }

        function showToast(msg, isError = false) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast show' + (isError ? ' error' : '');
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        // ═══════════════════════════════════════════════════════════
        //  INIT
        // ═══════════════════════════════════════════════════════════
        loadConversations();

        // Auto refresh conversations mỗi 10s (khi không chat)
        setInterval(() => {
            if (!currentPartner && !document.hidden) {
                loadConversations();
            }
        }, 10000);

        // Cleanup khi rời trang
        window.addEventListener('beforeunload', stopPolling);
    </script>
    <script src="{{ url_for('static', filename='logout-sync.js') }}"></script>
</body>
</html>
