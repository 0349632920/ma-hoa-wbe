<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📝 Chế thơ AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #2d1b3d 50%, #1a1a2e 100%);
            color: #fff;
            padding: 30px 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 20% 30%, rgba(255, 182, 193, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(186, 85, 211, 0.15) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 20px;
            color: #e0d0f0;
            text-decoration: none;
            padding: 10px 18px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 182, 193, 0.2);
            border-radius: 10px;
            transition: all 0.2s;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .back:hover {
            color: #ffb6c1;
            border-color: #ffb6c1;
            transform: translateX(-4px);
        }

        h1 {
            text-align: center;
            margin-bottom: 12px;
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffb6c1, #da70d6, #ba55d3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            text-align: center;
            color: #d0c0e0;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        .subtitle .ai-glow {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 10px;
            background: linear-gradient(135deg, rgba(218, 112, 214, 0.25), rgba(186, 85, 211, 0.25));
            border: 1px solid rgba(218, 112, 214, 0.4);
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            color: #e0b0f0;
            margin-left: 6px;
        }

        .card {
            background: rgba(30, 20, 45, 0.85);
            border: 1px solid rgba(255, 182, 193, 0.15);
            border-radius: 20px;
            padding: 28px;
            margin-bottom: 20px;
            backdrop-filter: blur(20px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .form-group { margin-bottom: 20px; }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 700;
            font-size: 0.95rem;
            color: #e0d0f0;
        }

        textarea {
            width: 100%;
            padding: 16px 20px;
            font-size: 1rem;
            border-radius: 12px;
            border: 2px solid rgba(255, 182, 193, 0.2);
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            outline: none;
            font-family: inherit;
            transition: all 0.2s;
            resize: vertical;
            min-height: 100px;
            line-height: 1.6;
        }
        textarea:focus {
            border-color: #da70d6;
            box-shadow: 0 0 0 4px rgba(218, 112, 214, 0.15);
        }
        textarea::placeholder { color: #8a7a9a; }

        /* Chủ đề gợi ý */
        .chu-de-suggest {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .suggest-btn {
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255, 182, 193, 0.3);
            background: rgba(255, 182, 193, 0.1);
            color: #ffb6c1;
            font-family: inherit;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .suggest-btn:hover {
            background: rgba(255, 182, 193, 0.25);
            transform: translateY(-2px);
        }

        /* Phong cách thơ */
        .phong-cach-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .pc-btn {
            padding: 12px;
            border-radius: 12px;
            border: 2px solid rgba(255, 182, 193, 0.2);
            background: rgba(0, 0, 0, 0.25);
            color: #fff;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .pc-btn:hover {
            background: rgba(255, 182, 193, 0.1);
            transform: translateY(-2px);
        }
        .pc-btn.active {
            background: linear-gradient(135deg, #da70d6, #ba55d3);
            border-color: transparent;
            box-shadow: 0 8px 25px rgba(218, 112, 214, 0.5);
        }
        .pc-btn .pc-icon { font-size: 1.5rem; display: block; margin-bottom: 4px; }
        .pc-btn .pc-label { font-weight: 700; }
        .pc-btn .pc-sub { font-size: 0.72rem; opacity: 0.8; margin-top: 2px; }

        /* Generate button */
        .generate-btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #da70d6, #ba55d3);
            color: #fff;
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            margin-top: 8px;
            position: relative;
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .generate-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(218, 112, 214, 0.5);
        }
        .generate-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .generate-btn.loading {
            color: transparent;
            pointer-events: none;
            background: linear-gradient(135deg, #ba55d3, #da70d6, #ba55d3);
            background-size: 200% 200%;
            animation: gradientShift 2s ease infinite;
        }
        .generate-btn.loading::before {
            content: '';
            position: absolute;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes gradientShift {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Kết quả */
        .result-card {
            display: none;
            animation: slideUp 0.5s ease;
        }
        .result-card.show { display: block; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .poem-display {
            padding: 30px 24px;
            background: linear-gradient(135deg, rgba(218, 112, 214, 0.1), rgba(186, 85, 211, 0.05));
            border: 1px solid rgba(218, 112, 214, 0.3);
            border-radius: 16px;
            text-align: center;
            font-family: 'Georgia', 'Times New Roman', serif;
            font-size: 1.15rem;
            line-height: 2;
            color: #fff;
            font-style: italic;
            white-space: pre-line;
            position: relative;
            letter-spacing: 0.3px;
        }

        .poem-display::before {
            content: '"';
            position: absolute;
            top: 10px;
            left: 20px;
            font-size: 4rem;
            color: rgba(218, 112, 214, 0.2);
            font-family: serif;
            line-height: 1;
        }

        .poem-display::after {
            content: '"';
            position: absolute;
            bottom: -20px;
            right: 20px;
            font-size: 4rem;
            color: rgba(218, 112, 214, 0.2);
            font-family: serif;
            line-height: 1;
        }

        .y-nghia {
            margin-top: 16px;
            padding: 14px 18px;
            background: rgba(255, 182, 193, 0.08);
            border-left: 3px solid #da70d6;
            border-radius: 10px;
            font-size: 0.9rem;
            color: #e0d0f0;
            line-height: 1.6;
        }

        .y-nghia strong { color: #ffb6c1; }

        .result-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .result-btn {
            padding: 10px 20px;
            border-radius: 10px;
            border: 1px solid rgba(255, 182, 193, 0.3);
            background: rgba(255, 182, 193, 0.1);
            color: #e0d0f0;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .result-btn:hover {
            background: rgba(255, 182, 193, 0.25);
            color: #ffb6c1;
            transform: translateY(-2px);
        }

        .ai-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 12px;
            background: linear-gradient(135deg, #da70d6, #ba55d3);
            border-radius: 8px;
            font-size: 0.72rem;
            font-weight: 800;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 12px rgba(218, 112, 214, 0.4);
            margin-bottom: 14px;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #ba55d3;
            color: #fff;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 600;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transition: all 0.4s;
            pointer-events: none;
            z-index: 9999;
            max-width: 90vw;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        .toast.error { background: #e74c3c; }

        @media (max-width: 480px) {
            h1 { font-size: 1.6rem; }
            .card { padding: 20px; }
            .phong-cach-grid { grid-template-columns: 1fr; }
            .poem-display { font-size: 1rem; padding: 24px 18px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="{{ url_for('index') }}" class="back">← Về trang chủ</a>

        <h1>📝 Chế thơ AI</h1>
        <p class="subtitle">
            Nhập chủ đề — AI sẽ làm thơ cho bạn
            <span class="ai-glow">🤖 Powered by Llama 3</span>
        </p>

        <div class="card">
            <div class="form-group">
                <label>💭 Chủ đề bài thơ</label>
                <textarea id="chuDeInput" placeholder="Ví dụ: Tình yêu tuổi học trò, Mùa thu Hà Nội, Tình bạn đẹp..."></textarea>
                <div class="chu-de-suggest">
                    <button class="suggest-btn" onclick="setChuDe('Tình yêu tuổi học trò')">💕 Tình yêu học trò</button>
                    <button class="suggest-btn" onclick="setChuDe('Mùa thu Hà Nội')">🍂 Mùa thu</button>
                    <button class="suggest-btn" onclick="setChuDe('Tình bạn đẹp')">👥 Tình bạn</button>
                    <button class="suggest-btn" onclick="setChuDe('Quê hương')">🏡 Quê hương</button>
                    <button class="suggest-btn" onclick="setChuDe('Mẹ và con')">👩 Mẹ</button>
                    <button class="suggest-btn" onclick="setChuDe('Ước mơ tuổi trẻ')">✨ Ước mơ</button>
                </div>
            </div>

            <div class="form-group">
                <label>🎨 Phong cách thơ</label>
                <div class="phong-cach-grid" id="phongCachGrid">
                    <button class="pc-btn active" data-pc="tho_bay" onclick="selectPC('tho_bay')">
                        <span class="pc-icon">📜</span>
                        <div class="pc-label">Thất ngôn</div>
                        <div class="pc-sub">7 chữ/câu</div>
                    </button>
                    <button class="pc-btn" data-pc="tho_luc_bat" onclick="selectPC('tho_luc_bat')">
                        <span class="pc-icon">🎋</span>
                        <div class="pc-label">Lục bát</div>
                        <div class="pc-sub">6-8 chữ</div>
                    </button>
                    <button class="pc-btn" data-pc="tho_tu_do" onclick="selectPC('tho_tu_do')">
                        <span class="pc-icon">🕊️</span>
                        <div class="pc-label">Tự do</div>
                        <div class="pc-sub">Không gò bó</div>
                    </button>
                    <button class="pc-btn" data-pc="tho_duong" onclick="selectPC('tho_duong')">
                        <span class="pc-icon">🏯</span>
                        <div class="pc-label">Đường luật</div>
                        <div class="pc-sub">8 câu 7 chữ</div>
                    </button>
                </div>
            </div>

            <button class="generate-btn" id="generateBtn" onclick="generate()">
                <span id="genBtnText">📝 Làm thơ ngay</span>
            </button>
        </div>

        <div class="card result-card" id="resultCard">
            <div style="text-align: center;">
                <span class="ai-badge" id="resultBadge">🤖 AI</span>
            </div>
            <div class="poem-display" id="poemDisplay">—</div>
            <div class="y-nghia" id="yNghiaBox" style="display: none;">
                <strong>💡 Ý nghĩa:</strong> <span id="yNghiaText"></span>
            </div>
            <div class="result-actions">
                <button class="result-btn" onclick="copyPoem()">
                    📋 Sao chép
                </button>
                <button class="result-btn" onclick="generate()">
                    🔄 Làm lại
                </button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let currentPC = 'tho_bay';

        function setChuDe(text) {
            document.getElementById('chuDeInput').value = text;
            document.getElementById('chuDeInput').focus();
        }

        function selectPC(pc) {
            currentPC = pc;
            document.querySelectorAll('.pc-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.pc === pc);
            });
        }

        async function generate() {
            const chuDe = document.getElementById('chuDeInput').value.trim();
            if (!chuDe) {
                showToast('⚠️ Vui lòng nhập chủ đề!', true);
                document.getElementById('chuDeInput').focus();
                return;
            }

            const btn = document.getElementById('generateBtn');
            btn.classList.add('loading');
            btn.disabled = true;

            try {
                const res = await fetch('/api/tho/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chu_de: chuDe,
                        phong_cach: currentPC,
                    })
                });

                if (res.status === 401) { window.location.href = '/login'; return; }

                const data = await res.json();

                if (data.redirect) { window.location.href = data.redirect; return; }

                if (!data.success) {
                    showToast('❌ ' + (data.error || 'Có lỗi xảy ra!'), true);
                    return;
                }

                renderResult(data.data, data.ai);
                showToast(data.ai ? '🤖 AI đã làm thơ xong!' : '📝 Đã làm thơ xong!');
            } catch (e) {
                showToast('❌ Lỗi kết nối!', true);
            } finally {
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        }

        function renderResult(data, isAI) {
            const card = document.getElementById('resultCard');
            card.classList.remove('show');
            void card.offsetWidth;
            card.classList.add('show');

            document.getElementById('resultBadge').innerHTML = isAI ? '🤖 AI' : '📖 Mẫu';

            document.getElementById('poemDisplay').textContent = data.bai_tho || '—';

            const yNghiaBox = document.getElementById('yNghiaBox');
            if (data.y_nghia) {
                document.getElementById('yNghiaText').textContent = data.y_nghia;
                yNghiaBox.style.display = 'block';
            } else {
                yNghiaBox.style.display = 'none';
            }

            setTimeout(() => {
                card.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 200);
        }

        function copyPoem() {
            const text = document.getElementById('poemDisplay').textContent;
            if (!text || text === '—') return;

            navigator.clipboard.writeText(text).then(() => {
                showToast('📋 Đã sao chép bài thơ!');
            }).catch(() => {
                showToast('❌ Không thể sao chép!', true);
            });
        }

        function showToast(msg, isError = false) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast show' + (isError ? ' error' : '');
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        setTimeout(() => document.getElementById('chuDeInput').focus(), 300);
    </script>
    <script src="{{ url_for('static', filename='logout-sync.js') }}"></script>
</body>
</html>
