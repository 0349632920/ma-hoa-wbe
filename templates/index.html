<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔐 Web Mã Hóa & Giải Mã</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header>
      <h1>🔐 Mã Hóa & Giải Mã</h1>
      <p>Công cụ mã hóa văn bản trực tuyến</p>
    </header>

    <div class="tabs">
      <button class="tab active" data-method="base64">Base64</button>
      <button class="tab" data-method="caesar">Caesar</button>
      <button class="tab" data-method="rot13">ROT13</button>
      <button class="tab" data-method="binary">Binary</button>
      <button class="tab" data-method="hex">Hex</button>
      <button class="tab" data-method="aes">AES 🛡️</button>
    </div>

    <div id="key-section" class="key-section hidden">
      <label id="key-label">Khóa:</label>
      <input type="text" id="key-input" placeholder="Nhập khóa...">
    </div>

    <div class="io-section">
      <div class="box">
        <label>📝 Văn bản gốc</label>
        <textarea id="input" placeholder="Nhập văn bản..."></textarea>
      </div>
      <div class="box">
        <label>✅ Kết quả</label>
        <textarea id="output" placeholder="Kết quả..." readonly></textarea>
      </div>
    </div>

    <div class="buttons">
      <button class="btn encrypt" onclick="process('encrypt')">🔒 Mã Hóa</button>
      <button class="btn decrypt" onclick="process('decrypt')">🔓 Giải Mã</button>
      <button class="btn copy" onclick="copyResult()">📋 Sao Chép</button>
      <button class="btn clear" onclick="clearAll()">🗑️ Xóa</button>
    </div>

    <div id="toast" class="toast"></div>
  </div>

  <script>
    let currentMethod = 'base64';

    // Chuyển tab
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentMethod = tab.dataset.method;
        updateKeySection();
      });
    });

    // Hiện/ẩn ô khóa
    function updateKeySection() {
      const keySection = document.getElementById('key-section');
      const keyLabel = document.getElementById('key-label');
      const keyInput = document.getElementById('key-input');

      if (currentMethod === 'caesar') {
        keySection.classList.remove('hidden');
        keyLabel.textContent = 'Khóa dịch chuyển (1-25):';
        keyInput.placeholder = 'Mặc định: 3';
      } else if (currentMethod === 'aes') {
        keySection.classList.remove('hidden');
        keyLabel.textContent = 'Mật khẩu AES:';
        keyInput.placeholder = 'Nhập mật khẩu bí mật...';
      } else {
        keySection.classList.add('hidden');
      }
    }

    // Gọi API
    async function process(action) {
      const text = document.getElementById('input').value;
      const key = document.getElementById('key-input').value;

      if (!text.trim()) {
        showToast('⚠️ Vui lòng nhập văn bản!', true);
        return;
      }

      try {
        const res = await fetch('/api/process', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            text: text,
            method: currentMethod,
            action: action,
            key: key
          })
        });

        const data = await res.json();

        if (data.success) {
          document.getElementById('output').value = data.result;
          showToast(action === 'encrypt' ? '🔒 Mã hóa thành công!' : '🔓 Giải mã thành công!');
        } else {
          showToast('❌ ' + data.error, true);
        }
      } catch (err) {
        showToast('❌ Lỗi kết nối server!', true);
        console.error(err);
      }
    }

    // Sao chép
    function copyResult() {
      const output = document.getElementById('output').value;
      if (!output) {
        showToast('⚠️ Không có gì để sao chép!', true);
        return;
      }
      navigator.clipboard.writeText(output).then(() => {
        showToast('📋 Đã sao chép!');
      });
    }

    // Xóa
    function clearAll() {
      document.getElementById('input').value = '';
      document.getElementById('output').value = '';
      document.getElementById('key-input').value = '';
      showToast('🗑️ Đã xóa!');
    }

    // Toast
    function showToast(msg, isError = false) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.style.background = isError ? '#e74c3c' : '#27ae60';
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    }
  </script>
</body>
</html>
