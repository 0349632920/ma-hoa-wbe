<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✍️ Viết văn AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #2d1b3d 50%, #0f0f1a 100%);
            color: #fff;
            padding: 30px 20px;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 20% 30%, rgba(102, 126, 234, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(218, 112, 214, 0.12) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 760px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 20px;
            color: #c8c8e0;
            text-decoration: none;
            padding: 10px 18px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(102, 126, 234, 0.2);
            border-radius: 10px;
            transition: all 0.2s;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .back:hover {
            color: #667eea;
            border-color: #667eea;
            transform: translateX(-4px);
        }

        h1 {
            text-align: center;
            margin-bottom: 12px;
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea, #764ba2, #da70d6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            text-align: center;
            color: #d0c0e0;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        .subtitle .ai-glow {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 10px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.25), rgba(118, 75, 162, 0.25));
            border: 1px solid rgba(102, 126, 234, 0.4);
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            color: #b8b8ff;
            margin-left: 6px;
        }

        .card {
            background: rgba(30, 20, 45, 0.85);
            border: 1px solid rgba(102, 126, 234, 0.15);
            border-radius: 20px;
            padding: 28px;
            margin-bottom: 20px;
            backdrop-filter: blur(20px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .form-group { margin-bottom: 20px; }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 700;
            font-size: 0.95rem;
            color: #e0d0f0;
        }

        textarea {
            width: 100%;
            padding: 16px 20px;
            font-size: 1rem;
            border-radius: 12px;
            border: 2px solid rgba(102, 126, 234, 0.2);
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            outline: none;
            font-family: inherit;
            transition: all 0.2s;
            resize: vertical;
            min-height: 90px;
            line-height: 1.6;
        }
        textarea:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
        }
        textarea::placeholder { color: #8a7a9a; }

        /* ═══ CHỌN LOẠI VĂN/THƠ ═══ */
        .loai-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .loai-btn {
            padding: 18px 14px;
            border-radius: 14px;
            border: 2px solid rgba(102, 126, 234, 0.2);
            background: rgba(0, 0, 0, 0.25);
            color: #fff;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .loai-btn:hover {
            background: rgba(102, 126, 234, 0.1);
            transform: translateY(-3px);
        }
        .loai-btn.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-color: transparent;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
        }
        .loai-btn[data-loai="bai_tho"].active {
            background: linear-gradient(135deg, #da70d6, #ba55d3);
            box-shadow: 0 8px 25px rgba(218, 112, 214, 0.5);
        }
        .loai-icon {
            font-size: 1.8rem;
        }
        .loai-name {
            font-weight: 800;
            font-size: 0.95rem;
        }
        .loai-desc {
            font-size: 0.75rem;
            opacity: 0.85;
            font-weight: 500;
        }

        /* ═══ CHỌN SỐ CÂU ═══ */
        .so-cau-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .sc-btn {
            padding: 14px 8px;
            border-radius: 12px;
            border: 2px solid rgba(102, 126, 234, 0.2);
            background: rgba(0, 0, 0, 0.25);
            color: #fff;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            font-weight: 700;
            font-size: 1rem;
            text-align: center;
        }
        .sc-btn:hover {
            background: rgba(102, 126, 234, 0.1);
            transform: translateY(-2px);
        }
        .sc-btn.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-color: transparent;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        .sc-btn small {
            display: block;
            font-size: 0.68rem;
            font-weight: 500;
            opacity: 0.85;
            margin-top: 3px;
        }

        /* Custom number input */
        .custom-input-wrap {
            grid-column: 1 / -1;
            margin-top: 4px;
        }
        .custom-input-wrap input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 2px solid rgba(102, 126, 234, 0.2);
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
        }
        .custom-input-wrap input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
        }
        .custom-input-wrap input::placeholder { color: #8a7a9a; }

        /* ═══ NÚT VIẾT ═══ */
        .write-btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2, #da70d6);
            background-size: 200% 200%;
            color: #fff;
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            margin-top: 8px;
            position: relative;
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            animation: gradientShift 3s ease infinite;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }
        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50%      { background-position: 100% 50%; }
        }
        .write-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.6);
        }
        .write-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .write-btn.loading {
            color: transparent;
            pointer-events: none;
        }
        .write-btn.loading::before {
            content: '';
            position: absolute;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        .write-btn.loading::after {
            content: '✍️ AI đang viết...';
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.85rem;
            color: #b8b8ff;
            white-space: nowrap;
            animation: aiPulse 1.5s ease-in-out infinite;
            font-weight: 600;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes aiPulse {
            0%, 100% { opacity: 0.5; }
            50%      { opacity: 1; }
        }

        /* ═══ KẾT QUẢ ═══ */
        .result-card {
            display: none;
            animation: slideUp 0.5s ease;
        }
        .result-card.show { display: block; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 2px dashed rgba(102, 126, 234, 0.3);
            flex-wrap: wrap;
            gap: 10px;
        }

        .result-title {
            font-size: 1.1rem;
            font-weight: 800;
            color: #b8b8ff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .result-stats {
            font-size: 0.82rem;
            color: #9999bb;
            font-family: 'JetBrains Mono', monospace;
            background: rgba(0, 0, 0, 0.3);
            padding: 6px 14px;
            border-radius: 20px;
        }

        .result-content {
            font-family: 'Lora', 'Georgia', serif;
            font-size: 1.08rem;
            line-height: 1.95;
            color: #e8e0f0;
            white-space: pre-line;
            text-align: justify;
            padding: 0 8px;
        }

        /* Đoạn văn - drop cap */
        .result-content.doan_van::first-letter {
            font-size: 3.2rem;
            font-weight: 800;
            float: left;
            line-height: 0.9;
            margin: 6px 12px 0 0;
            background: linear-gradient(135deg, #667eea, #da70d6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-family: 'Lora', serif;
        }

        /* Bài thơ - căn giữa, in nghiêng */
        .result-content.bai_tho {
            text-align: center;
            font-style: italic;
            font-size: 1.15rem;
            line-height: 2.1;
            letter-spacing: 0.3px;
        }

        .result-content.bai_tho::first-letter {
            font-size: inherit;
            font-weight: inherit;
            float: none;
            margin: 0;
            color: inherit;
            -webkit-text-fill-color: inherit;
            background: none;
        }

        .result-actions {
            display: flex;
            gap: 10px;
            margin-top: 24px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .result-btn {
            padding: 12px 22px;
            border-radius: 12px;
            border: 1px solid rgba(102, 126, 234, 0.3);
            background: rgba(102, 126, 234, 0.1);
            color: #b8b8ff;
            font-family: inherit;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .result-btn:hover {
            background: rgba(102, 126, 234, 0.25);
            transform: translateY(-2px);
        }

        /* ═══ TOAST ═══ */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #667eea;
            color: #fff;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 700;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transition: all 0.4s;
            pointer-events: none;
            z-index: 9999;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        .toast.error { background: #e74c3c; }

        /* ═══ RESPONSIVE ═══ */
        @media (max-width: 480px) {
            h1 { font-size: 1.6rem; }
            .card { padding: 20px; }
            .loai-grid { grid-template-columns: 1fr; }
            .so-cau-grid { grid-template-columns: repeat(2, 1fr); }
            .result-content { font-size: 1rem; }
            .result-content.bai_tho { font-size: 1.05rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="{{ url_for('index') }}" class="back">← Về trang chủ</a>

        <h1>✍️ Viết văn AI</h1>
        <p class="subtitle">
            Nhập đề bài — AI viết văn cho bạn
            <span class="ai-glow">🤖 Groq Llama 3</span>
        </p>

        <div class="card">
            <div class="form-group">
                <label>📚 Chọn loại</label>
                <div class="loai-grid">
                    <button class="loai-btn active" data-loai="doan_van" onclick="selectLoai('doan_van')">
                        <span class="loai-icon">📝</span>
                        <span class="loai-name">Đoạn văn</span>
                        <span class="loai-desc">Viết liền mạch</span>
                    </button>
                    <button class="loai-btn" data-loai="bai_tho" onclick="selectLoai('bai_tho')">
                        <span class="loai-icon">📖</span>
                        <span class="loai-name">Bài thơ</span>
                        <span class="loai-desc">3 phần đầy đủ</span>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label>📝 Đề bài</label>
                <textarea id="deBai" placeholder="Ví dụ: Tả cảnh mùa thu Hà Nội&#10;Hoặc: Kể lại một kỷ niệm đáng nhớ của em&#10;Hoặc: Nghị luận về ý nghĩa của việc học tập..." maxlength="500"></textarea>
            </div>

            <div class="form-group">
                <label>📏 Số câu</label>
                <div class="so-cau-grid" id="soCauGrid">
                    <button class="sc-btn" data-sc="5" onclick="selectSC(5)">
                        5<small>câu</small>
                    </button>
                    <button class="sc-btn active" data-sc="10" onclick="selectSC(10)">
                        10<small>câu</small>
                    </button>
                    <button class="sc-btn" data-sc="15" onclick="selectSC(15)">
                        15<small>câu</small>
                    </button>
                    <button class="sc-btn" data-sc="20" onclick="selectSC(20)">
                        20<small>câu</small>
                    </button>
                    <button class="sc-btn" data-sc="30" onclick="selectSC(30)">
                        30<small>câu</small>
                    </button>
                    <button class="sc-btn" data-sc="50" onclick="selectSC(50)">
                        50<small>câu</small>
                    </button>
                    <div class="custom-input-wrap">
                        <input type="number" id="soCauCustom" min="3" max="50"
                               placeholder="Hoặc nhập số câu tùy chỉnh (3-50)"
                               oninput="selectCustomSC()">
                    </div>
                </div>
            </div>

            <button class="write-btn" id="writeBtn" onclick="writeVan()">
                <span>✍️ Viết ngay</span>
            </button>
        </div>

        <div class="card result-card" id="resultCard">
            <div class="result-header">
                <div class="result-title" id="resultTitle">
                    <span>📄</span> Kết quả
                </div>
                <div class="result-stats" id="resultStats">—</div>
            </div>

            <div class="result-content" id="resultContent">—</div>

            <div class="result-actions">
                <button class="result-btn" onclick="copyVan()">
                    📋 Sao chép
                </button>
                <button class="result-btn" onclick="downloadVan()">
                    📥 Tải về
                </button>
                <button class="result-btn" onclick="writeVan()">
                    🔄 Viết lại
                </button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let currentSC = 10;
        let currentLoai = 'doan_van';

        // ═══════════════════════════════════════
        //  CHỌN LOẠI
        // ═══════════════════════════════════════
        function selectLoai(loai) {
            currentLoai = loai;
            document.querySelectorAll('.loai-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.loai === loai);
            });

            // Đổi placeholder theo loại
            const deBai = document.getElementById('deBai');
            if (loai === 'bai_tho') {
                deBai.placeholder = 'Ví dụ: Mùa thu Hà Nội\nHoặc: Tình yêu tuổi học trò\nHoặc: Quê hương...';
            } else {
                deBai.placeholder = 'Ví dụ: Tả cảnh mùa thu Hà Nội\nHoặc: Kể lại một kỷ niệm đáng nhớ\nHoặc: Nghị luận về ý nghĩa của việc học tập...';
            }

            // Đổi text nút
            const btn = document.getElementById('writeBtn');
            btn.querySelector('span').textContent = loai === 'bai_tho' ? '✍️ Làm thơ' : '✍️ Viết văn';
        }

        // ═══════════════════════════════════════
        //  CHỌN SỐ CÂU
        // ═══════════════════════════════════════
        function selectSC(sc) {
            currentSC = sc;
            document.getElementById('soCauCustom').value = '';
            document.querySelectorAll('.sc-btn').forEach(b => {
                b.classList.toggle('active', parseInt(b.dataset.sc) === sc);
            });
        }

        function selectCustomSC() {
            const val = parseInt(document.getElementById('soCauCustom').value);
            if (val >= 3 && val <= 50) {
                currentSC = val;
                document.querySelectorAll('.sc-btn').forEach(b => b.classList.remove('active'));
            }
        }

        // ═══════════════════════════════════════
        //  VIẾT
        // ═══════════════════════════════════════
        async function writeVan() {
            const deBai = document.getElementById('deBai').value.trim();

            if (!deBai) {
                showToast('⚠️ Vui lòng nhập đề bài!', true);
                document.getElementById('deBai').focus();
                return;
            }

            const btn = document.getElementById('writeBtn');
            btn.classList.add('loading');
            btn.disabled = true;

            try {
                const res = await fetch('/api/write', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        de_bai: deBai,
                        so_cau: currentSC,
                        loai: currentLoai,
                    })
                });

                if (res.status === 401) { window.location.href = '/login'; return; }

                const data = await res.json();

                if (!data.success) {
                    showToast('❌ ' + (data.error || 'Có lỗi xảy ra!'), true);
                    return;
                }

                renderResult(data);
                showToast(currentLoai === 'bai_tho' ? '✅ AI đã làm thơ xong!' : '✅ AI đã viết xong!');
            } catch (e) {
                showToast('❌ Lỗi kết nối!', true);
            } finally {
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        }

        function renderResult(data) {
            const card = document.getElementById('resultCard');
            card.classList.remove('show');
            void card.offsetWidth;
            card.classList.add('show');

            const isTho = data.loai === 'bai_tho';

            // Tiêu đề
            document.getElementById('resultTitle').innerHTML = isTho
                ? '<span>📖</span> Bài thơ'
                : '<span>📄</span> Đoạn văn';

            // Stats
            const loaiLabel = isTho ? '📖 Bài thơ' : '📝 Đoạn văn';
            document.getElementById('resultStats').textContent =
                `${loaiLabel} · Yêu cầu: ${data.so_cau_yeu_cau} câu · Thực tế: ~${data.so_cau_thuc_te} câu`;

            // Content — đổi class theo loại
            const content = document.getElementById('resultContent');
            content.className = 'result-content ' + (isTho ? 'bai_tho' : 'doan_van');
            content.textContent = data.noi_dung || '—';

            setTimeout(() => {
                card.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 200);
        }

        // ═══════════════════════════════════════
        //  COPY / DOWNLOAD
        // ═══════════════════════════════════════
        function copyVan() {
            const text = document.getElementById('resultContent').textContent;
            if (!text || text === '—') return;

            navigator.clipboard.writeText(text).then(() => {
                showToast('📋 Đã sao chép!');
            }).catch(() => {
                showToast('❌ Không thể sao chép!', true);
            });
        }

        function downloadVan() {
            const deBai = document.getElementById('deBai').value.trim();
            const noiDung = document.getElementById('resultContent').textContent;
            const isTho = currentLoai === 'bai_tho';

            let text = `ĐỀ BÀI: ${deBai}\n${'='.repeat(50)}\n\n${noiDung}`;
            text += `\n\n${'─'.repeat(50)}\n© Mã Hóa Tool — ${isTho ? 'Làm thơ AI' : 'Viết văn AI'}`;

            const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${isTho ? 'bai-tho' : 'bai-van'}-${Date.now()}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            showToast('📥 Đã tải về!');
        }

        // ═══════════════════════════════════════
        //  UTILS
        // ═══════════════════════════════════════
        function showToast(msg, isError = false) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast show' + (isError ? ' error' : '');
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        // Focus đề bài
        setTimeout(() => document.getElementById('deBai').focus(), 300);

        // Ctrl+Enter để viết
        document.getElementById('deBai').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                writeVan();
            }
        });
    </script>
