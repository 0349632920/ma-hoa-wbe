<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔐 Đăng nhập — Mã Hóa Tool</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
      position: relative;
      transition: background 0.6s ease;
    }

    .bg-emoji {
      position: absolute;
      font-size: 40px;
      opacity: 0.15;
      animation: floatEmoji 8s ease-in-out infinite;
      pointer-events: none;
      user-select: none;
    }

    @keyframes floatEmoji {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-40px) rotate(20deg); }
    }

    .login-container {
      background: #fff;
      border-radius: 24px;
      padding: 50px 45px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0,0,0,0.35);
      position: relative;
      z-index: 2;
      animation: slideUp 0.6s ease;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-logo {
      text-align: center;
      margin-bottom: 35px;
    }

    .login-logo-icon {
      font-size: 50px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      width: 85px;
      height: 85px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 22px;
      margin: 0 auto 18px;
      box-shadow: 0 12px 30px rgba(102,126,234,0.45);
      animation: logoPulse 2s ease-in-out infinite;
    }

    @keyframes logoPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .login-logo h1 {
      font-size: 26px;
      color: #333;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .login-logo h1 span { color: #667eea; }

    .login-logo p {
      color: #888;
      font-size: 14px;
    }

    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: #f0f2fa;
      padding: 6px;
      border-radius: 14px;
      margin-bottom: 28px;
      position: relative;
    }

    .auth-tab-indicator {
      position: absolute;
      top: 6px;
      left: 6px;
      width: calc(50% - 6px);
      height: calc(100% - 12px);
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 10px;
      box-shadow: 0 6px 18px rgba(102,126,234,0.4);
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 1;
    }

    .auth-tabs.register-mode .auth-tab-indicator {
      transform: translateX(100%);
    }

    .auth-tab {
      position: relative;
      z-index: 2;
      padding: 12px;
      border: none;
      background: transparent;
      cursor: pointer;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      color: #777;
      border-radius: 10px;
      transition: color 0.3s;
    }

    .auth-tab.active { color: white; }

    .form-group {
      margin-bottom: 18px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #555;
      margin-bottom: 8px;
    }

    .input-wrapper { position: relative; }

    .input-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
      pointer-events: none;
    }

    .form-input {
      width: 100%;
      padding: 14px 16px 14px 48px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      font-size: 15px;
      font-family: inherit;
      transition: 0.3s;
    }

    .form-input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 4px rgba(102,126,234,0.12);
    }

    .form-input.error {
      border-color: #e74c3c;
      animation: shake 0.4s;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .toggle-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 18px;
      padding: 4px;
      border-radius: 6px;
      transition: 0.2s;
    }

    .toggle-password:hover { background: #f0f0f5; }

    .password-strength {
      display: flex;
      gap: 4px;
      margin-top: 8px;
    }

    .strength-bar {
      flex: 1;
      height: 4px;
      background: #e0e0e0;
      border-radius: 4px;
      transition: 0.3s;
    }

    .strength-bar.weak { background: #e74c3c; }
    .strength-bar.medium { background: #f39c12; }
    .strength-bar.strong { background: #27ae60; }

    .strength-text {
      font-size: 12px;
      margin-top: 6px;
      color: #888;
      font-weight: 500;
    }

    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
      font-size: 14px;
    }

    .checkbox-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      color: #555;
    }

    .checkbox-wrapper input {
      width: 18px;
      height: 18px;
      accent-color: #667eea;
      cursor: pointer;
    }

    .forgot-link {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
      transition: 0.2s;
    }

    .forgot-link:hover { text-decoration: underline; }

    .error-box {
      padding: 12px 16px;
      background: #ffebee;
      border-left: 4px solid #e74c3c;
      border-radius: 10px;
      color: #c0392b;
      font-size: 14px;
      margin-bottom: 18px;
      animation: slideDown 0.3s ease;
      display: none;
      white-space: pre-line;
    }

    .error-box.show { display: block; }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .btn-submit {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-submit:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(102,126,234,0.45);
    }

    .btn-submit:disabled {
      opacity: 0.7;
      cursor: wait;
    }

    .btn-submit .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    .btn-submit.loading .spinner { display: block; }
    .btn-submit.loading .btn-text { display: none; }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #333;
      color: white;
      padding: 14px 28px;
      border-radius: 30px;
      font-size: 15px;
      opacity: 0;
      transition: 0.4s;
      pointer-events: none;
      z-index: 9999;
      box-shadow: 0 12px 35px rgba(0,0,0,0.35);
      max-width: 90vw;
      text-align: center;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Hiệu ứng khi bị ban */
    @keyframes bannedShake {
      0%, 100% { transform: translateX(0); }
      10%, 30%, 50%, 70%, 90% { transform: translateX(-10px); }
      20%, 40%, 60%, 80% { transform: translateX(10px); }
    }

    body.banned-mode {
      background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%) !important;
      animation: bannedShake 0.6s ease;
    }

    .login-container.banned-shake {
      animation: bannedShake 0.6s ease;
      border: 4px solid #e74c3c !important;
      box-shadow: 0 0 40px rgba(231,76,60,0.8), 0 30px 80px rgba(0,0,0,0.35) !important;
    }

    /* Hiệu ứng khi bị đánh dấu xóa */
    body.deleted-mode {
      background: linear-gradient(135deg, #8e44ad 0%, #6c3483 100%) !important;
      animation: bannedShake 0.6s ease;
    }

    .login-container.deleted-shake {
      animation: bannedShake 0.6s ease;
      border: 4px solid #8e44ad !important;
      box-shadow: 0 0 40px rgba(142,68,173,0.8), 0 30px 80px rgba(0,0,0,0.35) !important;
    }

    @media (max-width: 500px) {
      .login-container { padding: 35px 25px; }
      .login-logo h1 { font-size: 22px; }
      .login-logo-icon { width: 70px; height: 70px; font-size: 40px; }
    }
  </style>
</head>
<body>
  <!-- Emojis trang trí -->
  <div class="bg-emoji" style="top:10%;left:8%;animation-delay:0s">🔐</div>
  <div class="bg-emoji" style="top:20%;right:12%;animation-delay:0.5s">🔒</div>
  <div class="bg-emoji" style="bottom:15%;left:15%;animation-delay:1s">🔑</div>
  <div class="bg-emoji" style="bottom:20%;right:10%;animation-delay:1.5s">🛡️</div>
  <div class="bg-emoji" style="top:50%;left:5%;animation-delay:2s">💻</div>
  <div class="bg-emoji" style="top:60%;right:6%;animation-delay:2.5s">⚡</div>

  <div class="login-container" id="loginContainer">
    <div class="login-logo">
      <div class="login-logo-icon">🔐</div>
      <h1>Mã Hóa <span>Tool</span></h1>
      <p>Đăng nhập để sử dụng công cụ</p>
    </div>

    <!-- Tabs -->
    <div class="auth-tabs" id="authTabs">
      <div class="auth-tab-indicator"></div>
      <button class="auth-tab active" id="tabLogin">🔓 Đăng nhập</button>
      <button class="auth-tab" id="tabRegister">✨ Đăng ký</button>
    </div>

    <!-- Error box -->
    <div class="error-box" id="errorBox"></div>

    <!-- Form -->
    <form id="authForm" onsubmit="return false;">
      <div class="form-group">
        <label>👤 Tên đăng nhập</label>
        <div class="input-wrapper">
          <span class="input-icon">👤</span>
          <input type="text" class="form-input" id="usernameInput"
                 placeholder="Nhập tên đăng nhập..." autocomplete="username" required>
        </div>
      </div>

      <div class="form-group">
        <label>🔑 Mật khẩu</label>
        <div class="input-wrapper">
          <span class="input-icon">🔑</span>
          <input type="password" class="form-input" id="passwordInput"
                 placeholder="Nhập mật khẩu..." autocomplete="current-password" required>
          <button type="button" class="toggle-password" id="togglePassword">👁️</button>
        </div>

        <div id="strengthSection" style="display:none">
          <div class="password-strength">
            <div class="strength-bar" id="bar1"></div>
            <div class="strength-bar" id="bar2"></div>
            <div class="strength-bar" id="bar3"></div>
            <div class="strength-bar" id="bar4"></div>
          </div>
          <div class="strength-text" id="strengthText">Độ mạnh mật khẩu</div>
        </div>
      </div>

      <div class="form-group" id="confirmGroup" style="display:none">
        <label>🔒 Nhập lại mật khẩu</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input type="password" class="form-input" id="confirmInput"
                 placeholder="Nhập lại mật khẩu..." autocomplete="new-password">
        </div>
      </div>

      <div class="form-options" id="optionsRow">
        <label class="checkbox-wrapper">
          <input type="checkbox" id="rememberCheck">
          <span>Ghi nhớ đăng nhập</span>
        </label>
        <a href="#" class="forgot-link" onclick="showToast('💡 Liên hệ admin để lấy lại mật khẩu!'); return false;">Quên mật khẩu?</a>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">
        <span class="spinner"></span>
        <span class="btn-text">🔓 Đăng nhập</span>
      </button>
    </form>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let mode = 'login';

    const tabs = document.getElementById('authTabs');
    const tabLogin = document.getElementById('tabLogin');
    const tabRegister = document.getElementById('tabRegister');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = submitBtn.querySelector('.btn-text');
    const errorBox = document.getElementById('errorBox');
    const usernameInput = document.getElementById('usernameInput');
    const passwordInput = document.getElementById('passwordInput');
    const confirmInput = document.getElementById('confirmInput');
    const confirmGroup = document.getElementById('confirmGroup');
    const strengthSection = document.getElementById('strengthSection');
    const optionsRow = document.getElementById('optionsRow');
    const rememberCheck = document.getElementById('rememberCheck');

    function setMode(newMode) {
      mode = newMode;
      hideError();

      if (mode === 'login') {
        tabs.classList.remove('register-mode');
        tabLogin.classList.add('active');
        tabRegister.classList.remove('active');
        confirmGroup.style.display = 'none';
        strengthSection.style.display = 'none';
        optionsRow.style.display = 'flex';
        btnText.textContent = '🔓 Đăng nhập';
        passwordInput.autocomplete = 'current-password';
      } else {
        tabs.classList.add('register-mode');
        tabRegister.classList.add('active');
        tabLogin.classList.remove('active');
        confirmGroup.style.display = 'block';
        strengthSection.style.display = 'block';
        optionsRow.style.display = 'none';
        btnText.textContent = '✨ Đăng ký';
        passwordInput.autocomplete = 'new-password';
      }
    }

    tabLogin.addEventListener('click', () => setMode('login'));
    tabRegister.addEventListener('click', () => setMode('register'));

    document.getElementById('togglePassword').addEventListener('click', function() {
      const type = passwordInput.type === 'password' ? 'text' : 'password';
      passwordInput.type = type;
      this.textContent = type === 'password' ? '👁️' : '🙈';
    });

    passwordInput.addEventListener('input', () => {
      if (mode !== 'register') return;
      const pwd = passwordInput.value;
      const strength = calcStrength(pwd);
      const bars = ['bar1','bar2','bar3','bar4'].map(id => document.getElementById(id));
      const text = document.getElementById('strengthText');

      bars.forEach(b => { b.className = 'strength-bar'; });

      if (pwd.length === 0) {
        text.textContent = 'Độ mạnh mật khẩu';
        return;
      }

      const cls = strength <= 1 ? 'weak' : strength === 2 ? 'medium' : 'strong';
      for (let i = 0; i < strength; i++) bars[i].classList.add(cls);

      const labels = ['', 'Yếu 😟', 'Trung bình 😐', 'Khá tốt 🙂', 'Rất mạnh 💪'];
      text.textContent = 'Độ mạnh: ' + labels[strength];
    });

    function calcStrength(pwd) {
      let s = 0;
      if (pwd.length >= 6) s++;
      if (pwd.length >= 10) s++;
      if (/[A-Z]/.test(pwd) && /[a-z]/.test(pwd)) s++;
      if (/\d/.test(pwd)) s++;
      if (/[!@#$%^&*(),.?":{}|<>]/.test(pwd)) s++;
      return Math.min(s, 4);
    }

    document.getElementById('authForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      await submit();
    });

    submitBtn.addEventListener('click', async (e) => {
      e.preventDefault();
      await submit();
    });

    async function submit() {
      hideError();

      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      if (!username || !password) {
        showError('Vui lòng nhập đầy đủ thông tin!');
        return;
      }
      if (mode === 'register') {
        if (username.length < 3) {
          showError('Tên đăng nhập phải có ít nhất 3 ký tự!');
          return;
        }
        if (password.length < 6) {
          showError('Mật khẩu phải có ít nhất 6 ký tự!');
          return;
        }
        if (password !== confirmInput.value) {
          showError('Mật khẩu nhập lại không khớp!');
          return;
        }
      }

      submitBtn.disabled = true;
      submitBtn.classList.add('loading');

      try {
        const endpoint = mode === 'login' ? '/api/login' : '/api/register';
        const body = mode === 'login'
          ? { username, password, remember: rememberCheck.checked }
          : { username, password };

        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await res.json();

        // THÀNH CÔNG
        if (data.success) {
          showToast(data.message || '✅ Thành công!');
          setTimeout(() => { window.location.href = '/'; }, 700);
          return;
        }

        // BỊ BAN
        if (data.banned) {
          document.body.classList.add('banned-mode');
          document.getElementById('loginContainer').classList.add('banned-shake');
          showError('🚫 Tài khoản đã bị BAN!\nĐang chuyển đến trang thông báo...');
          setTimeout(() => {
            window.location.href = data.redirect || '/banned';
          }, 1800);
          return;
        }

        // BỊ ĐÁNH DẤU XÓA
        if (data.pending_delete) {
          document.body.classList.add('deleted-mode');
          document.getElementById('loginContainer').classList.add('deleted-shake');
          showError('🗑️ Tài khoản đã bị đánh dấu XÓA!\nĐang chuyển đến trang xác nhận...');
          setTimeout(() => {
            window.location.href = data.redirect || '/deleted';
          }, 1800);
          return;
        }

        // LỖI
        showError(data.error || 'Có lỗi xảy ra!');
        submitBtn.disabled = false;
        submitBtn.classList.remove('loading');

      } catch (err) {
        showError('❌ Lỗi kết nối server!');
        submitBtn.disabled = false;
        submitBtn.classList.remove('loading');
      }
    }

    function showError(msg) {
      errorBox.textContent = '❌ ' + msg;
      errorBox.classList.add('show');
      if (msg.includes('Tên') || msg.includes('đăng nhập')) {
        usernameInput.classList.add('error');
        setTimeout(() => usernameInput.classList.remove('error'), 500);
      } else if (msg.includes('Mật khẩu')) {
        passwordInput.classList.add('error');
        setTimeout(() => passwordInput.classList.remove('error'), 500);
      }
    }

    function hideError() { errorBox.classList.remove('show'); }

    function showToast(msg, isError = false) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.background = isError ? '#e74c3c' : '#27ae60';
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (
        e.target === usernameInput ||
        e.target === passwordInput ||
        e.target === confirmInput
      )) {
        submit();
      }
    });
  </script>
</body>
</html>
