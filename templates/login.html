<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 Đăng nhập - Mã Hóa Chữ</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <span class="login-icon">🔐</span>
                <h1>MÃ HÓA CHỮ</h1>
                <p class="login-subtitle">Bảo vệ thông tin của bạn</p>
            </div>

            <div class="login-tabs">
                <button class="login-tab active" data-tab="login">Đăng nhập</button>
                <button class="login-tab" data-tab="register">Đăng ký</button>
            </div>

            <form class="login-form" id="login-form">
                <div class="form-group">
                    <label>👤 Tên đăng nhập</label>
                    <input type="text" id="login-username" placeholder="Nhập tên đăng nhập..." autocomplete="username">
                </div>
                <div class="form-group">
                    <label>🔒 Mật khẩu</label>
                    <div class="password-input">
                        <input type="password" id="login-password" placeholder="Nhập mật khẩu..." autocomplete="current-password">
                        <button type="button" class="eye-btn" data-target="login-password">👁</button>
                    </div>
                </div>
                <div class="login-error" id="login-error"></div>
                <button type="submit" class="login-submit">🔓 ĐĂNG NHẬP</button>
            </form>

            <form class="login-form hidden" id="register-form">
                <div class="form-group">
                    <label>👤 Tên đăng nhập</label>
                    <input type="text" id="reg-username" placeholder="VD: nguyenvana" autocomplete="username">
                </div>
                <div class="form-group">
                    <label>🔒 Mật khẩu</label>
                    <div class="password-input">
                        <input type="password" id="reg-password" placeholder="Ít nhất 6 ký tự..." autocomplete="new-password">
                        <button type="button" class="eye-btn" data-target="reg-password">👁</button>
                    </div>
                </div>
                <div class="form-group">
                    <label>🔒 Nhập lại mật khẩu</label>
                    <div class="password-input">
                        <input type="password" id="reg-password2" placeholder="Nhập lại mật khẩu..." autocomplete="new-password">
                        <button type="button" class="eye-btn" data-target="reg-password2">👁</button>
                    </div>
                </div>
                <div class="login-error" id="register-error"></div>
                <button type="submit" class="login-submit register">✨ TẠO TÀI KHOẢN</button>
            </form>

            <div class="login-footer">
                <span>🚀 Hơn <b>40 thuật toán</b> mã hóa</span>
            </div>
        </div>

        <!-- Trang trí nền -->
        <div class="bg-decoration">
            <div class="blob blob-1"></div>
            <div class="blob blob-2"></div>
            <div class="blob blob-3"></div>
        </div>
    </div>

    <script>
    // ============================================================
    // TOGGLE TABS
    // ============================================================
    document.querySelectorAll(".login-tab").forEach(tab => {
        tab.addEventListener("click", () => {
            document.querySelectorAll(".login-tab").forEach(t => t.classList.remove("active"));
            tab.classList.add("active");

            const target = tab.dataset.tab;
            document.getElementById("login-form").classList.toggle("hidden", target !== "login");
            document.getElementById("register-form").classList.toggle("hidden", target !== "register");
        });
    });

    // ============================================================
    // TOGGLE PASSWORD
    // ============================================================
    document.querySelectorAll(".eye-btn").forEach(btn => {
        btn.addEventListener("click", () => {
            const inp = document.getElementById(btn.dataset.target);
            if (inp.type === "password") {
                inp.type = "text";
                btn.textContent = "🙈";
            } else {
                inp.type = "password";
                btn.textContent = "👁";
            }
        });
    });

    // ============================================================
    // LOGIN
    // ============================================================
    document.getElementById("login-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const username = document.getElementById("login-username").value.trim();
        const password = document.getElementById("login-password").value;
        const errEl = document.getElementById("login-error");
        const btn = e.target.querySelector(".login-submit");

        errEl.textContent = "";
        if (!username || !password) {
            errEl.textContent = "⚠ Vui lòng nhập đầy đủ";
            return;
        }

        btn.disabled = true;
        btn.textContent = "⏳ Đang đăng nhập...";

        try {
            const res = await fetch("/api/login", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({username, password})
            });
            const data = await res.json();

            if (data.success) {
                btn.textContent = "✅ Thành công!";
                setTimeout(() => window.location.href = "/", 500);
            } else {
                errEl.textContent = "❌ " + data.error;
                btn.disabled = false;
                btn.textContent = "🔓 ĐĂNG NHẬP";
            }
        } catch (err) {
            errEl.textContent = "❌ Lỗi kết nối";
            btn.disabled = false;
            btn.textContent = "🔓 ĐĂNG NHẬP";
        }
    });

    // ============================================================
    // REGISTER
    // ============================================================
    document.getElementById("register-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const username = document.getElementById("reg-username").value.trim();
        const password = document.getElementById("reg-password").value;
        const password2 = document.getElementById("reg-password2").value;
        const errEl = document.getElementById("register-error");
        const btn = e.target.querySelector(".login-submit");

        errEl.textContent = "";
        if (!username || !password || !password2) {
            errEl.textContent = "⚠ Vui lòng nhập đầy đủ";
            return;
        }
        if (password !== password2) {
            errEl.textContent = "❌ Mật khẩu nhập lại không khớp";
            return;
        }

        btn.disabled = true;
        btn.textContent = "⏳ Đang tạo...";

        try {
            const res = await fetch("/api/register", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({username, password})
            });
            const data = await res.json();

            if (data.success) {
                btn.textContent = "✅ Thành công!";
                setTimeout(() => window.location.href = "/", 500);
            } else {
                errEl.textContent = "❌ " + data.error;
                btn.disabled = false;
                btn.textContent = "✨ TẠO TÀI KHOẢN";
            }
        } catch (err) {
            errEl.textContent = "❌ Lỗi kết nối";
            btn.disabled = false;
            btn.textContent = "✨ TẠO TÀI KHOẢN";
        }
    });

    // Enter để submit
    document.getElementById("login-password").addEventListener("keypress", (e) => {
        if (e.key === "Enter") document.getElementById("login-form").requestSubmit();
    });
    document.getElementById("reg-password2").addEventListener("keypress", (e) => {
        if (e.key === "Enter") document.getElementById("register-form").requestSubmit();
    });
    </script>
</body>
</html>
