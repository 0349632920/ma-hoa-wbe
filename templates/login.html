<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 Đăng nhập</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Nền động */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 20% 30%, rgba(102, 126, 234, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(218, 112, 214, 0.15) 0%, transparent 50%);
            pointer-events: none;
        }

        /* Splash Screen */
        .splash {
            position: fixed; inset: 0; z-index: 9999;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            display: flex; align-items: center; justify-content: center;
            flex-direction: column;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .splash.hide { opacity: 0; visibility: hidden; }
        .splash-icon {
            font-size: 5rem;
            animation: bounce 1.5s ease infinite;
            margin-bottom: 20px;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        .splash h2 { font-weight: 800; font-size: 1.8rem; margin-bottom: 10px; }
        .splash p { color: #c8c8e0; }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-top: 30px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Login Form */
        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            background: rgba(20, 15, 35, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 32px;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        .login-container.show {
            opacity: 1;
            transform: translateY(0);
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-header .logo {
            font-size: 3rem;
            margin-bottom: 12px;
            display: inline-block;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        .login-header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #b8b8ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 6px;
        }
        .login-header p { color: #9999bb; font-size: 0.95rem; }

        /* Notice if redirected */
        .redirect-notice {
            background: rgba(102, 126, 234, 0.15);
            border: 1px solid rgba(102, 126, 234, 0.4);
            border-radius: 12px;
            padding: 10px 16px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            color: #b8b8ff;
            text-align: center;
            display: none;
        }
        .redirect-notice.show { display: block; }

        /* Tabs */
        .tabs {
            display: flex;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 24px;
        }
        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.9rem;
            color: #9999bb;
            transition: all 0.2s;
        }
        .tab.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        /* Form inputs */
        .form-group {
            margin-bottom: 16px;
            position: relative;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #c8c8e0;
            margin-bottom: 8px;
        }
        .input-wrap {
            position: relative;
        }
        .input-wrap input {
            width: 100%;
            padding: 14px 16px 14px 44px;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
        }
        .input-wrap input:focus {
            border-color: #667eea;
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
        }
        .input-wrap input::placeholder { color: #666; }
        
        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.1rem;
            opacity: 0.6;
            pointer-events: none;
        }

        .toggle-pw {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: #9999bb;
            cursor: pointer;
            font-size: 1.1rem;
            padding: 4px;
            border-radius: 6px;
            transition: all 0.2s;
        }
        .toggle-pw:hover { color: #fff; background: rgba(255, 255, 255, 0.1); }

        /* Checkbox */
        .remember-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
        }
        .remember-row input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #667eea;
            cursor: pointer;
        }
        .remember-row label {
            font-size: 0.85rem;
            color: #c8c8e0;
            cursor: pointer;
            user-select: none;
        }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }
        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(102, 126, 234, 0.6);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn.loading {
            color: transparent;
            pointer-events: none;
        }
        .btn.loading::before {
            content: '';
            position: absolute;
            width: 22px;
            height: 22px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        /* 2FA Section */
        .tfa-section {
            display: none;
            text-align: center;
        }
        .tfa-section.show { display: block; }
        .tfa-icon { font-size: 3rem; margin-bottom: 16px; display: block; }
        .tfa-title { font-size: 1.2rem; font-weight: 800; margin-bottom: 8px; }
        .tfa-subtitle { font-size: 0.85rem; color: #9999bb; margin-bottom: 24px; line-height: 1.5; }
        .tfa-input {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: 2px solid rgba(102, 126, 234, 0.3);
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            font-size: 1.8rem;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 8px;
            text-align: center;
            outline: none;
            margin-bottom: 20px;
            transition: all 0.2s;
        }
        .tfa-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
        }
        .tfa-back {
            background: transparent;
            border: none;
            color: #9999bb;
            font-size: 0.85rem;
            margin-top: 16px;
            cursor: pointer;
            font-family: inherit;
            text-decoration: underline;
        }
        .tfa-back:hover { color: #fff; }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #27ae60;
            color: #fff;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 600;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transition: all 0.4s;
            pointer-events: none;
            z-index: 10000;
            max-width: 90vw;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        .toast.error { background: #e74c3c; }
    </style>
</head>
<body>

    <!-- SPLASH SCREEN -->
    <div class="splash" id="splash">
        <div class="splash-icon">🔐</div>
        <h2>Mã Hóa Tool</h2>
        <p>Đang chuẩn bị hệ thống...</p>
        <div class="spinner"></div>
    </div>

    <!-- LOGIN CONTAINER -->
    <div class="login-container" id="loginContainer">
        
        <!-- CHẾ ĐỘ 1: ĐĂNG NHẬP / ĐĂNG KÝ -->
        <div id="authSection">
            <div class="login-header">
                <div class="logo">🔐</div>
                <h1 id="authTitle">Đăng nhập</h1>
                <p id="authSubtitle">Chào mừng bạn trở lại!</p>
            </div>

            <!-- Thông báo chuyển hướng (nếu có ?next=) -->
            <div class="redirect-notice" id="redirectNotice">
                🔒 Trang bạn muốn vào yêu cầu đăng nhập.
            </div>

            <div class="tabs">
                <div class="tab active" id="tabLogin" onclick="switchAuthMode('login')">🔓 Đăng nhập</div>
                <div class="tab" id="tabRegister" onclick="switchAuthMode('register')">✍️ Đăng ký</div>
            </div>

            <!-- Form Login -->
            <form id="loginForm" onsubmit="doLogin(event)">
                <div class="form-group">
                    <label>Tên đăng nhập</label>
                    <div class="input-wrap">
                        <span class="input-icon">👤</span>
                        <input type="text" id="username" placeholder="Nhập tên đăng nhập..." autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label>Mật khẩu</label>
                    <div class="input-wrap">
                        <span class="input-icon">🔑</span>
                        <input type="password" id="password" placeholder="Nhập mật khẩu..." autocomplete="current-password">
                        <button type="button" class="toggle-pw" onclick="togglePw('password', this)">👁️</button>
                    </div>
                </div>

                <div class="remember-row">
                    <input type="checkbox" id="remember">
                    <label for="remember">Ghi nhớ đăng nhập</label>
                </div>

                <button type="submit" class="btn" id="loginBtn">
                    🔓 Đăng nhập
                </button>
            </form>

            <!-- Form Register -->
            <form id="registerForm" style="display: none;" onsubmit="doRegister(event)">
                <div class="form-group">
                    <label>Tên đăng nhập</label>
                    <div class="input-wrap">
                        <span class="input-icon">👤</span>
                        <input type="text" id="regUsername" placeholder="Tối thiểu 3 ký tự..." autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label>Mật khẩu</label>
                    <div class="input-wrap">
                        <span class="input-icon">🔑</span>
                        <input type="password" id="regPassword" placeholder="Tối thiểu 6 ký tự..." autocomplete="new-password">
                        <button type="button" class="toggle-pw" onclick="togglePw('regPassword', this)">👁️</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>Nhập lại mật khẩu</label>
                    <div class="input-wrap">
                        <span class="input-icon">🔑</span>
                        <input type="password" id="regConfirm" placeholder="Nhập lại mật khẩu..." autocomplete="new-password">
                        <button type="button" class="toggle-pw" onclick="togglePw('regConfirm', this)">👁️</button>
                    </div>
                </div>

                <button type="submit" class="btn" id="regBtn" style="margin-top: 8px;">
                    ✍️ Tạo tài khoản
                </button>
            </form>
        </div>

        <!-- CHẾ ĐỘ 2: 2FA -->
        <div id="tfaSection" class="tfa-section">
            <span class="tfa-icon">🔒</span>
            <h2 class="tfa-title">Xác thực 2 lớp</h2>
            <p class="tfa-subtitle">
                Nhập mã 6 số từ <b>Google Authenticator</b><br>
                hoặc backup code của bạn
            </p>

            <input type="text" id="tfaCode" class="tfa-input" placeholder="000000" maxlength="6" autocomplete="one-time-code">

            <button class="btn" id="tfaBtn" onclick="do2FA()">
                ✅ Xác nhận
            </button>
            
            <button class="tfa-back" onclick="cancel2FA()">
                ← Quay lại đăng nhập
            </button>
        </div>

    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ═══════════════════════════════════════
        //  BIẾN TOÀN CỤC
        // ═══════════════════════════════════════
        let current2faUser = '';
        
        // ⭐ Lấy next_url từ Flask (nếu có)
        const nextUrl = "{{ next_url|safe }}";
        
        // Hiện thông báo nếu có next_url
        if (nextUrl && nextUrl !== '' && nextUrl !== '/') {
            document.getElementById('redirectNotice').classList.add('show');
        }

        // Hiệu ứng Splash Screen
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('splash').classList.add('hide');
                document.getElementById('loginContainer').classList.add('show');
            }, 800); // 0.8s
        });

        // ═══════════════════════════════════════
        //  CHUYỂN TAB ĐĂNG NHẬP / ĐĂNG KÝ
        // ═══════════════════════════════════════
        function switchAuthMode(mode) {
            const tabLogin = document.getElementById('tabLogin');
            const tabRegister = document.getElementById('tabRegister');
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const authTitle = document.getElementById('authTitle');
            const authSubtitle = document.getElementById('authSubtitle');

            if (mode === 'login') {
                tabLogin.classList.add('active');
                tabRegister.classList.remove('active');
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
                authTitle.textContent = 'Đăng nhập';
                authSubtitle.textContent = 'Chào mừng bạn trở lại!';
            } else {
                tabLogin.classList.remove('active');
                tabRegister.classList.add('active');
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
                authTitle.textContent = 'Đăng ký';
                authSubtitle.textContent = 'Tạo tài khoản mới!';
            }
        }

        function togglePw(inputId, btn) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = '🙈';
            } else {
                input.type = 'password';
                btn.textContent = '👁️';
            }
        }

        // ═══════════════════════════════════════
        //  XỬ LÝ ĐĂNG NHẬP
        // ═══════════════════════════════════════
        async function doLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;

            if (!username || !password) {
                showToast('⚠️ Vui lòng nhập đầy đủ!', true);
                return;
            }

            const btn = document.getElementById('loginBtn');
            btn.classList.add('loading');
            btn.disabled = true;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        username, 
                        password, 
                        remember,
                        next: nextUrl // ⭐ Gửi next_url
                    })
                });
                const data = await res.json();

                if (data.success) {
                    showToast('✅ ' + data.message);
                    setTimeout(() => {
                        window.location.href = data.redirect || '/'; // ⭐ Chuyển hướng
                    }, 800);
                } 
                else if (data.need_2fa) {
                    // Chuyển sang màn 2FA
                    current2faUser = data.username;
                    document.getElementById('authSection').style.display = 'none';
                    document.getElementById('tfaSection').classList.add('show');
                    document.getElementById('tfaCode').focus();
                    showToast('🔐 Nhập mã 2FA để tiếp tục');
                } 
                else if (data.banned) {
                    showToast('🚫 ' + data.error, true);
                    setTimeout(() => window.location.href = data.redirect, 1500);
                } 
                else if (data.pending_delete) {
                    showToast('🗑️ ' + data.error, true);
                    setTimeout(() => window.location.href = data.redirect, 1500);
                } 
                else {
                    showToast('❌ ' + data.error, true);
                }
            } catch (e) {
                showToast('❌ Lỗi kết nối!', true);
            } finally {
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        }

        // ═══════════════════════════════════════
        //  XỬ LÝ 2FA
        // ═══════════════════════════════════════
        async function do2FA() {
            const code = document.getElementById('tfaCode').value.trim();
            if (!code) {
                showToast('⚠️ Nhập mã 2FA!', true);
                return;
            }

            const btn = document.getElementById('tfaBtn');
            btn.classList.add('loading');
            btn.disabled = true;

            try {
                const res = await fetch('/api/login/2fa', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        username: current2faUser, 
                        code: code,
                        next: nextUrl // ⭐ Gửi next_url qua bước 2FA
                    })
                });
                const data = await res.json();

                if (data.success) {
                    showToast('✅ ' + data.message);
                    setTimeout(() => {
                        window.location.href = data.redirect || '/'; // ⭐ Chuyển hướng
                    }, 800);
                } else {
                    showToast('❌ ' + data.error, true);
                    document.getElementById('tfaCode').value = '';
                    document.getElementById('tfaCode').focus();
                }
            } catch (e) {
                showToast('❌ Lỗi kết nối!', true);
            } finally {
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        }

        function cancel2FA() {
            document.getElementById('tfaSection').classList.remove('show');
            document.getElementById('authSection').style.display = 'block';
            document.getElementById('tfaCode').value = '';
            document.getElementById('password').value = '';
        }

        // Nhập đủ 6 số tự động gửi
        document.getElementById('tfaCode').addEventListener('input', (e) => {
            if (e.target.value.length === 6) do2FA();
        });

        // ═══════════════════════════════════════
        //  XỬ LÝ ĐĂNG KÝ
        // ═══════════════════════════════════════
        async function doRegister(e) {
            e.preventDefault();
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirm = document.getElementById('regConfirm').value;

            if (!username || !password || !confirm) {
                showToast('⚠️ Vui lòng nhập đầy đủ!', true);
                return;
            }
            if (password !== confirm) {
                showToast('⚠️ Mật khẩu xác nhận không khớp!', true);
                return;
            }

            const btn = document.getElementById('regBtn');
            btn.classList.add('loading');
            btn.disabled = true;

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (data.success) {
                    showToast('✅ Đăng ký thành công!');
                    setTimeout(() => {
                        window.location.href = nextUrl || '/'; // ⭐ Đăng ký xong cũng chuyển hướng
                    }, 800);
                } else {
                    showToast('❌ ' + data.error, true);
                }
            } catch (e) {
                showToast('❌ Lỗi kết nối!', true);
            } finally {
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        }

        // ═══════════════════════════════════════
        //  TOAST
        // ═══════════════════════════════════════
        function showToast(msg, isError = false) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast show' + (isError ? ' error' : '');
            setTimeout(() => t.classList.remove('show'), 2500);
        }
    </script>
</body>
</html>
