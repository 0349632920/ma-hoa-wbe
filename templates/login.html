<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Mã Hóa WBE</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">
    <div class="login-card">
        <h1>🔐 Mã Hóa WBE</h1>
        <p class="muted">70+ thuật toán mã hóa</p>

        <div class="tabs">
            <button class="tab active" data-action="login">Đăng nhập</button>
            <button class="tab" data-action="register">Đăng ký</button>
        </div>

        <input type="text" id="username" placeholder="Username" autocomplete="username">
        <input type="password" id="password" placeholder="Mật khẩu" autocomplete="current-password">

        <button class="btn btn-primary btn-block" id="btn-submit">Đăng nhập</button>

        <p id="msg" class="msg"></p>
    </div>

    <script>
        const tabs = document.querySelectorAll('.tab');
        const btn = document.getElementById('btn-submit');
        const msg = document.getElementById('msg');
        let action = 'login';

        tabs.forEach(t => t.addEventListener('click', () => {
            tabs.forEach(x => x.classList.remove('active'));
            t.classList.add('active');
            action = t.dataset.action;
            btn.textContent = action === 'login' ? 'Đăng nhập' : 'Đăng ký';
            msg.textContent = '';
            msg.style.color = '';
        }));

        btn.addEventListener('click', submit);
        document.addEventListener('keypress', e => { if (e.key === 'Enter') submit(); });

        async function submit() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            if (!username || !password) {
                msg.style.color = 'red';
                msg.textContent = '⚠️ Nhập đủ username và mật khẩu';
                return;
            }
            btn.disabled = true;
            msg.style.color = '#8b949e';
            msg.textContent = '⏳ Đang xử lý...';

            try {
                // ⚠️ ENDPOINT ĐÚNG LÀ /login (KHÔNG có /api/)
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password, action})
                });

                // Đọc text trước để tránh lỗi khi response không phải JSON
                const text = await res.text();
                let data;
                try {
                    data = JSON.parse(text);
                } catch (parseErr) {
                    msg.style.color = 'red';
                    msg.textContent = `❌ Server lỗi (${res.status}). Xem Console (F12).`;
                    console.error('Server response:', text.slice(0, 500));
                    btn.disabled = false;
                    return;
                }

                if (data.ok) {
                    msg.style.color = 'green';
                    msg.textContent = '✅ Thành công! Đang chuyển trang...';
                    setTimeout(() => location.href = data.redirect, 400);
                } else if (data.banned && data.redirect) {
                    msg.style.color = 'red';
                    msg.textContent = '🚫 Tài khoản đã bị khóa';
                    setTimeout(() => location.href = data.redirect, 800);
                } else {
                    msg.style.color = 'red';
                    msg.textContent = '❌ ' + (data.error || 'Lỗi không xác định');
                    btn.disabled = false;
                }
            } catch (e) {
                msg.style.color = 'red';
                msg.textContent = '❌ Lỗi mạng: ' + e.message;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
