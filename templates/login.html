<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔐 Đăng nhập — Mã Hóa Tool</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #fff;
      overflow-x: hidden;
    }

    /* Background emoji floating */
    .bg-emoji {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }
    .bg-emoji span {
      position: absolute;
      font-size: 40px;
      opacity: 0.15;
      animation: floatEmoji 8s ease-in-out infinite;
    }
    @keyframes floatEmoji {
      0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.1; }
      50%      { transform: translateY(-30px) rotate(15deg); opacity: 0.25; }
    }

    /* Card login */
    .login-card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(102, 126, 234, 0.3);
      border-radius: 24px;
      padding: 40px 32px;
      backdrop-filter: blur(20px);
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5);
      animation: cardIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes cardIn {
      0%   { opacity: 0; transform: translateY(30px) scale(0.95); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .logo-wrap {
      text-align: center;
      margin-bottom: 28px;
    }
    .logo-icon {
      font-size: 64px;
      display: inline-block;
      animation: logoPop 2s ease-in-out infinite;
    }
    @keyframes logoPop {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.08); }
    }
    .logo-title {
      font-size: 26px;
      font-weight: 800;
      margin-top: 8px;
      background: linear-gradient(135deg, #667eea, #764ba2, #ffd700);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .logo-sub {
      font-size: 13px;
      color: #999;
      margin-top: 6px;
    }

    /* Tabs đăng nhập / đăng ký */
    .auth-tabs {
      display: flex;
      gap: 8px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 24px;
    }
    .auth-tab {
      flex: 1;
      padding: 12px;
      background: transparent;
      border: none;
      color: #999;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      border-radius: 8px;
      transition: 0.25s;
    }
    .auth-tab.active {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    /* Form */
    .form-group {
      margin-bottom: 18px;
    }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #b8b8c8;
      margin-bottom: 8px;
    }
    .form-input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(0, 0, 0, 0.3);
      border: 2px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      color: #fff;
      font-family: inherit;
      font-size: 15px;
      outline: none;
      transition: 0.2s;
    }
    .form-input:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
    }
    .form-input::placeholder { color: #666; }

    /* Nhập OTP */
    .otp-input {
      text-align: center;
      font-size: 26px;
      letter-spacing: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      padding: 18px 16px;
    }

    /* Buttons */
    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.25s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      box-shadow: 0 8px 24px rgba(102, 126, 234, 0.4);
    }
    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(102, 126, 234, 0.6);
    }
    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .btn-ghost {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .btn-ghost:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    /* Spinner */
    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Alert */
    .alert {
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 16px;
      display: none;
      align-items: center;
      gap: 8px;
      animation: shake 0.4s;
    }
    .alert.show { display: flex; }
    .alert-error {
      background: rgba(231, 76, 60, 0.15);
      border: 1px solid #e74c3c;
      color: #f87171;
    }
    .alert-success {
      background: rgba(39, 174, 96, 0.15);
      border: 1px solid #27ae60;
      color: #4ade80;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25%      { transform: translateX(-6px); }
      75%      { transform: translateX(6px); }
    }

    /* 2FA Step */
    .twofa-box {
      display: none;
      animation: fadeIn 0.4s;
    }
    .twofa-box.show { display: block; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .twofa-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: rgba(102, 126, 234, 0.15);
      border: 1px solid rgba(102, 126, 234, 0.4);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      color: #a0c4ff;
      margin-bottom: 12px;
    }

    .twofa-info {
      text-align: center;
      color: #999;
      font-size: 13px;
      margin-bottom: 16px;
      line-height: 1.6;
    }

    .twofa-info strong {
      color: #ffd700;
    }

    /* Footer */
    .login-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: #666;
    }

    /* Mobile */
    @media (max-width: 480px) {
      .login-card { padding: 30px 20px; }
      .logo-icon { font-size: 52px; }
      .logo-title { font-size: 22px; }
      .otp-input { font-size: 22px; letter-spacing: 8px; }
    }
  </style>
</head>
<body>

  <!-- BG Emoji -->
  <div class="bg-emoji">
    <span style="top:10%;left:8%;animation-delay:0s">🔐</span>
    <span style="top:20%;right:12%;animation-delay:1s">🔒</span>
    <span style="bottom:15%;left:15%;animation-delay:2s">🔑</span>
    <span style="top:60%;right:8%;animation-delay:0.5s">🛡️</span>
    <span style="bottom:25%;right:25%;animation-delay:1.5s">💻</span>
    <span style="top:40%;left:5%;animation-delay:2.5s">⚡</span>
    <span style="top:75%;right:40%;animation-delay:0.8s">🎯</span>
    <span style="bottom:8%;left:45%;animation-delay:1.8s">✨</span>
  </div>

  <!-- Login Card -->
  <div class="login-card">
    <div class="logo-wrap">
      <div class="logo-icon">🔐</div>
      <div class="logo-title">Mã Hóa Tool</div>
      <div class="logo-sub">Công cụ mã hóa & giải mã đa phương pháp</div>
    </div>

    <!-- Tabs -->
    <div class="auth-tabs">
      <button class="auth-tab active" id="tabLogin" onclick="switchTab('login')">🔓 Đăng nhập</button>
      <button class="auth-tab" id="tabRegister" onclick="switchTab('register')">✍️ Đăng ký</button>
    </div>

    <!-- Alert -->
    <div class="alert" id="alertBox">
      <span id="alertIcon">⚠️</span>
      <span id="alertText"></span>
    </div>

    <!-- LOGIN FORM -->
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label">👤 Tên đăng nhập</label>
        <input type="text" id="loginUsername" class="form-input" 
               placeholder="Nhập username..." autocomplete="username" required>
      </div>

      <div class="form-group">
        <label class="form-label">🔑 Mật khẩu</label>
        <input type="password" id="loginPassword" class="form-input" 
               placeholder="Nhập mật khẩu..." autocomplete="current-password" required>
      </div>

      <button type="submit" class="btn btn-primary" id="loginBtn">
        <span>🔓</span> Đăng nhập
      </button>
    </form>

    <!-- 2FA FORM (ẩn mặc định) -->
    <div class="twofa-box" id="twofaBox">
      <div class="twofa-badge">
        <span>🔒</span> XÁC THỰC 2 LỚP
      </div>
      <p class="twofa-info">
        Nhập mã 6 số từ <strong>Google Authenticator</strong><br>
        hoặc backup code của bạn
      </p>

      <div class="form-group">
        <input type="text" id="twofaCode" class="form-input otp-input" 
               placeholder="000000" maxlength="9" 
               inputmode="numeric" autocomplete="one-time-code">
      </div>

      <button class="btn btn-primary" id="twofaBtn" onclick="verify2FA()">
        <span>✅</span> Xác nhận
      </button>

      <button class="btn btn-ghost" onclick="backToLogin()" style="margin-top:10px;">
        ← Quay lại đăng nhập
      </button>
    </div>

    <!-- REGISTER FORM (ẩn mặc định) -->
    <form id="registerForm" onsubmit="handleRegister(event)" style="display:none;">
      <div class="form-group">
        <label class="form-label">👤 Tên đăng nhập</label>
        <input type="text" id="regUsername" class="form-input" 
               placeholder="3-30 ký tự..." autocomplete="username" required>
      </div>

      <div class="form-group">
        <label class="form-label">🔑 Mật khẩu</label>
        <input type="password" id="regPassword" class="form-input" 
               placeholder="Ít nhất 6 ký tự..." autocomplete="new-password" required>
      </div>

      <div class="form-group">
        <label class="form-label">🔑 Nhập lại mật khẩu</label>
        <input type="password" id="regPassword2" class="form-input" 
               placeholder="Nhập lại mật khẩu..." autocomplete="new-password" required>
      </div>

      <button type="submit" class="btn btn-primary" id="regBtn">
        <span>✍️</span> Đăng ký
      </button>
    </form>

    <div class="login-footer">
      © 2026 <strong>Mã Hóa Tool</strong> — Made with ❤️
    </div>
  </div>

  <script>
    // ══════════════════════════════════════════════════════════
    //  STATE
    // ══════════════════════════════════════════════════════════
    let pending2FAUsername = '';
    let pending2FAPassword = '';

    // ══════════════════════════════════════════════════════════
    //  ALERT
    // ══════════════════════════════════════════════════════════
    function showAlert(message, type = 'error') {
      const box = document.getElementById('alertBox');
      const icon = document.getElementById('alertIcon');
      const text = document.getElementById('alertText');

      box.className = 'alert alert-' + type + ' show';
      icon.textContent = type === 'error' ? '⚠️' : '✅';
      text.textContent = message;

      setTimeout(() => {
        box.classList.remove('show');
      }, 5000);
    }

    function hideAlert() {
      document.getElementById('alertBox').classList.remove('show');
    }

    // ══════════════════════════════════════════════════════════
    //  TABS
    // ══════════════════════════════════════════════════════════
    function switchTab(tab) {
      hideAlert();
      const tabLogin = document.getElementById('tabLogin');
      const tabRegister = document.getElementById('tabRegister');
      const loginForm = document.getElementById('loginForm');
      const registerForm = document.getElementById('registerForm');
      const twofaBox = document.getElementById('twofaBox');

      if (tab === 'login') {
        tabLogin.classList.add('active');
        tabRegister.classList.remove('active');
        loginForm.style.display = 'block';
        registerForm.style.display = 'none';
        twofaBox.classList.remove('show');
      } else {
        tabLogin.classList.remove('active');
        tabRegister.classList.add('active');
        loginForm.style.display = 'none';
        registerForm.style.display = 'block';
        twofaBox.classList.remove('show');
      }
    }

    // ══════════════════════════════════════════════════════════
    //  LOGIN
    // ══════════════════════════════════════════════════════════
    async function handleLogin(e) {
      e.preventDefault();
      hideAlert();

      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;
      const btn = document.getElementById('loginBtn');

      if (!username || !password) {
        showAlert('Vui lòng nhập đầy đủ!', 'error');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<div class="spinner"></div> Đang xử lý...';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        // ⚡ Bị ban
        if (data.banned) {
          showAlert('🚫 Tài khoản đã bị BAN!', 'error');
          setTimeout(() => {
            window.location.href = data.redirect || ('/banned?user=' + username);
          }, 2000);
          return;
        }

        // 🗑️ Bị xóa
        if (data.pending_delete) {
          showAlert('🗑️ Tài khoản đã bị đánh dấu XÓA!', 'error');
          setTimeout(() => {
            window.location.href = data.redirect || '/deleted';
          }, 2000);
          return;
        }

        // 🔒 Cần 2FA
        if (data.need_2fa) {
          pending2FAUsername = data.username || username;
          pending2FAPassword = password;

          document.getElementById('loginForm').style.display = 'none';
          document.getElementById('twofaBox').classList.add('show');
          document.getElementById('twofaCode').value = '';
          setTimeout(() => document.getElementById('twofaCode').focus(), 200);

          showAlert('🔒 Nhập mã 2FA từ Google Authenticator', 'success');
          return;
        }

        // ✅ Đăng nhập thành công
        if (data.success) {
          showAlert('✅ Đăng nhập thành công!', 'success');
          setTimeout(() => {
            window.location.href = data.redirect || '/';
          }, 500);
          return;
        }

        showAlert(data.error || 'Đăng nhập thất bại!', 'error');

      } catch (err) {
        showAlert('❌ Lỗi kết nối: ' + err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>🔓</span> Đăng nhập';
      }
    }

    // ══════════════════════════════════════════════════════════
    //  VERIFY 2FA
    // ══════════════════════════════════════════════════════════
    async function verify2FA() {
      hideAlert();

      const code = document.getElementById('twofaCode').value.trim();
      const btn = document.getElementById('twofaBtn');

      if (!code) {
        showAlert('Nhập mã 2FA!', 'error');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<div class="spinner"></div> Đang xác thực...';

      try {
        const res = await fetch('/api/login/2fa', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({
            username: pending2FAUsername,
            code: code
          })
        });

        const data = await res.json();

        if (data.success) {
          showAlert('✅ Xác thực thành công!', 'success');
          setTimeout(() => {
            window.location.href = data.redirect || '/';
          }, 500);
          return;
        }

        showAlert(data.error || 'Mã 2FA không đúng!', 'error');
        document.getElementById('twofaCode').value = '';
        document.getElementById('twofaCode').focus();

      } catch (err) {
        showAlert('❌ Lỗi: ' + err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>✅</span> Xác nhận';
      }
    }

    function backToLogin() {
      hideAlert();
      pending2FAUsername = '';
      pending2FAPassword = '';
      document.getElementById('twofaBox').classList.remove('show');
      document.getElementById('loginForm').style.display = 'block';
      document.getElementById('loginPassword').value = '';
      setTimeout(() => document.getElementById('loginPassword').focus(), 200);
    }

    // Nhập OTP tự động submit khi đủ 6 số
    document.getElementById('twofaCode').addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/[^0-9A-Za-z-]/g, '').toUpperCase();
      if (e.target.value.length === 6 && /^\d{6}$/.test(e.target.value)) {
        setTimeout(verify2FA, 200);
      }
    });

    document.getElementById('twofaCode').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        verify2FA();
      }
    });

    // ══════════════════════════════════════════════════════════
    //  REGISTER
    // ══════════════════════════════════════════════════════════
    async function handleRegister(e) {
      e.preventDefault();
      hideAlert();

      const username = document.getElementById('regUsername').value.trim();
      const password = document.getElementById('regPassword').value;
      const password2 = document.getElementById('regPassword2').value;
      const btn = document.getElementById('regBtn');

      if (!username || !password || !password2) {
        showAlert('Vui lòng nhập đầy đủ!', 'error');
        return;
      }
      if (password !== password2) {
        showAlert('Mật khẩu nhập lại không khớp!', 'error');
        return;
      }
      if (password.length < 6) {
        showAlert('Mật khẩu phải có ít nhất 6 ký tự!', 'error');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<div class="spinner"></div> Đang đăng ký...';

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (data.success) {
          showAlert('✅ Đăng ký thành công! Đang vào...', 'success');
          setTimeout(() => {
            window.location.href = data.redirect || '/';
          }, 800);
          return;
        }

        showAlert(data.error || 'Đăng ký thất bại!', 'error');

      } catch (err) {
        showAlert('❌ Lỗi: ' + err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>✍️</span> Đăng ký';
      }
    }

    // ══════════════════════════════════════════════════════════
    //  INIT
    // ══════════════════════════════════════════════════════════
    window.addEventListener('load', () => {
      document.getElementById('loginUsername').focus();
    });

    // Enter để submit
    document.getElementById('loginUsername').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        document.getElementById('loginPassword').focus();
      }
    });
  </script>
</body>
</html>
