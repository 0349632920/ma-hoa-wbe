<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 Trò chơi giải trí</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .hub {
            max-width: 900px; margin: 60px auto; padding: 0 20px;
            text-align: center;
        }
        .hub h1 { font-size: 2.4rem; margin-bottom: 10px; }
        .sub { color: #b8b8d1; margin-bottom: 40px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 24px; margin-bottom: 40px;
        }
        .card {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 20px; padding: 36px 24px;
            text-decoration: none; color: #fff;
            transition: all .3s; backdrop-filter: blur(10px);
        }
        .card:hover {
            transform: translateY(-8px);
            background: rgba(255,255,255,0.12);
            border-color: #2ed573;
            box-shadow: 0 16px 40px rgba(46,213,115,.25);
        }
        .icon { font-size: 4.5rem; margin-bottom: 12px; }
        .card h2 { font-size: 1.5rem; margin-bottom: 8px; }
        .card p { color: #b8b8d1; font-size: .95rem; line-height: 1.5; }
        .back { color: #b8b8d1; text-decoration: none; }
        .back:hover { color: #2ed573; }
    </style>
</head>
<body>
    <div class="hub">
        <h1>🎮 Trò chơi giải trí</h1>
        <p class="sub">Xin chào <b>{{ username }}</b>! Chọn game để bắt đầu.</p>

        <div class="grid">
            <a href="{{ url_for('game_guess_page') }}" class="card">
                <div class="icon">🎯</div>
                <h2>Đoán số</h2>
                <p>Đoán số bí mật từ 1 đến 100.<br>Đoán càng nhanh, điểm càng cao!</p>
            </a>

            <a href="{{ url_for('game_snake_page') }}" class="card">
                <div class="icon">🐍</div>
                <h2>Rắn săn mồi</h2>
                <p>Điều khiển rắn ăn mồi.<br>Phá kỷ lục để nhận điểm!</p>
            </a>
        </div>

        <a class="back" href="{{ url_for('index') }}">← Về trang chủ</a>
    </div>
</body>
</html>
