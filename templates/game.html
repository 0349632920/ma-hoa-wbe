<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 Trò chơi giải trí</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #fff;
            padding: 40px 20px;
        }

        .hub {
            max-width: 900px;
            margin: 0 auto;
            text-align: center;
        }

        .hub h1 {
            font-size: 2.6rem;
            margin-bottom: 16px;
            display: inline-block;
            padding: 12px 32px;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
            letter-spacing: 1px;
        }

        .sub {
            color: #e0e0ff;
            margin-bottom: 40px;
            display: inline-block;
            padding: 8px 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            font-size: 1rem;
        }

        .sub b {
            color: #2ed573;
            font-weight: 700;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 24px;
            margin-bottom: 40px;
        }

        .card {
            background: rgba(15, 15, 25, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 36px 24px;
            text-decoration: none;
            color: #fff;
            transition: all 0.3s ease;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
            display: block;
        }

        .card:hover {
            transform: translateY(-8px);
            background: rgba(25, 25, 40, 0.9);
            border-color: #2ed573;
            box-shadow: 0 20px 45px rgba(46, 213, 115, 0.35);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(46, 213, 115, 0.1), transparent);
            transition: left 0.5s;
        }

        .card:hover::before { left: 100%; }

        .icon {
            font-size: 4.5rem;
            margin-bottom: 16px;
            display: inline-block;
            padding: 12px;
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.25);
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.5));
        }

        .card h2 {
            font-size: 1.6rem;
            margin-bottom: 10px;
            display: inline-block;
            padding: 6px 16px;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 10px;
            letter-spacing: 0.5px;
        }

        .card p {
            color: #c8c8e0;
            font-size: 0.95rem;
            line-height: 1.6;
            display: inline-block;
            padding: 8px 14px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            margin-top: 4px;
        }

        .back {
            color: #e0e0ff;
            text-decoration: none;
            font-size: 1rem;
            display: inline-block;
            padding: 10px 22px;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s;
            margin-top: 20px;
        }

        .back:hover {
            color: #2ed573;
            background: rgba(0, 0, 0, 0.5);
            border-color: #2ed573;
            transform: translateX(-4px);
        }

        @media (max-width: 480px) {
            .hub h1 { font-size: 1.9rem; padding: 10px 20px; }
            .icon { font-size: 3.5rem; }
            .card h2 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <div class="hub">
        <h1>🎮 Trò chơi giải trí</h1>
        <p class="sub">Xin chào <b>{{ username }}</b>! Chọn game để bắt đầu.</p>

        <div class="grid">
            <a href="{{ url_for('game_guess_page') }}" class="card">
                <div class="icon">🎯</div>
                <h2>Đoán số</h2>
                <p>Đoán số bí mật từ 1 đến 100.<br>Đoán càng nhanh, điểm càng cao!</p>
            </a>

            <a href="{{ url_for('game_snake_page') }}" class="card">
                <div class="icon">🐍</div>
                <h2>Rắn săn mồi</h2>
                <p>Điều khiển rắn ăn mồi.<br>Phá kỷ lục để nhận điểm!</p>
            </a>
        </div>

        <a class="back" href="{{ url_for('index') }}">← Về trang chủ</a>
    </div>

    <!-- ⭐ POLLING PHÁT HIỆN CẤM/GỠ CẤM GAME -->
    <script src="{{ url_for('static', filename='game_polling.js') }}"></script>
</body>
    <script src="{{ url_for('static', filename='logout-sync.js') }}"></script>
</html>
