<!-- Ban Modal -->
<div class="confirm-modal" id="ban-modal">
    <div class="confirm-box" style="max-width: 480px;">
        <div class="confirm-icon">🚫</div>
        <h3 class="confirm-title">Cấm user</h3>
        <p class="confirm-text" style="margin-bottom: 16px;">
            Cấm tài khoản: <b id="ban-username" style="color: var(--red);"></b>
        </p>

        <div class="ban-durations">
            <div class="ban-label">Thời hạn cấm:</div>
            <div class="ban-duration-grid">
                <button class="ban-duration-btn" data-duration="1h">⏱ 1 giờ</button>
                <button class="ban-duration-btn active" data-duration="1d">📅 1 ngày</button>
                <button class="ban-duration-btn" data-duration="7d">📅 7 ngày</button>
                <button class="ban-duration-btn" data-duration="30d">📅 30 ngày</button>
                <button class="ban-duration-btn permanent" data-duration="permanent">♾️ Vĩnh viễn</button>
            </div>
        </div>

        <div class="ban-reason-wrap">
            <div class="ban-label">Lý do (tùy chọn):</div>
            <textarea id="ban-reason" class="ban-reason-input" placeholder="VD: Spam, vi phạm quy định..." maxlength="500"></textarea>
        </div>

        <div class="confirm-actions">
            <button class="confirm-btn cancel" id="ban-cancel">Hủy</button>
            <button class="confirm-btn danger" id="ban-confirm">🚫 Cấm</button>
        </div>
    </div>
</div>

<!-- Confirm Modal -->
<div class="confirm-modal" id="confirm-modal">
    <div class="confirm-box">
        <div class="confirm-icon" id="confirm-icon">⚠️</div>
        <h3 class="confirm-title" id="confirm-title">Xác nhận?</h3>
        <p class="confirm-text" id="confirm-text">Bạn có chắc?</p>
        <div class="confirm-actions">
            <button class="confirm-btn cancel" id="confirm-cancel">Hủy</button>
            <button class="confirm-btn danger" id="confirm-ok">Đồng ý</button>
        </div>
    </div>
</div>
