<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎯 Bói vui</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #2d0a3d 0%, #1a1a2e 50%, #0f0c29 100%);
            color: #fff;
            padding: 30px 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 20% 30%, rgba(255, 215, 0, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(186, 85, 211, 0.15) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        /* Sao trời */
        .stars {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 3s ease-in-out infinite;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 20px;
            color: #d0c0f0;
            text-decoration: none;
            padding: 10px 18px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 10px;
            transition: all 0.2s;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .back:hover {
            color: #ffd700;
            border-color: #ffd700;
            transform: translateX(-4px);
        }

        h1 {
            text-align: center;
            margin-bottom: 12px;
            font-size: 2.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffd700, #ffa502, #ff6b9d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px rgba(255, 215, 0, 0.3);
        }

        .subtitle {
            text-align: center;
            color: #d0c0e0;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        .card {
            background: rgba(30, 20, 45, 0.85);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 20px;
            padding: 28px;
            margin-bottom: 20px;
            backdrop-filter: blur(20px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .form-group { margin-bottom: 20px; }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 700;
            font-size: 0.95rem;
            color: #e0d0f0;
        }

        input[type="text"] {
            width: 100%;
            padding: 16px 20px;
            font-size: 1.1rem;
            border-radius: 12px;
            border: 2px solid rgba(255, 215, 0, 0.2);
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            outline: none;
            font-family: inherit;
            transition: all 0.2s;
            text-align: center;
            font-weight: 600;
        }
        input[type="text"]:focus {
            border-color: #ffd700;
            box-shadow: 0 0 0 4px rgba(255, 215, 0, 0.15);
        }
        input::placeholder { color: #8a7a9a; font-weight: 400; }

        /* Chủ đề */
        .chu-de-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
        }

        .cd-btn {
            padding: 14px 10px;
            border-radius: 14px;
            border: 2px solid rgba(255, 215, 0, 0.2);
            background: rgba(0, 0, 0, 0.25);
            color: #fff;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .cd-btn:hover {
            background: rgba(255, 215, 0, 0.1);
            transform: translateY(-3px);
        }
        .cd-btn.active {
            background: linear-gradient(135deg, #ffd700, #ffa502);
            color: #1a1a2e;
            border-color: transparent;
            box-shadow: 0 8px 25px rgba(255, 215, 0, 0.5);
        }
        .cd-icon { font-size: 1.8rem; }
        .cd-label { font-weight: 700; font-size: 0.9rem; }

        /* Generate button */
        .generate-btn {
            width: 100%;
            padding: 20px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #ffd700, #ffa502, #ff6b9d);
            background-size: 200% 200%;
            color: #1a1a2e;
            font-weight: 800;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            margin-top: 8px;
            position: relative;
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            animation: gradientShift 3s ease infinite;
        }
        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        .generate-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(255, 215, 0, 0.5);
        }
        .generate-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        .generate-btn.loading {
            color: transparent;
            pointer-events: none;
        }
        .generate-btn.loading::before {
            content: '';
            position: absolute;
            width: 26px;
            height: 26px;
            border: 3px solid rgba(0, 0, 0, 0.2);
            border-top-color: #1a1a2e;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Kết quả */
        .result-card {
            display: none;
            animation: slideUp 0.6s ease;
        }
        .result-card.show { display: block; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .que-box {
            text-align: center;
            padding: 30px 20px;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.15), rgba(255, 107, 157, 0.1));
            border: 2px solid rgba(255, 215, 0, 0.4);
            border-radius: 20px;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        .que-box::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(255, 215, 0, 0.1), transparent);
            animation: rotate 8s linear infinite;
        }
        @keyframes rotate {
            to { transform: rotate(360deg); }
        }

        .que-label {
            font-size: 0.85rem;
            color: #ffd700;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 10px;
            font-weight: 700;
            position: relative;
            z-index: 1;
        }

        .que-text {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffd700, #ff6b9d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
            z-index: 1;
            line-height: 1.3;
        }

        .que-emoji {
            font-size: 3.5rem;
            margin-bottom: 10px;
            display: block;
            position: relative;
            z-index: 1;
            animation: bounce 1s ease infinite alternate;
        }
        @keyframes bounce {
            from { transform: translateY(0) scale(1); }
            to { transform: translateY(-10px) scale(1.05); }
        }

        /* Lời khuyên */
        .loi-khuyen-section {
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 0.85rem;
            color: #9999bb;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .loi-khuyen-item {
            padding: 14px 18px;
            background: rgba(255, 215, 0, 0.08);
            border-left: 3px solid #ffd700;
            border-radius: 10px;
            margin-bottom: 10px;
            font-size: 0.95rem;
            line-height: 1.6;
            color: #fff;
            animation: slideIn 0.4s ease backwards;
        }
        .loi-khuyen-item:nth-child(1) { animation-delay: 0.1s; }
        .loi-khuyen-item:nth-child(2) { animation-delay: 0.2s; }
        .loi-khuyen-item:nth-child(3) { animation-delay: 0.3s; }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* Thông tin may mắn */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
        }

        .info-box {
            padding: 16px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 12px;
            text-align: center;
        }

        .info-icon {
            font-size: 1.8rem;
            margin-bottom: 6px;
            display: block;
        }

        .info-label {
            font-size: 0.72rem;
            color: #9999bb;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
            font-weight: 700;
        }

        .info-value {
            font-size: 1.15rem;
            font-weight: 800;
            color: #ffd700;
            word-break: break-word;
        }

        .info-value.numbers {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1rem;
        }

        .result-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .result-btn {
            padding: 12px 24px;
            border-radius: 12px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            background: rgba(255, 215, 0, 0.1);
            color: #ffd700;
            font-family: inherit;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .result-btn:hover {
            background: rgba(255, 215, 0, 0.25);
            transform: translateY(-2px);
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #ffa502;
            color: #1a1a2e;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 700;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transition: all 0.4s;
            pointer-events: none;
            z-index: 9999;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        .toast.error { background: #e74c3c; color: #fff; }

        @media (max-width: 480px) {
            h1 { font-size: 1.8rem; }
            .card { padding: 20px; }
            .que-text { font-size: 1.5rem; }
            .chu-de-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>

    <div class="container">
        <a href="{{ url_for('index') }}" class="back">← Về trang chủ</a>

        <h1>🎯 Bói vui</h1>
        <p class="subtitle">Nhập tên — xem vận may hôm nay của bạn 🔮</p>

        <div class="card">
            <div class="form-group">
                <label>👤 Tên của bạn</label>
                <input type="text" id="tenInput" placeholder="Ví dụ: Hùng, Minh Châu..." maxlength="100" autocomplete="off">
            </div>

            <div class="form-group">
                <label>🎯 Chủ đề bói</label>
                <div class="chu-de-grid" id="chuDeGrid">
                    <button class="cd-btn active" data-cd="tinh_duyen" onclick="selectCD('tinh_duyen')">
                        <span class="cd-icon">💕</span>
                        <span class="cd-label">Tình duyên</span>
                    </button>
                    <button class="cd-btn" data-cd="su_nghiep" onclick="selectCD('su_nghiep')">
                        <span class="cd-icon">🚀</span>
                        <span class="cd-label">Sự nghiệp</span>
                    </button>
                    <button class="cd-btn" data-cd="tai_loc" onclick="selectCD('tai_loc')">
                        <span class="cd-icon">💰</span>
                        <span class="cd-label">Tài lộc</span>
                    </button>
                    <button class="cd-btn" data-cd="suc_khoe" onclick="selectCD('suc_khoe')">
                        <span class="cd-icon">💪</span>
                        <span class="cd-label">Sức khỏe</span>
                    </button>
                    <button class="cd-btn" data-cd="hoc_tap" onclick="selectCD('hoc_tap')">
                        <span class="cd-icon">📚</span>
                        <span class="cd-label">Học tập</span>
                    </button>
                </div>
            </div>

            <button class="generate-btn" id="generateBtn" onclick="boi()">
                <span id="genBtnText">🔮 Bói ngay</span>
            </button>
        </div>

        <div class="card result-card" id="resultCard">
            <!-- Quẻ -->
            <div class="que-box">
                <span class="que-emoji" id="queEmoji">🌟</span>
                <div class="que-label">Quẻ hôm nay</div>
                <div class="que-text" id="queText">—</div>
            </div>

            <!-- Lời khuyên -->
            <div class="loi-khuyen-section">
                <div class="section-title">💡 Lời khuyên</div>
                <div id="loiKhuyenList"></div>
            </div>

            <!-- Thông tin may mắn -->
            <div class="loi-khuyen-section">
                <div class="section-title">✨ Thông tin may mắn</div>
                <div class="info-grid">
                    <div class="info-box">
                        <span class="info-icon">🎨</span>
                        <div class="info-label">Màu may mắn</div>
                        <div class="info-value" id="mauMayMan">—</div>
                    </div>
                    <div class="info-box">
                        <span class="info-icon">🔢</span>
                        <div class="info-label">Số may mắn</div>
                        <div class="info-value numbers" id="soMayMan">—</div>
                    </div>
                    <div class="info-box">
                        <span class="info-icon">🐉</span>
                        <div class="info-label">Con giáp</div>
                        <div class="info-value" id="conGiap">—</div>
                    </div>
                    <div class="info-box">
                        <span class="info-icon">🧭</span>
                        <div class="info-label">Hướng tốt</div>
                        <div class="info-value" id="huongMayMan">—</div>
                    </div>
                    <div class="info-box">
                        <span class="info-icon">⏰</span>
                        <div class="info-label">Giờ hoàng đạo</div>
                        <div class="info-value" id="gioHoangDao" style="font-size: 0.9rem;">—</div>
                    </div>
                    <div class="info-box">
                        <span class="info-icon">📅</span>
                        <div class="info-label">Ngày bói</div>
                        <div class="info-value" id="ngayBoi" style="font-size: 0.9rem;">—</div>
                    </div>
                </div>
            </div>

            <div class="result-actions">
                <button class="result-btn" onclick="copyResult()">
                    📋 Sao chép
                </button>
                <button class="result-btn" onclick="boi()">
                    🔄 Bói lại
                </button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let currentCD = 'tinh_duyen';

        // Tạo sao trời
        function createStars() {
            const container = document.getElementById('stars');
            for (let i = 0; i < 50; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                star.style.opacity = 0.2 + Math.random() * 0.8;
                container.appendChild(star);
            }
        }
        createStars();

        function selectCD(cd) {
            currentCD = cd;
            document.querySelectorAll('.cd-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.cd === cd);
            });
        }

        async function boi() {
            const ten = document.getElementById('tenInput').value.trim();

            const btn = document.getElementById('generateBtn');
            btn.classList.add('loading');
            btn.disabled = true;

            try {
                const res = await fetch('/api/boi', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ten: ten, chu_de: currentCD })
                });

                if (res.status === 401) { window.location.href = '/login'; return; }

                const data = await res.json();

                if (data.redirect) { window.location.href = data.redirect; return; }

                if (!data.success) {
                    showToast('❌ ' + (data.error || 'Có lỗi xảy ra!'), true);
                    return;
                }

                renderResult(data.data);
                showToast('🔮 Đã bói xong!');
            } catch (e) {
                showToast('❌ Lỗi kết nối!', true);
            } finally {
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        }

        function renderResult(data) {
            const card = document.getElementById('resultCard');
            card.classList.remove('show');
            void card.offsetWidth;
            card.classList.add('show');

            // Quẻ
            const emojis = ['🌟', '✨', '💫', '🌈', '🍀', '🎉', '🔮', '💎', '🌸', '🦋'];
            document.getElementById('queEmoji').textContent = emojis[Math.floor(Math.random() * emojis.length)];
            document.getElementById('queText').textContent = data.que || '—';

            // Lời khuyên
            const list = document.getElementById('loiKhuyenList');
            list.innerHTML = (data.loi_khuyen || []).map(lk => `
                <div class="loi-khuyen-item">${escapeHtml(lk)}</div>
            `).join('');

            // Info
            document.getElementById('mauMayMan').textContent = data.mau_may_man || '—';
            document.getElementById('soMayMan').textContent = (data.so_may_man || []).join(' - ');
            document.getElementById('conGiap').textContent = data.con_giap || '—';
            document.getElementById('huongMayMan').textContent = data.huong_may_man || '—';
            document.getElementById('gioHoangDao').textContent = data.gio_hoang_dao || '—';
            document.getElementById('ngayBoi').textContent = data.ngay || '—';

            setTimeout(() => {
                card.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 200);
        }

        function copyResult() {
            const text = `
🎯 Bói vui - ${document.getElementById('tenInput').value || 'Bạn'}
📅 Ngày: ${document.getElementById('ngayBoi').textContent}

🌟 Quẻ: ${document.getElementById('queText').textContent}

💡 Lời khuyên:
${Array.from(document.querySelectorAll('.loi-khuyen-item')).map(el => '• ' + el.textContent).join('\n')}

✨ Thông tin may mắn:
• Màu: ${document.getElementById('mauMayMan').textContent}
• Số: ${document.getElementById('soMayMan').textContent}
• Con giáp: ${document.getElementById('conGiap').textContent}
• Hướng: ${document.getElementById('huongMayMan').textContent}
• Giờ: ${document.getElementById('gioHoangDao').textContent}
`.trim();

            navigator.clipboard.writeText(text).then(() => {
                showToast('📋 Đã sao chép kết quả!');
            });
        }

        function escapeHtml(s) {
            if (!s) return '';
            return String(s).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;',
                '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        function showToast(msg, isError = false) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast show' + (isError ? ' error' : '');
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        // Enter để bói
        document.getElementById('tenInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') boi();
        });

        setTimeout(() => document.getElementById('tenInput').focus(), 300);
    </script>
</body>
</html>
