<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎡 Vòng quay ngẫu nhiên</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #fff;
            padding: 20px 15px;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #c8c8e0;
            text-decoration: none;
            padding: 10px 18px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            transition: all 0.2s;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .back:hover {
            color: #2ed573;
            border-color: #2ed573;
            transform: translateX(-4px);
        }

        .top-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .top-btn {
            padding: 9px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(0, 0, 0, 0.3);
            color: #c8c8e0;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .top-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.3);
        }
        .top-btn.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border-color: transparent;
        }

        /* ═══ LAYOUT 2 CỘT ═══ */
        .layout {
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 20px;
        }

        /* ═══ CỘT TRÁI — INPUT ═══ */
        .sidebar {
            background: rgba(15, 15, 25, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 20px;
            backdrop-filter: blur(12px);
            height: fit-content;
            position: sticky;
            top: 20px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
        }

        .sidebar h3 {
            font-size: 1rem;
            margin-bottom: 12px;
            color: #2ed573;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        textarea {
            width: 100%;
            min-height: 200px;
            padding: 12px 14px;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            transition: all 0.2s;
            resize: vertical;
            line-height: 1.6;
        }
        textarea:focus {
            border-color: #2ed573;
            box-shadow: 0 0 0 3px rgba(46, 213, 115, 0.15);
        }

        .hint {
            font-size: 0.78rem;
            color: #9999bb;
            margin-top: 6px;
            line-height: 1.5;
        }
        .hint b { color: #2ed573; }

        .btn-row {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .btn-sm {
            padding: 8px 14px;
            border-radius: 8px;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .btn-sm:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }
        .btn-sm.primary {
            background: linear-gradient(135deg, #2ed573, #16a085);
            color: #fff;
        }
        .btn-sm.danger {
            background: rgba(255, 71, 87, 0.2);
            color: #ff6b7a;
            border: 1px solid rgba(255, 71, 87, 0.4);
        }
        .btn-sm.danger:hover {
            background: rgba(255, 71, 87, 0.3);
        }

        /* ═══ SETTINGS ═══ */
        .setting-group {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            font-size: 0.85rem;
            color: #c8c8e0;
        }

        .setting-row label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
        }

        .setting-row input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #2ed573;
            cursor: pointer;
        }

        .setting-row input[type="number"],
        .setting-row input[type="range"] {
            width: 90px;
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-family: inherit;
            font-size: 0.85rem;
            outline: none;
            text-align: center;
        }
        .setting-row input[type="range"] {
            padding: 0;
            width: 110px;
            accent-color: #667eea;
        }
        .setting-row input:focus {
            border-color: #2ed573;
        }

        /* ═══ CỘT PHẢI — WHEEL ═══ */
        .main-area {
            background: rgba(15, 15, 25, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 30px 20px;
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 600px;
        }

        .wheel-container {
            position: relative;
            width: 480px;
            height: 480px;
            max-width: 90vw;
            max-height: 90vw;
            margin: 20px 0;
        }

        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: relative;
            transition: transform 5s cubic-bezier(0.17, 0.67, 0.12, 0.99);
            box-shadow:
                0 0 0 8px rgba(255, 255, 255, 0.1),
                0 0 0 12px rgba(255, 255, 255, 0.05),
                0 20px 60px rgba(0, 0, 0, 0.6);
            overflow: hidden;
        }

        .wheel-labels {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .wheel-label {
            position: absolute;
            left: 50%;
            top: 50%;
            transform-origin: 0 0;
            font-weight: 700;
            font-size: 0.95rem;
            color: #fff;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
            white-space: nowrap;
            pointer-events: none;
            max-width: 180px;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .wheel-label img {
            width: 18px;
            height: 18px;
            object-fit: cover;
            border-radius: 4px;
        }

        /* Kim chỉ */
        .wheel-pointer {
            position: absolute;
            top: -22px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 18px solid transparent;
            border-right: 18px solid transparent;
            border-top: 36px solid #ff4757;
            filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.7));
            z-index: 10;
        }

        /* Nút trung tâm */
        .wheel-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: 5px solid #fff;
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: 800;
            color: #fff;
            cursor: pointer;
            transition: all 0.2s;
            z-index: 5;
            user-select: none;
            letter-spacing: 1px;
        }
        .wheel-center:hover {
            transform: translate(-50%, -50%) scale(1.08);
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.7);
        }
        .wheel-center:active {
            transform: translate(-50%, -50%) scale(0.95);
        }
        .wheel-center.disabled {
            pointer-events: none;
            opacity: 0.6;
        }

        /* Nút quay lớn */
        .spin-btn {
            padding: 18px 50px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #2ed573, #16a085);
            color: #fff;
            font-family: inherit;
            font-weight: 800;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 25px rgba(46, 213, 115, 0.4);
            margin-top: 10px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .spin-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(46, 213, 115, 0.6);
        }
        .spin-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ═══ KẾT QUẢ ═══ */
        .result-box {
            margin-top: 20px;
            padding: 20px 30px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 16px;
            border: 2px solid rgba(46, 213, 115, 0.4);
            text-align: center;
            display: none;
            animation: resultIn 0.5s ease;
        }
        .result-box.show { display: block; }
        @keyframes resultIn {
            from { opacity: 0; transform: scale(0.8); }
            to   { opacity: 1; transform: scale(1); }
        }
        .result-box .label {
            font-size: 0.8rem;
            color: #9999bb;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
            font-weight: 700;
        }
        .result-box .value {
            font-size: 1.8rem;
            font-weight: 800;
            color: #2ed573;
            word-break: break-word;
            text-shadow: 0 2px 20px rgba(46, 213, 115, 0.5);
        }

        /* ═══ EMPTY ═══ */
        .empty {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 0.95rem;
            text-align: center;
            padding: 20px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.03);
        }
        .empty .icon {
            font-size: 3rem;
            margin-bottom: 12px;
            opacity: 0.4;
        }

        /* ═══ TOAST ═══ */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #27ae60;
            color: #fff;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 600;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transition: all 0.4s;
            pointer-events: none;
            z-index: 9999;
            max-width: 90vw;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        .toast.error { background: #e74c3c; }

        /* ═══ MODAL ═══ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        .modal-overlay.show {
            opacity: 1;
            visibility: visible;
        }
        .modal {
            background: linear-gradient(135deg, #1a1a2e, #0f0f1a);
            border: 2px solid rgba(46, 213, 115, 0.4);
            border-radius: 24px;
            padding: 36px 32px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 80px rgba(46, 213, 115, 0.3);
            transform: scale(0.8);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .modal-overlay.show .modal { transform: scale(1); }

        .modal-icon {
            font-size: 4rem;
            margin-bottom: 16px;
            animation: bounce 0.8s ease infinite alternate;
        }
        @keyframes bounce {
            from { transform: translateY(0) scale(1); }
            to   { transform: translateY(-12px) scale(1.1); }
        }

        .modal-label {
            font-size: 0.85rem;
            color: #9999bb;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .modal-value {
            font-size: 2rem;
            font-weight: 800;
            color: #2ed573;
            margin-bottom: 24px;
            word-break: break-word;
            text-shadow: 0 2px 20px rgba(46, 213, 115, 0.5);
        }

        .modal-btns {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .modal-btn {
            padding: 12px 24px;
            border-radius: 12px;
            border: none;
            font-family: inherit;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .modal-btn.primary {
            background: linear-gradient(135deg, #2ed573, #16a085);
            color: #fff;
        }
        .modal-btn.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(46, 213, 115, 0.4);
        }
        .modal-btn.secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .modal-btn.secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* ═══ HISTORY PANEL ═══ */
        .history-panel {
            position: fixed;
            top: 0;
            right: -400px;
            width: 380px;
            max-width: 90vw;
            height: 100vh;
            background: linear-gradient(135deg, #1a1a2e, #0f0f1a);
            border-left: 1px solid rgba(255, 255, 255, 0.12);
            z-index: 9998;
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
            box-shadow: -20px 0 60px rgba(0, 0, 0, 0.5);
        }
        .history-panel.show { right: 0; }

        .history-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .history-header h3 {
            font-size: 1.1rem;
            color: #2ed573;
        }
        .history-close {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.2s;
        }
        .history-close:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: rotate(90deg);
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .history-item {
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            margin-bottom: 8px;
            border-left: 3px solid #2ed573;
        }
        .history-item .h-name {
            font-weight: 700;
            color: #fff;
            margin-bottom: 4px;
        }
        .history-item .h-time {
            font-size: 0.75rem;
            color: #9999bb;
        }

        .history-empty {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }

        /* ═══ CONFETTI ═══ */
        .confetti-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 10000;
            overflow: hidden;
        }
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #ff4757;
            pointer-events: none;
        }

        /* ═══ RESPONSIVE ═══ */
        @media (max-width: 900px) {
            .layout {
                grid-template-columns: 1fr;
            }
            .sidebar {
                position: static;
                max-height: none;
            }
            .wheel-container {
                width: 400px;
                height: 400px;
            }
        }
        @media (max-width: 480px) {
            .wheel-container {
                width: 320px;
                height: 320px;
            }
            .wheel-label { font-size: 0.8rem; max-width: 130px; }
            .wheel-center {
                width: 70px;
                height: 70px;
                font-size: 0.9rem;
            }
            .modal-value { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <a href="{{ url_for('index') }}" class="back">← Về trang chủ</a>
            <div class="top-actions">
                <button class="top-btn" id="soundToggle" onclick="toggleSound()" title="Bật/tắt âm thanh">
                    🔊 Âm thanh
                </button>
                <button class="top-btn" onclick="openHistory()">
                    📜 Lịch sử
                </button>
                <button class="top-btn" onclick="shuffleItems()">
                    🔀 Trộn
                </button>
                <button class="top-btn" onclick="sortItems()">
                    🔤 Sắp xếp
                </button>
            </div>
        </div>

        <div class="layout">
            <!-- ═══ SIDEBAR ═══ -->
            <div class="sidebar">
                <h3>📝 Danh sách mục</h3>
                <textarea id="namesInput" placeholder="Ví dụ:&#10;Hùng&#10;Dương&#10;Minh&#10;Ngọc&#10;Châu"></textarea>
                <p class="hint">💡 Mỗi dòng 1 mục. <b>Enter</b> để xuống dòng.</p>

                <div class="btn-row">
                    <button class="btn-sm primary" onclick="applyChanges()">
                        ✅ Áp dụng
                    </button>
                    <button class="btn-sm danger" onclick="clearAll()">
                        🗑️ Xóa hết
                    </button>
                </div>

                <!-- ═══ SETTINGS ═══ -->
                <div class="setting-group">
                    <h3>⚙️ Cài đặt</h3>

                    <div class="setting-row">
                        <label>
                            <input type="checkbox" id="removeAfterSpin">
                            <span>🗑️ Xóa sau khi quay</span>
                        </label>
                    </div>

                    <div class="setting-row">
                        <label>
                            <input type="checkbox" id="showConfetti" checked>
                            <span>🎉 Hiệu ứng confetti</span>
                        </label>
                    </div>

                    <div class="setting-row">
                        <label>
                            <input type="checkbox" id="showResultModal" checked>
                            <span>💬 Hiện popup kết quả</span>
                        </label>
                    </div>

                    <div class="setting-row">
                        <span>⏱️ Thời gian quay</span>
                        <input type="number" id="spinDuration" value="5" min="1" max="15" step="1">
                    </div>

                    <div class="setting-row">
                        <span>🔊 Âm lượng</span>
                        <input type="range" id="volumeSlider" min="0" max="100" value="50">
                    </div>

                    <div class="setting-row">
                        <span>📏 Font size</span>
                        <input type="number" id="fontSize" value="14" min="8" max="24" step="1">
                    </div>
                </div>
            </div>

            <!-- ═══ MAIN AREA ═══ -->
            <div class="main-area">
                <div class="wheel-container">
                    <div class="wheel-pointer"></div>
                    <div class="wheel" id="wheel">
                        <div class="wheel-labels" id="wheelLabels"></div>
                        <div class="empty" id="emptyState">
                            <span class="icon">🎡</span>
                            Nhập danh sách để bắt đầu
                        </div>
                    </div>
                    <div class="wheel-center" id="wheelCenter" onclick="spin()">
                        SPIN
                    </div>
                </div>

                <button class="spin-btn" id="spinBtn" onclick="spin()">
                    🎯 QUAY!
                </button>
            </div>
        </div>
    </div>

    <!-- ═══ RESULT MODAL ═══ -->
    <div class="modal-overlay" id="resultModal">
        <div class="modal">
            <div class="modal-icon">🎉</div>
            <div class="modal-label">Kết quả</div>
            <div class="modal-value" id="resultValue">—</div>
            <div class="modal-btns">
                <button class="modal-btn primary" onclick="closeResult()">✅ Đóng</button>
                <button class="modal-btn secondary" onclick="closeResultAndSpin()">🔄 Quay lại</button>
            </div>
        </div>
    </div>

    <!-- ═══ HISTORY PANEL ═══ -->
    <div class="history-panel" id="historyPanel">
        <div class="history-header">
            <h3>📜 Lịch sử quay</h3>
            <button class="history-close" onclick="closeHistory()">✕</button>
        </div>
        <div class="history-list" id="historyList">
            <div class="history-empty">
                <div style="font-size: 3rem; margin-bottom: 12px; opacity: 0.5;">📭</div>
                Chưa có lịch sử
            </div>
        </div>
    </div>

    <!-- ═══ CONFETTI ═══ -->
    <div class="confetti-container" id="confettiContainer"></div>

    <div class="toast" id="toast"></div>
