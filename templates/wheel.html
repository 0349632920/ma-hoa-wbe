<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎡 Vòng quay ngẫu nhiên</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #fff;
            padding: 20px 15px;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #c8c8e0;
            text-decoration: none;
            padding: 10px 18px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            transition: all 0.2s;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .back:hover {
            color: #2ed573;
            border-color: #2ed573;
            transform: translateX(-4px);
        }

        .top-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .top-btn {
            padding: 9px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(0, 0, 0, 0.3);
            color: #c8c8e0;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .top-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.3);
        }
        .top-btn.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border-color: transparent;
        }

        /* ═══ LAYOUT 2 CỘT ═══ */
        .layout {
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 20px;
        }

        /* ═══ SIDEBAR ═══ */
        .sidebar {
            background: rgba(15, 15, 25, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 20px;
            backdrop-filter: blur(12px);
            height: fit-content;
            position: sticky;
            top: 20px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
        }

        .sidebar h3 {
            font-size: 1rem;
            margin-bottom: 12px;
            color: #2ed573;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        textarea {
            width: 100%;
            min-height: 200px;
            padding: 12px 14px;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            transition: all 0.2s;
            resize: vertical;
            line-height: 1.6;
        }
        textarea:focus {
            border-color: #2ed573;
            box-shadow: 0 0 0 3px rgba(46, 213, 115, 0.15);
        }

        .hint {
            font-size: 0.78rem;
            color: #9999bb;
            margin-top: 6px;
            line-height: 1.5;
        }
        .hint b { color: #2ed573; }

        .btn-row {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .btn-sm {
            padding: 8px 14px;
            border-radius: 8px;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .btn-sm:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }
        .btn-sm.primary {
            background: linear-gradient(135deg, #2ed573, #16a085);
            color: #fff;
        }
        .btn-sm.danger {
            background: rgba(255, 71, 87, 0.2);
            color: #ff6b7a;
            border: 1px solid rgba(255, 71, 87, 0.4);
        }
        .btn-sm.danger:hover {
            background: rgba(255, 71, 87, 0.3);
        }

        /* ═══ SETTINGS ═══ */
        .setting-group {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            font-size: 0.85rem;
            color: #c8c8e0;
        }

        .setting-row label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
        }

        .setting-row input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #2ed573;
            cursor: pointer;
        }

        .setting-row input[type="number"],
        .setting-row input[type="range"] {
            width: 90px;
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-family: inherit;
            font-size: 0.85rem;
            outline: none;
            text-align: center;
        }
        .setting-row input[type="range"] {
            padding: 0;
            width: 110px;
            accent-color: #667eea;
        }
        .setting-row input:focus {
            border-color: #2ed573;
        }

        /* ═══ MAIN AREA ═══ */
        .main-area {
            background: rgba(15, 15, 25, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 30px 20px;
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 600px;
        }

        .wheel-container {
            position: relative;
            width: 480px;
            height: 480px;
            max-width: 90vw;
            max-height: 90vw;
            margin: 20px 0;
        }

        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: relative;
            transition: transform 5s cubic-bezier(0.17, 0.67, 0.12, 0.99);
            box-shadow:
                0 0 0 8px rgba(255, 255, 255, 0.1),
                0 0 0 12px rgba(255, 255, 255, 0.05),
                0 20px 60px rgba(0, 0, 0, 0.6);
            overflow: hidden;
        }

        .wheel-labels {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .wheel-label {
            position: absolute;
            left: 50%;
            top: 50%;
            transform-origin: 0 0;
            font-weight: 700;
            font-size: 0.95rem;
            color: #fff;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
            pointer-events: none;
            white-space: normal;
            word-break: break-word;
            overflow-wrap: anywhere;
            text-align: center;
            line-height: 1.2;
            max-width: 140px;
            max-height: 70px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2px 4px;
        }

        .wheel-pointer {
            position: absolute;
            top: -22px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 18px solid transparent;
            border-right: 18px solid transparent;
            border-top: 36px solid #ff4757;
            filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.7));
            z-index: 10;
        }

        .wheel-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: 5px solid #fff;
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: 800;
            color: #fff;
            cursor: pointer;
            transition: all 0.2s;
            z-index: 5;
            user-select: none;
            letter-spacing: 1px;
        }
        .wheel-center:hover {
            transform: translate(-50%, -50%) scale(1.08);
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.7);
        }
        .wheel-center:active {
            transform: translate(-50%, -50%) scale(0.95);
        }
        .wheel-center.disabled {
            pointer-events: none;
            opacity: 0.6;
        }

        .spin-btn {
            padding: 18px 50px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #2ed573, #16a085);
            color: #fff;
            font-family: inherit;
            font-weight: 800;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 25px rgba(46, 213, 115, 0.4);
            margin-top: 10px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .spin-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(46, 213, 115, 0.6);
        }
        .spin-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .empty {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 0.95rem;
            text-align: center;
            padding: 20px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.03);
        }
        .empty .icon {
            font-size: 3rem;
            margin-bottom: 12px;
            opacity: 0.4;
        }

        /* ═══ TOAST ═══ */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #27ae60;
            color: #fff;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 600;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transition: all 0.4s;
            pointer-events: none;
            z-index: 9999;
            max-width: 90vw;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        .toast.error { background: #e74c3c; }

        /* ═══ MODAL ═══ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        .modal-overlay.show {
            opacity: 1;
            visibility: visible;
        }
        .modal {
            background: linear-gradient(135deg, #1a1a2e, #0f0f1a);
            border: 2px solid rgba(46, 213, 115, 0.4);
            border-radius: 24px;
            padding: 36px 32px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 80px rgba(46, 213, 115, 0.3);
            transform: scale(0.8);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .modal-overlay.show .modal { transform: scale(1); }

        .modal-icon {
            font-size: 4rem;
            margin-bottom: 16px;
            animation: bounce 0.8s ease infinite alternate;
        }
        @keyframes bounce {
            from { transform: translateY(0) scale(1); }
            to   { transform: translateY(-12px) scale(1.1); }
        }

        .modal-label {
            font-size: 0.85rem;
            color: #9999bb;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .modal-value {
            font-size: 2rem;
            font-weight: 800;
            color: #2ed573;
            margin-bottom: 24px;
            word-break: break-word;
            text-shadow: 0 2px 20px rgba(46, 213, 115, 0.5);
        }

        .modal-btns {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .modal-btn {
            padding: 12px 24px;
            border-radius: 12px;
            border: none;
            font-family: inherit;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .modal-btn.primary {
            background: linear-gradient(135deg, #2ed573, #16a085);
            color: #fff;
        }
        .modal-btn.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(46, 213, 115, 0.4);
        }
        .modal-btn.secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .modal-btn.secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* ═══ HISTORY PANEL ═══ */
        .history-panel {
            position: fixed;
            top: 0;
            right: -400px;
            width: 380px;
            max-width: 90vw;
            height: 100vh;
            background: linear-gradient(135deg, #1a1a2e, #0f0f1a);
            border-left: 1px solid rgba(255, 255, 255, 0.12);
            z-index: 9998;
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
            box-shadow: -20px 0 60px rgba(0, 0, 0, 0.5);
        }
        .history-panel.show { right: 0; }

        .history-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .history-header h3 {
            font-size: 1.1rem;
            color: #2ed573;
        }
        .history-close {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.2s;
        }
        .history-close:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: rotate(90deg);
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .history-item {
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            margin-bottom: 8px;
            border-left: 3px solid #2ed573;
        }
        .history-item .h-name {
            font-weight: 700;
            color: #fff;
            margin-bottom: 4px;
        }
        .history-item .h-time {
            font-size: 0.75rem;
            color: #9999bb;
        }

        .history-empty {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }

        /* ═══ CONFETTI ═══ */
        .confetti-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 10000;
            overflow: hidden;
        }
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #ff4757;
            pointer-events: none;
        }

        /* ═══ RESPONSIVE ═══ */
        @media (max-width: 900px) {
            .layout { grid-template-columns: 1fr; }
            .sidebar { position: static; max-height: none; }
            .wheel-container { width: 400px; height: 400px; }
        }
        @media (max-width: 480px) {
            .wheel-container { width: 320px; height: 320px; }
            .wheel-label { font-size: 0.75rem; max-width: 110px; max-height: 60px; }
            .wheel-center { width: 70px; height: 70px; font-size: 0.9rem; }
            .modal-value { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <a href="{{ url_for('index') }}" class="back">← Về trang chủ</a>
            <div class="top-actions">
                <button class="top-btn" id="soundToggle" onclick="toggleSound()">
                    🔊 Âm thanh
                </button>
                <button class="top-btn" onclick="openHistory()">
                    📜 Lịch sử
                </button>
                <button class="top-btn" onclick="shuffleItems()">
                    🔀 Trộn
                </button>
                <button class="top-btn" onclick="sortItems()">
                    🔤 Sắp xếp
                </button>
            </div>
        </div>

        <div class="layout">
            <div class="sidebar">
                <h3>📝 Danh sách mục</h3>
                <textarea id="namesInput" placeholder="Ví dụ:&#10;Hùng&#10;Dương&#10;Minh&#10;Ngọc&#10;Châu"></textarea>
                <p class="hint">💡 Mỗi dòng 1 mục. <b>Enter</b> để xuống dòng.</p>

                <div class="btn-row">
                    <button class="btn-sm primary" onclick="applyChanges()">
                        ✅ Áp dụng
                    </button>
                    <button class="btn-sm danger" onclick="clearAll()">
                        🗑️ Xóa hết
                    </button>
                </div>

                <div class="setting-group">
                    <h3>⚙️ Cài đặt</h3>

                    <div class="setting-row">
                        <label>
                            <input type="checkbox" id="removeAfterSpin">
                            <span>🗑️ Xóa sau khi quay</span>
                        </label>
                    </div>

                    <div class="setting-row">
                        <label>
                            <input type="checkbox" id="showConfetti" checked>
                            <span>🎉 Hiệu ứng confetti</span>
                        </label>
                    </div>

                    <div class="setting-row">
                        <label>
                            <input type="checkbox" id="showResultModal" checked>
                            <span>💬 Hiện popup kết quả</span>
                        </label>
                    </div>

                    <div class="setting-row">
                        <span>⏱️ Thời gian quay</span>
                        <input type="number" id="spinDuration" value="5" min="1" max="15" step="1">
                    </div>

                    <div class="setting-row">
                        <span>🔊 Âm lượng</span>
                        <input type="range" id="volumeSlider" min="0" max="100" value="50">
                    </div>

                    <div class="setting-row">
                        <span>📏 Font size</span>
                        <input type="number" id="fontSize" value="14" min="8" max="24" step="1">
                    </div>
                </div>
            </div>

            <div class="main-area">
                <div class="wheel-container">
                    <div class="wheel-pointer"></div>
                    <div class="wheel" id="wheel">
                        <div class="wheel-labels" id="wheelLabels"></div>
                        <div class="empty" id="emptyState">
                            <span class="icon">🎡</span>
                            Nhập danh sách để bắt đầu
                        </div>
                    </div>
                    <div class="wheel-center" id="wheelCenter" onclick="spin()">
                        SPIN
                    </div>
                </div>

                <button class="spin-btn" id="spinBtn" onclick="spin()">
                    🎯 QUAY!
                </button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="resultModal">
        <div class="modal">
            <div class="modal-icon">🎉</div>
            <div class="modal-label">Kết quả</div>
            <div class="modal-value" id="resultValue">—</div>
            <div class="modal-btns">
                <button class="modal-btn primary" onclick="closeResult()">✅ Đóng</button>
                <button class="modal-btn secondary" onclick="closeResultAndSpin()">🔄 Quay lại</button>
            </div>
        </div>
    </div>

    <div class="history-panel" id="historyPanel">
        <div class="history-header">
            <h3>📜 Lịch sử quay</h3>
            <button class="history-close" onclick="closeHistory()">✕</button>
        </div>
        <div class="history-list" id="historyList">
            <div class="history-empty">
                <div style="font-size: 3rem; margin-bottom: 12px; opacity: 0.5;">📭</div>
                Chưa có lịch sử
            </div>
        </div>
    </div>

    <div class="confetti-container" id="confettiContainer"></div>

    <div class="toast" id="toast"></div>

    <script>
        // ═══════════════════════════════════════════════════════════
        //  STATE
        // ═══════════════════════════════════════════════════════════
        let items = [];
        let isSpinning = false;
        let currentRotation = 0;
        let soundEnabled = true;
        let history = [];

        const COLORS = [
            '#667eea', '#764ba2', '#f093fb', '#f5576c',
            '#2ed573', '#1e90ff', '#ffa502', '#ff4757',
            '#a55eea', '#26de81', '#fd9644', '#45aaf2'
        ];

        // ═══════════════════════════════════════════════════════════
        //  ⭐ RANDOM 100% — crypto.getRandomValues()
        // ═══════════════════════════════════════════════════════════
        function secureRandomInt(max) {
            /**
             * Random integer từ 0 đến max-1 (không bao gồm max)
             * Dùng crypto.getRandomValues() — chuẩn cryptographic
             * Rejection sampling → không bị bias, phân phối đều 100%
             */
            if (max <= 0) return 0;
            if (max === 1) return 0;

            // Fallback nếu browser cũ không hỗ trợ crypto
            if (typeof crypto === 'undefined' || !crypto.getRandomValues) {
                const t = Date.now() * 1000 + performance.now() * 1000000;
                return Math.floor((Math.random() + (t % 1)) * max) % max;
            }

            const range = 4294967296; // 2^32
            const limit = Math.floor(range / max) * max;
            const randomBuffer = new Uint32Array(1);
            let value;

            // Rejection sampling — loại bỏ giá trị gây bias
            do {
                crypto.getRandomValues(randomBuffer);
                value = randomBuffer[0];
            } while (value >= limit);

            return value % max;
        }

        // ═══════════════════════════════════════════════════════════
        //  LOCALSTORAGE
        // ═══════════════════════════════════════════════════════════
        function saveToStorage() {
            try {
                localStorage.setItem('wheel_items', JSON.stringify(items));
                localStorage.setItem('wheel_history', JSON.stringify(history.slice(0, 50)));
                localStorage.setItem('wheel_settings', JSON.stringify({
                    sound: soundEnabled,
                    removeAfterSpin: document.getElementById('removeAfterSpin').checked,
                    showConfetti: document.getElementById('showConfetti').checked,
                    showResultModal: document.getElementById('showResultModal').checked,
                    spinDuration: parseInt(document.getElementById('spinDuration').value) || 5,
                    volume: parseInt(document.getElementById('volumeSlider').value) || 50,
                    fontSize: parseInt(document.getElementById('fontSize').value) || 14,
                }));
            } catch (e) {}
        }

        function loadFromStorage() {
            try {
                const savedItems = localStorage.getItem('wheel_items');
                if (savedItems) {
                    items = JSON.parse(savedItems) || [];
                    document.getElementById('namesInput').value = items.join('\n');
                }

                const savedHistory = localStorage.getItem('wheel_history');
                if (savedHistory) history = JSON.parse(savedHistory) || [];

                const savedSettings = localStorage.getItem('wheel_settings');
                if (savedSettings) {
                    const s = JSON.parse(savedSettings);
                    soundEnabled = s.sound !== false;
                    document.getElementById('removeAfterSpin').checked = !!s.removeAfterSpin;
                    document.getElementById('showConfetti').checked = s.showConfetti !== false;
                    document.getElementById('showResultModal').checked = s.showResultModal !== false;
                    document.getElementById('spinDuration').value = s.spinDuration || 5;
                    document.getElementById('volumeSlider').value = s.volume || 50;
                    document.getElementById('fontSize').value = s.fontSize || 14;
                }
            } catch (e) {}
        }

        // ═══════════════════════════════════════════════════════════
        //  VẼ VÒNG QUAY
        // ═══════════════════════════════════════════════════════════
        function renderWheel() {
            const wheel = document.getElementById('wheel');
            const labelsContainer = document.getElementById('wheelLabels');
            const emptyState = document.getElementById('emptyState');

            if (items.length === 0) {
                wheel.style.background = 'rgba(255, 255, 255, 0.03)';
                wheel.style.transform = 'rotate(0deg)';
                labelsContainer.innerHTML = '';
                emptyState.style.display = 'flex';
                currentRotation = 0;
                return;
            }

            emptyState.style.display = 'none';

            const n = items.length;
            const anglePerItem = 360 / n;

            let gradientStops = [];
            for (let i = 0; i < n; i++) {
                const color = COLORS[i % COLORS.length];
                const start = i * anglePerItem;
                const end = (i + 1) * anglePerItem;
                gradientStops.push(`${color} ${start}deg ${end}deg`);
            }
            wheel.style.background = `conic-gradient(${gradientStops.join(', ')})`;

            labelsContainer.innerHTML = '';
            const fontSize = parseInt(document.getElementById('fontSize').value) || 14;
            const radius = wheel.offsetWidth / 2;

            // Auto font size theo số mục
            let finalFontSize = fontSize;
            if (n > 6) finalFontSize = Math.max(9, fontSize - Math.floor((n - 6) / 2));
            if (n > 15) finalFontSize = Math.max(8, fontSize - 6);

            for (let i = 0; i < n; i++) {
                const angle = i * anglePerItem + anglePerItem / 2;

                const label = document.createElement('div');
                label.className = 'wheel-label';
                label.textContent = items[i];
                label.style.fontSize = finalFontSize + 'px';

                const dist = radius * 0.55;

                // Tránh chữ ngược
                let rotation = angle - 90;
                const normalizedAngle = ((angle % 360) + 360) % 360;
                const flip = (normalizedAngle > 90 && normalizedAngle < 270);

                if (flip) {
                    rotation = rotation + 180;
                    label.style.transform = `rotate(${rotation}deg) translate(-${dist}px, -50%)`;
                } else {
                    label.style.transform = `rotate(${rotation}deg) translate(${dist}px, -50%)`;
                }

                label.style.transformOrigin = '0 0';
                label.style.maxWidth = Math.min(140, radius * 0.5) + 'px';
                label.style.maxHeight = Math.min(70, radius * 0.28) + 'px';

                labelsContainer.appendChild(label);
            }

            wheel.style.transition = 'none';
            wheel.style.transform = 'rotate(0deg)';
            currentRotation = 0;
        }

        // ═══════════════════════════════════════════════════════════
        //  ÁP DỤNG DANH SÁCH
        // ═══════════════════════════════════════════════════════════
        function applyChanges() {
            const text = document.getElementById('namesInput').value;
            items = text.split('\n')
                .map(s => s.trim())
                .filter(s => s.length > 0);

            if (items.length > 50) {
                showToast('⚠️ Tối đa 50 mục! Đã cắt bớt.', true);
                items = items.slice(0, 50);
                document.getElementById('namesInput').value = items.join('\n');
            }

            renderWheel();
            saveToStorage();

            if (items.length > 0) {
                showToast(`✅ Đã cập nhật ${items.length} mục`);
            }
        }

        // ═══════════════════════════════════════════════════════════
        //  QUAY — RANDOM 100%
        // ═══════════════════════════════════════════════════════════
        function spin() {
            if (isSpinning) return;
            if (items.length < 2) {
                showToast('⚠️ Cần ít nhất 2 mục để quay!', true);
                return;
            }

            isSpinning = true;
            document.getElementById('spinBtn').disabled = true;
            document.getElementById('wheelCenter').classList.add('disabled');

            const n = items.length;
            const anglePerItem = 360 / n;

            // ⭐ RANDOM 100% — dùng crypto.getRandomValues()
            const randomIndex = secureRandomInt(n);
            console.log('🎲 Random index:', randomIndex, '→ Kết quả:', items[randomIndex]);

            // Góc để ô randomIndex nằm ở đỉnh
            const targetAngle = 360 - (randomIndex * anglePerItem + anglePerItem / 2);

            // Số vòng quay thêm — random 6-10 vòng
            const extraSpins = 6 + secureRandomInt(5);

            // Offset ngẫu nhiên nhỏ trong ô (tránh dừng đúng giữa)
            const angleOffset = (secureRandomInt(100) - 50) * (anglePerItem * 0.007);

            const currentMod = currentRotation % 360;
            const deltaToTarget = ((targetAngle - currentMod + angleOffset) + 360) % 360;
            const totalRotation = currentRotation + (extraSpins * 360) + deltaToTarget;

            currentRotation = totalRotation;

            const duration = parseInt(document.getElementById('spinDuration').value) || 5;
            const wheel = document.getElementById('wheel');
            wheel.style.transition = `transform ${duration}s cubic-bezier(0.17, 0.67, 0.12, 0.99)`;
            wheel.style.transform = `rotate(${currentRotation}deg)`;

            if (soundEnabled) playTickSound(duration);

            setTimeout(() => {
                isSpinning = false;
                document.getElementById('spinBtn').disabled = false;
                document.getElementById('wheelCenter').classList.remove('disabled');

                const winner = items[randomIndex];

                history.unshift({
                    name: winner,
                    time: new Date().toISOString()
                });
                history = history.slice(0, 50);
                saveToStorage();

                showResult(winner);

                if (document.getElementById('removeAfterSpin').checked) {
                    items.splice(randomIndex, 1);
                    document.getElementById('namesInput').value = items.join('\n');
                    setTimeout(() => {
                        renderWheel();
                        saveToStorage();
                    }, 500);
                }
            }, duration * 1000 + 100);
        }

        // ═══════════════════════════════════════════════════════════
        //  HIỆN KẾT QUẢ
        // ═══════════════════════════════════════════════════════════
        function showResult(winner) {
            if (document.getElementById('showConfetti').checked) {
                createConfetti();
            }
            if (soundEnabled) playWinSound();

            if (document.getElementById('showResultModal').checked) {
                document.getElementById('resultValue').textContent = winner;
                document.getElementById('resultModal').classList.add('show');
            } else {
                showToast(`🎉 Kết quả: ${winner}`);
            }
        }

        function closeResult() {
            document.getElementById('resultModal').classList.remove('show');
        }

        function closeResultAndSpin() {
            closeResult();
            setTimeout(() => spin(), 300);
        }

        // ═══════════════════════════════════════════════════════════
        //  ÂM THANH
        // ═══════════════════════════════════════════════════════════
        function getAudioContext() {
            try {
                return new (window.AudioContext || window.webkitAudioContext)();
            } catch (e) { return null; }
        }

        function playTickSound(duration) {
            const ctx = getAudioContext();
            if (!ctx) return;

            const volume = (parseInt(document.getElementById('volumeSlider').value) || 50) / 100;
            let elapsed = 0;
            let delay = 0.05;

            for (let i = 0; i < 40; i++) {
                if (elapsed >= duration - 0.3) break;

                setTimeout(() => {
                    try {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.type = 'square';
                        osc.frequency.setValueAtTime(800 + Math.random() * 200, ctx.currentTime);
                        gain.gain.setValueAtTime(volume * 0.08, ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.03);
                        osc.start(ctx.currentTime);
                        osc.stop(ctx.currentTime + 0.04);
                    } catch (e) {}
                }, elapsed * 1000);

                elapsed += delay;
                delay *= 1.08;
            }
        }

        function playWinSound() {
            const ctx = getAudioContext();
            if (!ctx) return;

            const volume = (parseInt(document.getElementById('volumeSlider').value) || 50) / 100;
            const notes = [523, 659, 784, 1047];

            notes.forEach((freq, i) => {
                try {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.1);
                    gain.gain.setValueAtTime(volume * 0.15, ctx.currentTime + i * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + i * 0.1 + 0.25);
                    osc.start(ctx.currentTime + i * 0.1);
                    osc.stop(ctx.currentTime + i * 0.1 + 0.3);
                } catch (e) {}
            });
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('soundToggle');
            btn.textContent = soundEnabled ? '🔊 Âm thanh' : '🔇 Tắt tiếng';
            btn.classList.toggle('active', soundEnabled);
            saveToStorage();
            showToast(soundEnabled ? '🔊 Đã bật âm thanh' : '🔇 Đã tắt âm thanh');
        }

        // ═══════════════════════════════════════════════════════════
        //  CONFETTI
        // ═══════════════════════════════════════════════════════════
        function createConfetti() {
            const container = document.getElementById('confettiContainer');
            const colors = ['#ff4757', '#ffa502', '#ffd700', '#2ed573', '#1e90ff', '#a55eea', '#ff6b7a', '#7bed9f'];
            const total = 100;

            for (let i = 0; i < total; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';

                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.top = '-20px';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.width = (6 + Math.random() * 10) + 'px';
                    confetti.style.height = (6 + Math.random() * 10) + 'px';
                    confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';

                    const duration = 2000 + Math.random() * 2000;
                    const rotate = Math.random() * 720 - 360;
                    const translateX = (Math.random() - 0.5) * 400;

                    confetti.animate([
                        { transform: `translate(0, 0) rotate(0deg)`, opacity: 1 },
                        { transform: `translate(${translateX}px, 100vh) rotate(${rotate}deg)`, opacity: 0 }
                    ], {
                        duration: duration,
                        easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)',
                    });

                    container.appendChild(confetti);
                    setTimeout(() => confetti.remove(), duration + 100);
                }, i * 20);
            }
        }

        // ═══════════════════════════════════════════════════════════
        //  LỊCH SỬ
        // ═══════════════════════════════════════════════════════════
        function openHistory() {
            renderHistory();
            document.getElementById('historyPanel').classList.add('show');
        }

        function closeHistory() {
            document.getElementById('historyPanel').classList.remove('show');
        }

        function renderHistory() {
            const list = document.getElementById('historyList');

            if (history.length === 0) {
                list.innerHTML = `
                    <div class="history-empty">
                        <div style="font-size: 3rem; margin-bottom: 12px; opacity: 0.5;">📭</div>
                        Chưa có lịch sử
                    </div>
                `;
                return;
            }

            list.innerHTML = history.map((h) => {
                const date = new Date(h.time);
                const timeStr = date.toLocaleString('vi-VN', {
                    day: '2-digit',
                    month: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });

                return `
                    <div class="history-item">
                        <div class="h-name">${escapeHtml(h.name)}</div>
                        <div class="h-time">🕐 ${timeStr}</div>
                    </div>
                `;
            }).join('');
        }

        // ═══════════════════════════════════════════════════════════
        //  UTILS
        // ═══════════════════════════════════════════════════════════
        function clearAll() {
            if (!confirm('Xóa toàn bộ danh sách?')) return;
            items = [];
            document.getElementById('namesInput').value = '';
            renderWheel();
            saveToStorage();
            showToast('🗑️ Đã xóa hết');
        }

        function shuffleItems() {
            if (items.length < 2) {
                showToast('⚠️ Cần ít nhất 2 mục!', true);
                return;
            }
            // Fisher-Yates shuffle
            for (let i = items.length - 1; i > 0; i--) {
                const j = secureRandomInt(i + 1);
                [items[i], items[j]] = [items[j], items[i]];
            }
            document.getElementById('namesInput').value = items.join('\n');
            renderWheel();
            saveToStorage();
            showToast('🔀 Đã trộn danh sách');
        }

        function sortItems() {
            if (items.length < 2) {
                showToast('⚠️ Cần ít nhất 2 mục!', true);
                return;
            }
            items.sort((a, b) => a.localeCompare(b, 'vi'));
            document.getElementById('namesInput').value = items.join('\n');
            renderWheel();
            saveToStorage();
            showToast('🔤 Đã sắp xếp');
        }

        function escapeHtml(s) {
            if (!s) return '';
            return String(s).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;',
                '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        function showToast(msg, isError = false) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast show' + (isError ? ' error' : '');
            setTimeout(() => t.classList.remove('show'), 2200);
        }

        // ═══════════════════════════════════════════════════════════
        //  EVENTS
        // ═══════════════════════════════════════════════════════════
        document.getElementById('resultModal').addEventListener('click', (e) => {
            if (e.target.id === 'resultModal') closeResult();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeResult();
                closeHistory();
            }
            if (e.key === ' ' && document.activeElement.tagName !== 'TEXTAREA') {
                e.preventDefault();
                spin();
            }
        });

        document.getElementById('namesInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                applyChanges();
            }
        });

        let applyTimer;
        document.getElementById('namesInput').addEventListener('input', () => {
            clearTimeout(applyTimer);
            applyTimer = setTimeout(applyChanges, 500);
        });

        ['removeAfterSpin', 'showConfetti', 'showResultModal', 'spinDuration', 'volumeSlider', 'fontSize'].forEach(id => {
            const el = document.getElementById(id);
            if (el) {
                el.addEventListener('change', () => {
                    if (id === 'fontSize') renderWheel();
                    saveToStorage();
                });
            }
        });

        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                if (items.length > 0) renderWheel();
            }, 200);
        });

        // ═══════════════════════════════════════════════════════════
        //  INIT
        // ═══════════════════════════════════════════════════════════
        function init() {
            loadFromStorage();

            const soundBtn = document.getElementById('soundToggle');
            soundBtn.textContent = soundEnabled ? '🔊 Âm thanh' : '🔇 Tắt tiếng';
            soundBtn.classList.toggle('active', soundEnabled);

            renderWheel();
        }

        init();
    </script>
</body>
