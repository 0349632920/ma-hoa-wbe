<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐍 Rắn săn mồi</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .snake-container {
            max-width: 500px;
            width: 100%;
            padding: 28px;
            background: rgba(15, 15, 25, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            text-align: center;
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .snake-container h1 {
            font-size: 1.9rem;
            margin-bottom: 12px;
            padding: 10px 22px;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 12px;
            display: inline-block;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
        }

        .hint {
            color: #c8c8e0;
            font-size: 0.9rem;
            margin-bottom: 16px;
            padding: 8px 14px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 10px;
            display: inline-block;
        }

        .hint b { color: #2ed573; }

        .snake-info {
            display: flex;
            justify-content: space-around;
            margin: 18px 0;
            font-size: 1.1rem;
            padding: 12px 0;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 12px;
        }

        .snake-info b {
            color: #2ed573;
            font-family: 'JetBrains Mono', monospace;
        }

        #snake-canvas {
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            display: block;
            margin: 0 auto 18px;
            max-width: 100%;
            background: #1a1a2e;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .snake-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            background: #2ed573;
            color: #0f0c29;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover:not(:disabled) {
            background: #7bed9f;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(46, 213, 115, 0.3);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn.orange { background: #ffa502; }
        .btn.orange:hover:not(:disabled) { background: #ffbe4d; }
        .btn.blue { background: #1e90ff; color: #fff; }
        .btn.blue:hover:not(:disabled) { background: #4da6ff; }

        .back {
            display: inline-block;
            margin-top: 16px;
            color: #e0e0ff;
            text-decoration: none;
            font-size: 0.95rem;
            padding: 10px 18px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s;
        }

        .back:hover {
            color: #2ed573;
            background: rgba(0, 0, 0, 0.5);
            transform: translateX(-4px);
        }

        @media (max-width: 480px) {
            .snake-container { padding: 20px 16px; }
            .snake-container h1 { font-size: 1.5rem; }
            .snake-info { font-size: 0.95rem; }
        }
    </style>
</head>
<body>
    <div class="snake-container">
        <h1>🐍 Rắn săn mồi</h1>
        <p class="hint">Dùng <b>mũi tên</b> hoặc <b>WASD</b>. Nhấn <b>Space</b> để tạm dừng.</p>

        <div class="snake-info">
            <span>Điểm: <b id="score">0</b></span>
            <span>Kỷ lục: <b id="best">0</b></span>
        </div>

        <canvas id="snake-canvas" width="400" height="400"></canvas>

        <div class="snake-controls">
            <button class="btn" id="start-btn">▶️ Bắt đầu</button>
            <button class="btn orange" id="pause-btn" disabled>⏸️ Tạm dừng</button>
            <button class="btn blue" id="restart-btn">🔄 Chơi lại</button>
        </div>
        <br>
        <a class="back" href="{{ url_for('game_page') }}">← Chọn game khác</a>
    </div>

    <script>
        const canvas = document.getElementById('snake-canvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const bestEl = document.getElementById('best');
        const startBtn = document.getElementById('start-btn');
        const pauseBtn = document.getElementById('pause-btn');
        const restartBtn = document.getElementById('restart-btn');

        const GRID = 20;
        const CELL = canvas.width / GRID;

        let snake, food, dir, nextDir, score, running, paused, gameLoop;

        function init() {
            snake = [{x: 10, y: 10}];
            dir = {x: 1, y: 0};
            nextDir = {x: 1, y: 0};
            score = 0;
            running = false;
            paused = false;
            scoreEl.textContent = 0;
            spawnFood();
            draw();
        }

        function spawnFood() {
            do {
                food = {
                    x: Math.floor(Math.random() * GRID),
                    y: Math.floor(Math.random() * GRID)
                };
            } while (snake.some(s => s.x === food.x && s.y === food.y));
        }

        function draw() {
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = 'rgba(255,255,255,0.05)';
            for (let i = 0; i <= GRID; i++) {
                ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(canvas.width, i * CELL); ctx.stroke();
            }

            ctx.fillStyle = '#ff4757';
            ctx.beginPath();
            ctx.arc(food.x * CELL + CELL/2, food.y * CELL + CELL/2, CELL/2 - 2, 0, Math.PI*2);
            ctx.fill();

            snake.forEach((seg, i) => {
                ctx.fillStyle = i === 0 ? '#2ed573' : '#7bed9f';
                ctx.fillRect(seg.x * CELL + 1, seg.y * CELL + 1, CELL - 2, CELL - 2);
            });
        }

        function step() {
            if (paused) return;
            dir = nextDir;
            const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

            if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) return gameOver();
            if (snake.some(s => s.x === head.x && s.y === head.y)) return gameOver();

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.textContent = score;
                spawnFood();
            } else {
                snake.pop();
            }
            draw();
        }

        async function gameOver() {
            running = false;
            clearInterval(gameLoop);
            startBtn.disabled = false;
            pauseBtn.disabled = true;

            try {
                const res = await fetch('/api/game/snake/score', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({score})
                });
                const data = await res.json();

                // ⭐ Xử lý cấm game
                if (data.game_banned) {
                    window.location.href = data.redirect || '/game';
                    return;
                }

                if (data.success) {
                    bestEl.textContent = data.best;
                    if (data.is_new_record) {
                        showGameOverModal(score, data.points_earned, true);
                    } else {
                        showGameOverModal(score, 0, false);
                    }
                }
            } catch {
                showGameOverModal(score, 0, false);
            }
        }

        function showGameOverModal(score, points, isRecord) {
            // Dùng alert nhẹ nhàng hơn
            const msg = isRecord
                ? `🎉 Kỷ lục mới: ${score} điểm! +${points} điểm hệ thống`
                : `💀 Game Over! Điểm: ${score}`;
            // Tạo overlay thay vì alert của Google
            showCustomGameOver(msg, isRecord);
        }

        function showCustomGameOver(msg, isRecord) {
            // Xóa overlay cũ nếu có
            const old = document.getElementById('__gameOverOverlay');
            if (old) old.remove();

            const overlay = document.createElement('div');
            overlay.id = '__gameOverOverlay';
            overlay.innerHTML = `
                <div style="
                    position: fixed; inset: 0;
                    background: rgba(0, 0, 0, 0.75);
                    backdrop-filter: blur(8px);
                    z-index: 9999;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    padding: 20px;
                    animation: fadeIn 0.3s ease;
                ">
                    <div style="
                        background: linear-gradient(135deg, #1a1a2e, #0f0f1a);
                        border: 2px solid ${isRecord ? 'rgba(46, 213, 115, 0.5)' : 'rgba(255, 71, 87, 0.5)'};
                        border-radius: 20px;
                        padding: 36px 32px;
                        max-width: 420px;
                        width: 100%;
                        text-align: center;
                        color: #fff;
                        box-shadow: 0 25px 80px rgba(0, 0, 0, 0.8);
                    ">
                        <div style="font-size: 4rem; margin-bottom: 16px; animation: bounce 1s ease infinite alternate;">
                            ${isRecord ? '🎉' : '💀'}
                        </div>
                        <h2 style="
                            font-size: 1.6rem;
                            font-weight: 800;
                            margin-bottom: 12px;
                            color: ${isRecord ? '#2ed573' : '#ff4757'};
                        ">
                            ${isRecord ? 'Kỷ lục mới!' : 'Game Over'}
                        </h2>
                        <p style="color: #c8c8e0; font-size: 1rem; margin-bottom: 8px;">
                            ${isRecord ? `Bạn đã đạt <b style="color:#fff;">${score} điểm</b>!` : `Bạn đạt <b style="color:#fff;">${score} điểm</b>`}
                        </p>
                        ${isRecord ? `<p style="color: #7bed9f; font-weight: 700; margin-bottom: 20px;">+${points} điểm hệ thống</p>` : '<div style="height: 20px;"></div>'}
                        <button onclick="this.closest('#__gameOverOverlay').remove()" style="
                            padding: 12px 32px;
                            border: none;
                            border-radius: 12px;
                            background: #2ed573;
                            color: #0f0c29;
                            font-weight: 700;
                            font-size: 1rem;
                            cursor: pointer;
                            font-family: inherit;
                            transition: all 0.2s;
                        " onmouseover="this.style.background='#7bed9f'; this.style.transform='translateY(-2px)';"
                           onmouseout="this.style.background='#2ed573'; this.style.transform='none';">
                            Đóng
                        </button>
                    </div>
                </div>
                <style>
                    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
                    @keyframes bounce {
                        from { transform: translateY(0) scale(1); }
                        to   { transform: translateY(-10px) scale(1.05); }
                    }
                </style>
            `;
            document.body.appendChild(overlay);
        }

        function setDirection(nx, ny) {
            if (dir.x === -nx && dir.y === -ny) return;
            nextDir = {x: nx, y: ny};
        }

        document.addEventListener('keydown', e => {
            const k = e.key.toLowerCase();
            if (k === 'arrowup' || k === 'w') setDirection(0, -1);
            else if (k === 'arrowdown' || k === 's') setDirection(0, 1);
            else if (k === 'arrowleft' || k === 'a') setDirection(-1, 0);
            else if (k === 'arrowright' || k === 'd') setDirection(1, 0);
            else if (k === ' ') { e.preventDefault(); togglePause(); }
            if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
        });

        function togglePause() {
            if (!running) return;
            paused = !paused;
            pauseBtn.textContent = paused ? '▶️ Tiếp tục' : '⏸️ Tạm dừng';
        }

        startBtn.addEventListener('click', () => {
            if (running) return;
            running = true; paused = false;
            startBtn.disabled = true; pauseBtn.disabled = false;
            pauseBtn.textContent = '⏸️ Tạm dừng';
            gameLoop = setInterval(step, 120);
        });

        pauseBtn.addEventListener('click', togglePause);

        restartBtn.addEventListener('click', () => {
            clearInterval(gameLoop);
            init();
            startBtn.disabled = false;
            pauseBtn.disabled = true;
            pauseBtn.textContent = '⏸️ Tạm dừng';
        });

        // Load kỷ lục ban đầu
        fetch('/api/game/snake/best')
            .then(r => r.json())
            .then(d => {
                if (d.game_banned) {
                    window.location.href = d.redirect || '/game';
                    return;
                }
                if (d.success) bestEl.textContent = d.best;
            })
            .catch(() => {});

        init();
    </script>

    <!-- ⭐ POLLING PHÁT HIỆN CẤM/GỠ CẤM GAME -->
    <script src="{{ url_for('static', filename='game_polling.js') }}"></script>
</body>
</html>
