<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎯 Đoán số</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .guess-container {
            max-width: 560px;
            width: 100%;
            padding: 32px;
            background: rgba(15, 15, 25, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            text-align: center;
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .guess-container h1 {
            font-size: 2rem;
            margin-bottom: 12px;
            display: inline-block;
            padding: 10px 24px;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 14px;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
        }

        .sub {
            color: #c8c8e0;
            margin-bottom: 24px;
            font-size: 0.95rem;
            line-height: 1.6;
            padding: 8px 16px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            display: inline-block;
        }

        .sub b { color: #2ed573; }

        .input-row {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .input-row input {
            flex: 1;
            padding: 14px 16px;
            font-size: 1.1rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            outline: none;
            font-family: inherit;
            transition: all 0.2s;
        }

        .input-row input:focus {
            border-color: #2ed573;
            box-shadow: 0 0 0 3px rgba(46, 213, 115, 0.15);
        }

        .btn {
            padding: 14px 24px;
            border: none;
            border-radius: 12px;
            background: #2ed573;
            color: #0f0c29;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1rem;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn:hover:not(:disabled) {
            background: #7bed9f;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(46, 213, 115, 0.3);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn.secondary {
            background: #ffa502;
            margin-top: 10px;
        }

        .btn.secondary:hover:not(:disabled) {
            background: #ffbe4d;
        }

        .result {
            min-height: 60px;
            padding: 16px;
            border-radius: 12px;
            font-size: 1.1rem;
            margin-bottom: 14px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #c8c8e0;
        }

        .result.correct {
            background: rgba(46, 213, 115, 0.25);
            border: 1px solid #2ed573;
            color: #7bed9f;
            font-weight: 700;
        }

        .result.low {
            background: rgba(30, 144, 255, 0.25);
            border: 1px solid #1e90ff;
            color: #87cefa;
        }

        .result.high {
            background: rgba(255, 71, 87, 0.25);
            border: 1px solid #ff4757;
            color: #ff6b7a;
        }

        .result.warn {
            background: rgba(255, 165, 2, 0.25);
            border: 1px solid #ffa502;
            color: #ffbe4d;
        }

        .counter {
            color: #b8b8d1;
            margin: 12px 0 20px;
            font-size: 0.95rem;
            padding: 8px 16px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            display: inline-block;
        }

        .counter b { color: #2ed573; font-size: 1.1rem; }

        .back {
            display: inline-block;
            margin-top: 20px;
            color: #b8b8d1;
            text-decoration: none;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s;
            font-size: 0.92rem;
        }

        .back:hover {
            color: #2ed573;
            border-color: #2ed573;
            transform: translateX(-4px);
        }
    </style>
</head>
<body>
    <div class="guess-container">
        <h1>🎯 Đoán số bí mật</h1>
        <p class="sub">Mình đang nghĩ đến số từ <b>1 đến 100</b>. Đoán xem!</p>

        <div class="input-row">
            <input type="number" id="guess-input" min="1" max="100" placeholder="Nhập số...">
            <button class="btn" id="guess-btn">Đoán</button>
        </div>

        <div id="result" class="result"></div>
        <p class="counter">Số lần đoán: <b id="count">0</b></p>

        <br>
        <button class="btn secondary" id="reset-btn">🔄 Chơi lại</button>
        <br>
        <a class="back" href="{{ url_for('game_page') }}">← Chọn game khác</a>
    </div>

    <script>
        const input = document.getElementById('guess-input');
        const btn = document.getElementById('guess-btn');
        const resultBox = document.getElementById('result');
        const countSpan = document.getElementById('count');
        const resetBtn = document.getElementById('reset-btn');

        async function makeGuess() {
            const guess = parseInt(input.value);
            if (isNaN(guess) || guess < 1 || guess > 100) {
                showResult('⚠️ Vui lòng nhập số từ 1 đến 100!', 'warn');
                return;
            }

            try {
                const res = await fetch('/api/game/guess/check', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({guess})
                });
                const data = await res.json();

                // ⭐ Xử lý cấm game
                if (data.game_banned) {
                    window.location.href = data.redirect || '/game';
                    return;
                }

                if (!data.success) {
                    showResult('⚠️ ' + (data.error || 'Có lỗi xảy ra!'), 'warn');
                    return;
                }

                countSpan.textContent = data.count;

                if (data.result === 'correct') {
                    showResult(data.message, 'correct');
                    btn.disabled = true;
                } else if (data.result === 'low') {
                    showResult(data.message, 'low');
                } else {
                    showResult(data.message, 'high');
                }

                input.value = '';
                input.focus();
            } catch (e) {
                showResult('⚠️ Lỗi kết nối!', 'warn');
            }
        }

        function showResult(msg, type) {
            resultBox.textContent = msg;
            resultBox.className = 'result ' + type;
        }

        btn.addEventListener('click', makeGuess);
        input.addEventListener('keypress', e => {
            if (e.key === 'Enter') makeGuess();
        });

        resetBtn.addEventListener('click', async () => {
            try {
                await fetch('/api/game/guess/reset', {method: 'POST'});
                countSpan.textContent = '0';
                resultBox.textContent = '';
                resultBox.className = 'result';
                btn.disabled = false;
                input.value = '';
                input.focus();
            } catch (e) {
                alert('Lỗi kết nối!');
            }
        });

        input.focus();
    </script>

    <!-- ⭐ POLLING PHÁT HIỆN CẤM/GỠ CẤM GAME -->
    <script src="{{ url_for('static', filename='game_polling.js') }}"></script>
    <script src="{{ url_for('static', filename='logout-sync.js') }}"></script>
</body>
</html>
