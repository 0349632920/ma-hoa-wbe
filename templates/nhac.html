<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 Nhạc Funk</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #2d1b3d 50%, #0f0f1a 100%);
            color: #fff;
            padding: 20px 15px 130px;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        .back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 20px;
            color: #c8c8e0;
            text-decoration: none;
            padding: 10px 18px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            transition: all 0.2s;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .back:hover {
            color: #ff6b9d;
            border-color: #ff6b9d;
            transform: translateX(-4px);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ff6b9d, #f093fb, #667eea);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .btn-refresh {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-refresh:hover {
            background: rgba(255, 107, 157, 0.2);
            transform: translateY(-2px);
        }

        .music-list {
            background: rgba(15, 15, 25, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            backdrop-filter: blur(12px);
            max-height: calc(100vh - 280px);
            overflow-y: auto;
        }

        .music-list::-webkit-scrollbar { width: 8px; }
        .music-list::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); border-radius: 4px; }
        .music-list::-webkit-scrollbar-thumb { background: rgba(255, 107, 157, 0.4); border-radius: 4px; }
        .music-list::-webkit-scrollbar-thumb:hover { background: rgba(255, 107, 157, 0.6); }

        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .list-header h2 {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ff6b9d;
        }

        .total-badge {
            padding: 4px 12px;
            background: rgba(255, 107, 157, 0.15);
            border: 1px solid rgba(255, 107, 157, 0.3);
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            color: #ff6b9d;
        }

        .music-item {
            display: flex;
            align-items: center;
            padding: 12px 14px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            gap: 12px;
            margin-bottom: 4px;
            border: 2px solid transparent;
        }

        .music-item:hover {
            background: rgba(255, 107, 157, 0.08);
            transform: translateX(4px);
        }

        .music-item.playing {
            background: rgba(255, 107, 157, 0.15);
            border-color: rgba(255, 107, 157, 0.4);
        }

        .music-item.playing .music-name {
            color: #ff6b9d;
            font-weight: 800;
        }

        .music-index {
            flex-shrink: 0;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 700;
            color: #9999bb;
            font-family: 'JetBrains Mono', monospace;
        }

        .music-item.playing .music-index {
            background: linear-gradient(135deg, #ff6b9d, #f5576c);
            color: #fff;
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50%      { transform: scale(1.1); }
        }

        .music-info {
            flex: 1;
            min-width: 0;
        }

        .music-name {
            font-weight: 600;
            font-size: 0.92rem;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 2px;
        }

        .music-meta {
            font-size: 0.75rem;
            color: #9999bb;
            font-family: 'JetBrains Mono', monospace;
        }

        .music-play-btn {
            flex-shrink: 0;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .music-item:hover .music-play-btn,
        .music-item.playing .music-play-btn {
            background: linear-gradient(135deg, #ff6b9d, #f5576c);
        }

        /* PLAYER BAR */
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(135deg, rgba(26, 26, 46, 0.98), rgba(15, 15, 26, 0.98));
            border-top: 2px solid rgba(255, 107, 157, 0.3);
            backdrop-filter: blur(20px);
            padding: 16px 20px;
            z-index: 999;
            display: none;
        }

        .player-bar.show { display: block; }

        .player-content {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 20px;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .player-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: linear-gradient(135deg, #ff6b9d, #f5576c);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            flex-shrink: 0;
            animation: rotate 8s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        .player-name {
            font-weight: 700;
            font-size: 0.95rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 2px;
        }

        .player-time-small {
            font-size: 0.75rem;
            color: #9999bb;
            font-family: 'JetBrains Mono', monospace;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .ctrl-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ctrl-btn:hover {
            background: rgba(255, 107, 157, 0.25);
            transform: scale(1.1);
        }

        .ctrl-btn.active {
            background: rgba(255, 107, 157, 0.35);
            color: #ff6b9d;
        }

        .ctrl-btn.play-btn {
            width: 54px;
            height: 54px;
            background: linear-gradient(135deg, #ff6b9d, #f5576c);
            font-size: 1.2rem;
            box-shadow: 0 8px 20px rgba(255, 107, 157, 0.4);
        }

        .ctrl-btn.play-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 12px 28px rgba(255, 107, 157, 0.6);
        }

        .player-right {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: flex-end;
        }

        .volume-slider {
            width: 100px;
            accent-color: #ff6b9d;
        }

        .progress-container {
            max-width: 1200px;
            margin: 12px auto 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .time-label {
            font-size: 0.75rem;
            color: #9999bb;
            font-family: 'JetBrains Mono', monospace;
            min-width: 42px;
            text-align: center;
        }

        .progress-bar {
            flex: 1;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
            transition: height 0.2s;
        }

        .progress-bar:hover { height: 8px; }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff6b9d, #f5576c);
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s linear;
            position: relative;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 10px rgba(255, 107, 157, 0.8);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .progress-bar:hover .progress-fill::after { opacity: 1; }

        /* LOADING */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #9999bb;
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 107, 157, 0.2);
            border-top-color: #ff6b9d;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .empty, .error-box {
            text-align: center;
            padding: 60px 20px;
            color: #9999bb;
        }

        .empty .icon, .error-box .icon {
            font-size: 4rem;
            margin-bottom: 16px;
            display: block;
            opacity: 0.5;
        }

        .error-box {
            background: rgba(255, 71, 87, 0.1);
            border: 1px solid rgba(255, 71, 87, 0.3);
            border-radius: 16px;
            color: #ff6b7a;
            padding: 40px 24px;
        }

        .error-box code {
            display: inline-block;
            margin-top: 10px;
            padding: 6px 14px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: #ffbe4d;
        }

        /* TOAST */
        .toast {
            position: fixed;
            bottom: 140px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #ff6b9d;
            color: #fff;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 600;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transition: all 0.4s;
            pointer-events: none;
            z-index: 10000;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        @media (max-width: 768px) {
            .player-content {
                grid-template-columns: 1fr;
                gap: 12px;
                text-align: center;
            }
            .player-info { justify-content: center; }
            .player-right { justify-content: center; }
            .volume-slider { width: 80px; }
            .player-icon { width: 40px; height: 40px; font-size: 1.2rem; }
            .ctrl-btn.play-btn { width: 46px; height: 46px; }
            h1 { font-size: 1.5rem; }
            .music-list { max-height: calc(100vh - 380px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="{{ url_for('index') }}" class="back">← Về trang chủ</a>

        <div class="header">
            <h1>🎵 Nhạc Funk</h1>
            <button class="btn-refresh" onclick="loadMusic(true)">🔄 Làm mới</button>
        </div>

        {% if not has_api %}
        <div class="error-box">
            <span class="icon">⚠️</span>
            <h3>Chưa cấu hình Google Drive API</h3>
            <p style="margin-top: 12px;">Cần thêm biến môi trường trên Render:</p>
            <code>GOOGLE_API_KEY=AIzaSy...</code>
        </div>
        {% else %}
        <div class="music-list" id="musicList">
            <div class="loading">
                <div class="spinner"></div>
                <p>Đang tải danh sách nhạc...</p>
            </div>
        </div>
        {% endif %}
    </div>

    <div class="player-bar" id="playerBar">
        <div class="player-content">
            <div class="player-info">
                <div class="player-icon">💿</div>
                <div style="min-width: 0; flex: 1;">
                    <div class="player-name" id="playerName">—</div>
                    <div class="player-time-small" id="playerMeta">—</div>
                </div>
            </div>

            <div class="player-controls">
                <button class="ctrl-btn" id="shuffleBtn" onclick="toggleShuffle()" title="Ngẫu nhiên">🔀</button>
                <button class="ctrl-btn" onclick="playPrev()" title="Bài trước">⏮️</button>
                <button class="ctrl-btn play-btn" id="playPauseBtn" onclick="togglePlay()" title="Play/Pause">▶️</button>
                <button class="ctrl-btn" onclick="playNext()" title="Bài tiếp">⏭️</button>
                <button class="ctrl-btn" id="repeatBtn" onclick="toggleRepeat()" title="Lặp lại">🔁</button>
            </div>

            <div class="player-right">
                <span style="font-size: 1.1rem;">🔊</span>
                <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="70">
            </div>
        </div>

        <div class="progress-container">
            <span class="time-label" id="currentTime">0:00</span>
            <div class="progress-bar" id="progressBar" onclick="seekAudio(event)">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <span class="time-label" id="duration">0:00</span>
        </div>
    </div>

    <audio id="audioElement"></audio>

    <div class="toast" id="toast"></div>

    <script>
        let musicFiles = [];
        let currentIndex = -1;
        let isPlaying = false;
        let isShuffle = false;
        let isRepeat = false;

        const audio = document.getElementById('audioElement');
        const playerBar = document.getElementById('playerBar');
        const playerName = document.getElementById('playerName');
        const playerMeta = document.getElementById('playerMeta');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const progressFill = document.getElementById('progressFill');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        const volumeSlider = document.getElementById('volumeSlider');
        const shuffleBtn = document.getElementById('shuffleBtn');
        const repeatBtn = document.getElementById('repeatBtn');

        // LOAD MUSIC
        async function loadMusic(refresh = false) {
            const listEl = document.getElementById('musicList');
            listEl.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Đang tải danh sách nhạc...</p>
                </div>
            `;

            try {
                const url = '/api/music/list' + (refresh ? '?refresh=true' : '');
                const res = await fetch(url);

                if (res.status === 401) {
                    window.location.href = '/login';
                    return;
                }

                const data = await res.json();

                if (!data.success) {
                    listEl.innerHTML = `
                        <div class="error-box">
                            <span class="icon">❌</span>
                            <h3>Không thể tải nhạc</h3>
                            <p style="margin-top: 8px;">${escapeHtml(data.error || 'Lỗi không xác định')}</p>
                        </div>
                    `;
                    return;
                }

                musicFiles = data.files || [];

                if (musicFiles.length === 0) {
                    listEl.innerHTML = `
                        <div class="empty">
                            <span class="icon">🎵</span>
                            <h3>Chưa có bài nhạc nào</h3>
                        </div>
                    `;
                    return;
                }

                renderMusicList();
                if (refresh) showToast(`✅ Đã làm mới ${musicFiles.length} bài`);

            } catch (e) {
                listEl.innerHTML = `
                    <div class="error-box">
                        <span class="icon">❌</span>
                        <h3>Lỗi kết nối</h3>
                        <p style="margin-top: 8px;">${escapeHtml(e.message)}</p>
                    </div>
                `;
            }
        }

        function renderMusicList() {
            const listEl = document.getElementById('musicList');
            listEl.innerHTML = `
                <div class="list-header">
                    <h2>📀 Danh sách bài hát</h2>
                    <span class="total-badge">${musicFiles.length} bài</span>
                </div>
                ${musicFiles.map((f, i) => `
                    <div class="music-item" data-index="${i}" onclick="playAt(${i})">
                        <div class="music-index">${i + 1}</div>
                        <div class="music-info">
                            <div class="music-name" title="${escapeHtml(f.name)}">${escapeHtml(cleanName(f.name))}</div>
                            <div class="music-meta">${f.size_mb} MB</div>
                        </div>
                        <button class="music-play-btn" onclick="event.stopPropagation(); playAt(${i})">▶</button>
                    </div>
                `).join('')}
            `;
        }

        function cleanName(name) {
            return name.replace(/\.(mp3|m4a|wav|ogg)$/i, '');
        }

        // PLAY
        function playAt(index) {
            if (index < 0 || index >= musicFiles.length) return;

            const file = musicFiles[index];
            currentIndex = index;

            playerBar.classList.add('show');
            playerName.textContent = cleanName(file.name);
            playerMeta.textContent = `${file.size_mb} MB`;

            audio.src = `/api/music/stream/${file.id}`;
            audio.load();
            audio.play().then(() => {
                isPlaying = true;
                updatePlayBtn();
                highlightCurrent();
            }).catch(err => {
                showToast('❌ Không thể phát: ' + err.message);
            });
        }

        function togglePlay() {
            if (currentIndex === -1 && musicFiles.length > 0) {
                playAt(0);
                return;
            }

            if (isPlaying) {
                audio.pause();
                isPlaying = false;
            } else {
                audio.play();
                isPlaying = true;
            }
            updatePlayBtn();
        }

        function updatePlayBtn() {
            playPauseBtn.textContent = isPlaying ? '⏸️' : '▶️';
        }

        function playNext() {
            if (musicFiles.length === 0) return;

            let nextIdx;
            if (isShuffle) {
                nextIdx = Math.floor(Math.random() * musicFiles.length);
                if (musicFiles.length > 1) {
                    while (nextIdx === currentIndex) {
                        nextIdx = Math.floor(Math.random() * musicFiles.length);
                    }
                }
            } else {
                nextIdx = (currentIndex + 1) % musicFiles.length;
            }
            playAt(nextIdx);
        }

        function playPrev() {
            if (musicFiles.length === 0) return;

            // Nếu đang phát > 3s → quay về đầu bài
            if (audio.currentTime > 3) {
                audio.currentTime = 0;
                return;
            }

            let prevIdx = (currentIndex - 1 + musicFiles.length) % musicFiles.length;
            playAt(prevIdx);
        }

        function toggleShuffle() {
            isShuffle = !isShuffle;
            shuffleBtn.classList.toggle('active', isShuffle);
            showToast(isShuffle ? '🔀 Bật ngẫu nhiên' : '➡️ Tắt ngẫu nhiên');
        }

        function toggleRepeat() {
            isRepeat = !isRepeat;
            repeatBtn.classList.toggle('active', isRepeat);
            audio.loop = isRepeat;
            showToast(isRepeat ? '🔁 Bật lặp lại' : '➡️ Tắt lặp lại');
        }

        function highlightCurrent() {
            document.querySelectorAll('.music-item').forEach((el, i) => {
                el.classList.toggle('playing', i === currentIndex);
            });
            // Scroll vào view
            const cur = document.querySelector(`.music-item[data-index="${currentIndex}"]`);
            if (cur) cur.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        // AUDIO EVENTS
        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const pct = (audio.currentTime / audio.duration) * 100;
                progressFill.style.width = pct + '%';
                currentTimeEl.textContent = formatTime(audio.currentTime);
            }
        });

        audio.addEventListener('loadedmetadata', () => {
            durationEl.textContent = formatTime(audio.duration);
        });

        audio.addEventListener('ended', () => {
            if (!isRepeat) playNext();
        });

        audio.addEventListener('error', (e) => {
            if (currentIndex !== -1) {
                showToast('❌ Lỗi phát nhạc');
            }
        });

        audio.addEventListener('play', () => { isPlaying = true; updatePlayBtn(); });
        audio.addEventListener('pause', () => { isPlaying = false; updatePlayBtn(); });

        // VOLUME
        volumeSlider.addEventListener('input', (e) => {
            audio.volume = e.target.value / 100;
        });
        audio.volume = 0.7;

        // SEEK
        function seekAudio(e) {
            if (!audio.duration) return;
            const rect = e.currentTarget.getBoundingClientRect();
            const pct = (e.clientX - rect.left) / rect.width;
            audio.currentTime = pct * audio.duration;
        }

        // KEYBOARD
        document.addEventListener('keydown', (e) => {
            if (document.activeElement.tagName === 'INPUT') return;

            if (e.key === ' ') { e.preventDefault(); togglePlay(); }
            else if (e.key === 'ArrowRight' && e.ctrlKey) { playNext(); }
            else if (e.key === 'ArrowLeft' && e.ctrlKey) { playPrev(); }
        });

        function formatTime(sec) {
            if (!sec || isNaN(sec)) return '0:00';
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${String(s).padStart(2, '0')}`;
        }

        function escapeHtml(s) {
            if (!s) return '';
            return String(s).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;',
                '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        // INIT
        {% if has_api %}
        loadMusic();
        {% endif %}
    </script>
</body>
</html>
