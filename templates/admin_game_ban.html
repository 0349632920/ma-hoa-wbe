<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚫 Quản lý cấm chơi game</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            min-height: 100vh;
            padding: 30px 20px;
        }

        .container { max-width: 1100px; margin: 0 auto; }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #f093fb, #f5576c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 20px;
            color: #c8c8e0;
            text-decoration: none;
            padding: 10px 18px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            transition: all 0.2s;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .back:hover {
            color: #2ed573;
            border-color: #2ed573;
            transform: translateX(-4px);
        }

        /* ═══ TABS ═══ */
        .tabs {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .tab {
            padding: 12px 24px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            cursor: pointer;
            font-weight: 700;
            transition: all 0.2s;
            color: #fff;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .tab:hover { background: rgba(255, 255, 255, 0.15); }
        .tab.active {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: #fff;
            border-color: #e74c3c;
            box-shadow: 0 8px 20px rgba(231, 76, 60, 0.35);
        }
        .tab .tab-badge {
            background: rgba(255, 255, 255, 0.25);
            padding: 2px 8px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 800;
            min-width: 22px;
            text-align: center;
        }

        .panel { display: none; }
        .panel.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: rgba(15, 15, 25, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            backdrop-filter: blur(12px);
        }
        .card h2 {
            font-size: 1.2rem;
            margin-bottom: 16px;
            color: #2ed573;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ═══ SEARCH ═══ */
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }
        .search-box input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 1rem;
            outline: none;
            font-family: inherit;
        }
        .search-box input:focus {
            border-color: #2ed573;
            box-shadow: 0 0 0 3px rgba(46, 213, 115, 0.15);
        }

        /* ═══ USER LIST ═══ */
        .user-list {
            max-height: 400px;
            overflow-y: auto;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .user-list::-webkit-scrollbar { width: 8px; }
        .user-list::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); }
        .user-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
        .user-list::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.3); }

        .user-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            cursor: pointer;
            transition: background 0.15s;
            gap: 12px;
        }
        .user-item:last-child { border-bottom: none; }
        .user-item:hover { background: rgba(255, 255, 255, 0.05); }
        .user-item.selected { background: rgba(231, 76, 60, 0.15); }
        .user-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #e74c3c;
            flex-shrink: 0;
        }
        .user-item .info { flex: 1; min-width: 0; }
        .user-item .name {
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .user-item .meta {
            color: #9999bb;
            font-size: 0.82rem;
            font-family: 'JetBrains Mono', monospace;
        }
        .user-item .badge {
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.72rem;
            font-weight: 700;
            background: rgba(255, 71, 87, 0.2);
            color: #ff6b7a;
            border: 1px solid rgba(255, 71, 87, 0.4);
            flex-shrink: 0;
            white-space: nowrap;
        }
        .user-item .badge.status-banned {
            background: rgba(255, 71, 87, 0.2);
            color: #ff6b7a;
            border-color: rgba(255, 71, 87, 0.4);
        }
        .user-item .badge.status-warned {
            background: rgba(255, 165, 2, 0.2);
            color: #ffbe4d;
            border-color: rgba(255, 165, 2, 0.4);
        }
        .user-item .badge.status-pending {
            background: rgba(155, 89, 182, 0.2);
            color: #c39bd3;
            border-color: rgba(155, 89, 182, 0.4);
        }

        .select-all-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            padding: 10px 14px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }
        .select-all-row input {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #e74c3c;
        }
        .select-all-row label {
            cursor: pointer;
            color: #c8c8e0;
            font-size: 0.9rem;
            font-weight: 600;
        }

        /* ═══ FORM ═══ */
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            color: #c8c8e0;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            font-family: inherit;
            transition: all 0.2s;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #2ed573;
            box-shadow: 0 0 0 3px rgba(46, 213, 115, 0.15);
        }
        .form-group select option {
            background: #1a1a2e;
            color: #fff;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .custom-row {
            display: none;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 8px;
            padding: 16px;
            background: rgba(46, 213, 115, 0.08);
            border: 1px dashed rgba(46, 213, 115, 0.4);
            border-radius: 12px;
        }
        .custom-row.show { display: grid; }

        /* ═══ BUTTONS ═══ */
        .btn {
            padding: 13px 26px;
            border: none;
            border-radius: 12px;
            background: #2ed573;
            color: #0f0c29;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1rem;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn:hover:not(:disabled) {
            background: #7bed9f;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(46, 213, 115, 0.3);
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn.danger {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: #fff;
        }
        .btn.danger:hover:not(:disabled) {
            background: linear-gradient(135deg, #ff6b7a, #e74c3c);
            box-shadow: 0 8px 20px rgba(231, 76, 60, 0.4);
        }
        .btn.warn { background: #ffa502; color: #0f0c29; }
        .btn.warn:hover:not(:disabled) { background: #ffbe4d; }
        .btn.secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .btn.secondary:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 20px rgba(255, 255, 255, 0.1);
        }
        .btn.small {
            padding: 7px 14px;
            font-size: 0.82rem;
            border-radius: 8px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        /* ═══ BAN TABLE ═══ */
        .ban-table-wrap {
            overflow-x: auto;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.2);
        }
        .ban-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }
        .ban-table th,
        .ban-table td {
            padding: 14px 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 0.88rem;
            vertical-align: top;
        }
        .ban-table th {
            color: #9999bb;
            font-weight: 700;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: rgba(0, 0, 0, 0.3);
            position: sticky;
            top: 0;
            z-index: 2;
        }
        .ban-table tr:hover { background: rgba(255, 255, 255, 0.03); }
        .ban-table .id-cell {
            font-family: 'JetBrains Mono', monospace;
            color: #2ed573;
            font-size: 0.82rem;
        }
        .ban-table .reason-cell {
            max-width: 200px;
            word-break: break-word;
            color: #ffa502;
        }

        .tag {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            white-space: nowrap;
        }
        .tag.temp {
            background: rgba(255, 165, 2, 0.2);
            color: #ffbe4d;
            border: 1px solid rgba(255, 165, 2, 0.3);
        }
        .tag.perm {
            background: rgba(255, 71, 87, 0.2);
            color: #ff6b7a;
            border: 1px solid rgba(255, 71, 87, 0.3);
        }

        .empty {
            text-align: center;
            padding: 50px 20px;
            color: #9999bb;
            font-size: 1rem;
        }
        .empty-icon {
            font-size: 4rem;
            display: block;
            margin-bottom: 14px;
            opacity: 0.6;
        }

        /* ═══ ALERT ═══ */
        .alert {
            padding: 14px 20px;
            border-radius: 12px;
            margin-bottom: 16px;
            font-weight: 600;
            display: none;
            align-items: center;
            gap: 10px;
        }
        .alert.show {
            display: flex;
            animation: slideDown 0.3s ease;
        }
        .alert.success {
            background: rgba(46, 213, 115, 0.15);
            border: 1px solid rgba(46, 213, 115, 0.4);
            color: #7bed9f;
        }
        .alert.error {
            background: rgba(255, 71, 87, 0.15);
            border: 1px solid rgba(255, 71, 87, 0.4);
            color: #ff6b7a;
        }
        .alert.warn {
            background: rgba(255, 165, 2, 0.15);
            border: 1px solid rgba(255, 165, 2, 0.4);
            color: #ffbe4d;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ═══ SELECTED INFO ═══ */
        .selected-info {
            background: rgba(231, 76, 60, 0.12);
            border: 1px solid rgba(231, 76, 60, 0.4);
            border-radius: 12px;
            padding: 14px 18px;
            margin-bottom: 16px;
            font-size: 0.95rem;
            display: none;
        }
        .selected-info.show { display: block; }
        .selected-info b { color: #ff6b7a; font-size: 1.1rem; }

        /* ═══ LOADING ═══ */
        .loading {
            text-align: center;
            padding: 50px 20px;
            color: #9999bb;
        }
        .spinner {
            display: inline-block;
            width: 36px;
            height: 36px;
            border: 3px solid rgba(255, 255, 255, 0.15);
            border-top-color: #2ed573;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ═══ STATS ROW ═══ */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 14px;
            margin-bottom: 20px;
        }
        .stat-box {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .stat-box .icon {
            font-size: 2rem;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(231, 76, 60, 0.15);
            border-radius: 12px;
        }
        .stat-box .info h4 {
            font-size: 1.5rem;
            font-weight: 800;
            color: #fff;
            line-height: 1;
            margin-bottom: 4px;
        }
        .stat-box .info p {
            font-size: 0.8rem;
            color: #9999bb;
            font-weight: 600;
        }

        /* ═══ COUNTDOWN ═══ */
        .countdown {
            font-family: 'JetBrains Mono', monospace;
            color: #ffbe4d;
            font-weight: 700;
        }

        /* ═══ MOBILE ═══ */
        @media (max-width: 640px) {
            body { padding: 16px 12px; }
            h1 { font-size: 1.6rem; }
            .row, .custom-row.show {
                grid-template-columns: 1fr;
            }
            .tabs { flex-direction: column; }
            .tab { width: 100%; justify-content: center; }
            .btn-group { flex-direction: column; }
            .btn { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="{{ url_for('admin_panel') }}" class="back">← Về Admin Panel</a>
        <h1>🚫 Quản lý cấm chơi game</h1>

        <!-- TABS -->
        <div class="tabs">
            <div class="tab active" id="tab-ban" onclick="switchTab('ban')">
                🚫 Cấm game
            </div>
            <div class="tab" id="tab-list" onclick="switchTab('list')">
                📋 Danh sách bị cấm
                <span class="tab-badge" id="tab-badge-count">0</span>
            </div>
        </div>

        <!-- ═══════════ PANEL 1: CẤM GAME ═══════════ -->
        <div class="panel active" id="panel-ban">
            <div class="alert" id="alert-box"></div>

            <!-- Chọn user -->
            <div class="card">
                <h2>1️⃣ Chọn user cần cấm</h2>

                <div class="search-box">
                    <input type="text" id="search-input"
                           placeholder="🔍 Tìm user theo username hoặc ID...">
                </div>

                <div class="select-all-row">
                    <input type="checkbox" id="select-all">
                    <label for="select-all">
                        Chọn tất cả user đang hiển thị
                    </label>
                </div>

                <div class="user-list" id="user-list">
                    <div class="loading"><div class="spinner"></div></div>
                </div>

                <div class="selected-info" id="selected-info">
                    Đã chọn: <b id="selected-count">0</b> user
                </div>
            </div>

            <!-- Cấu hình cấm -->
            <div class="card">
                <h2>2️⃣ Cấu hình cấm</h2>

                <div class="form-group">
                    <label for="reason">📝 Lý do cấm *</label>
                    <textarea id="reason"
                              placeholder="Ví dụ: Spam game, gian lận, thoát game liên tục, phá hoại trải nghiệm...">Vi phạm quy định game</textarea>
                </div>

                <div class="form-group">
                    <label for="duration">⏱️ Thời gian cấm</label>
                    <select id="duration" onchange="toggleCustom()">
                        <option value="1h">⚡ 1 giờ</option>
                        <option value="6h">🕕 6 giờ</option>
                        <option value="12h">🕛 12 giờ</option>
                        <option value="1day">📅 1 ngày</option>
                        <option value="3days">📆 3 ngày</option>
                        <option value="7days">🗓️ 7 ngày</option>
                        <option value="30days">📅 30 ngày</option>
                        <option value="permanent">♾️ Vĩnh viễn</option>
                        <option value="custom">⚙️ Tùy chỉnh thời gian...</option>
                    </select>
                </div>

                <div class="custom-row" id="custom-row">
                    <div class="form-group" style="margin: 0;">
                        <label for="custom-value">Số lượng</label>
                        <input type="number" id="custom-value" min="1" max="3650" value="1">
                    </div>
                    <div class="form-group" style="margin: 0;">
                        <label for="custom-unit">Đơn vị</label>
                        <select id="custom-unit">
                            <option value="minutes">Phút</option>
                            <option value="hours" selected>Giờ</option>
                            <option value="days">Ngày</option>
                        </select>
                    </div>
                </div>

                <div class="btn-group">
                    <button class="btn danger" id="btn-ban" onclick="doBan()">
                        🚫 Cấm game
                    </button>
                    <button class="btn secondary" onclick="clearSelection()">
                        🔄 Bỏ chọn tất cả
                    </button>
                </div>
            </div>
        </div>

        <!-- ═══════════ PANEL 2: DANH SÁCH ═══════════ -->
        <div class="panel" id="panel-list">
            <!-- Stats -->
            <div class="stats-row">
                <div class="stat-box">
                    <div class="icon">🚫</div>
                    <div class="info">
                        <h4 id="stat-total-banned">0</h4>
                        <p>Đang bị cấm game</p>
                    </div>
                </div>
                <div class="stat-box">
                    <div class="icon">⏰</div>
                    <div class="info">
                        <h4 id="stat-temp-banned">0</h4>
                        <p>Cấm tạm thời</p>
                    </div>
                </div>
                <div class="stat-box">
                    <div class="icon">♾️</div>
                    <div class="info">
                        <h4 id="stat-perm-banned">0</h4>
                        <p>Cấm vĩnh viễn</p>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2 style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                    <span>📋 User đang bị cấm chơi game</span>
                    <button class="btn small secondary" onclick="loadBanList()">
                        🔄 Làm mới
                    </button>
                </h2>

                <div id="ban-list-container">
                    <div class="loading"><div class="spinner"></div></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════
        // STATE
        // ═══════════════════════════════════════
        let allUsers = [];
        let selectedUsernames = new Set();
        let currentTab = 'ban';

        // ═══════════════════════════════════════
        // TABS
        // ═══════════════════════════════════════
        function switchTab(name) {
            currentTab = name;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));

            if (name === 'ban') {
                document.getElementById('tab-ban').classList.add('active');
                document.getElementById('panel-ban').classList.add('active');
            } else {
                document.getElementById('tab-list').classList.add('active');
                document.getElementById('panel-list').classList.add('active');
                loadBanList();
            }
        }

        // ═══════════════════════════════════════
        // ALERT
        // ═══════════════════════════════════════
        function showAlert(msg, type = 'success') {
            const box = document.getElementById('alert-box');
            box.textContent = msg;
            box.className = 'alert show ' + type;
            setTimeout(() => { box.classList.remove('show'); }, 5000);
        }

        // ═══════════════════════════════════════
        // TOGGLE CUSTOM DURATION
        // ═══════════════════════════════════════
        function toggleCustom() {
            const v = document.getElementById('duration').value;
            const row = document.getElementById('custom-row');
            row.classList.toggle('show', v === 'custom');
        }

        // ═══════════════════════════════════════
        // LOAD USERS (để cấm)
        // ═══════════════════════════════════════
        async function loadUsers(q = '') {
            const list = document.getElementById('user-list');
            list.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

            try {
                const res = await fetch('/api/admin/game-ban-search?q=' + encodeURIComponent(q));
                const data = await res.json();

                if (!data.success) {
                    list.innerHTML = '<div class="empty">❌ Lỗi: ' + (data.error || 'Không rõ') + '</div>';
                    return;
                }

                allUsers = data.users || [];
                renderUsers();
            } catch (e) {
                list.innerHTML = '<div class="empty">❌ Lỗi kết nối!</div>';
            }
        }

        function renderUsers() {
            const list = document.getElementById('user-list');

            if (allUsers.length === 0) {
                list.innerHTML = `
                    <div class="empty">
                        <span class="empty-icon">👤</span>
                        Không có user nào
                    </div>
                `;
                return;
            }

            list.innerHTML = allUsers.map(u => {
                const selected = selectedUsernames.has(u.username);
                const checked = selected ? 'checked' : '';

                let statusBadge = '';
                if (u.is_banned) {
                    statusBadge = '<span class="badge">🚫 Đang bị cấm game</span>';
                } else if (u.status === 'banned') {
                    statusBadge = '<span class="badge status-banned">🚫 Bị ban TK</span>';
                } else if (u.status === 'warned') {
                    statusBadge = '<span class="badge status-warned">⚠️ Cảnh báo</span>';
                } else if (u.status === 'pending_delete') {
                    statusBadge = '<span class="badge status-pending">🗑️ Chờ xóa</span>';
                }

                return `
                    <div class="user-item ${selected ? 'selected' : ''}"
                         onclick="toggleUser('${escapeJs(u.username)}', event)">
                        <input type="checkbox" ${checked}
                               onclick="event.stopPropagation(); toggleUser('${escapeJs(u.username)}')">
                        <div class="info">
                            <div class="name">${escapeHtml(u.display_name)}</div>
                            <div class="meta">@${escapeHtml(u.username)} · ID: ${escapeHtml(u.user_id)}</div>
                        </div>
                        ${statusBadge}
                    </div>
                `;
            }).join('');

            updateSelectedInfo();
        }

        function escapeHtml(s) {
            if (!s) return '';
            return String(s).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;',
                '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        function escapeJs(s) {
            return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        }

        // ═══════════════════════════════════════
        // SELECTION
        // ═══════════════════════════════════════
        function toggleUser(username, evt) {
            if (evt) evt.stopPropagation();

            if (selectedUsernames.has(username)) {
                selectedUsernames.delete(username);
            } else {
                selectedUsernames.add(username);
            }
            renderUsers();
        }

        function clearSelection() {
            selectedUsernames.clear();
            document.getElementById('select-all').checked = false;
            renderUsers();
        }

        function updateSelectedInfo() {
            const info = document.getElementById('selected-info');
            const count = document.getElementById('selected-count');
            count.textContent = selectedUsernames.size;
            info.classList.toggle('show', selectedUsernames.size > 0);
        }

        // ═══════════════════════════════════════
        // SELECT ALL
        // ═══════════════════════════════════════
        document.getElementById('select-all').addEventListener('change', (e) => {
            if (e.target.checked) {
                allUsers.forEach(u => {
                    if (!u.is_banned) selectedUsernames.add(u.username);
                });
            } else {
                selectedUsernames.clear();
            }
            renderUsers();
        });

        // ═══════════════════════════════════════
        // SEARCH
        // ═══════════════════════════════════════
        let searchTimer;
        document.getElementById('search-input').addEventListener('input', (e) => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => {
                loadUsers(e.target.value.trim());
            }, 300);
        });

        // ═══════════════════════════════════════
        // DO BAN
        // ═══════════════════════════════════════
        async function doBan() {
            const btn = document.getElementById('btn-ban');

            if (selectedUsernames.size === 0) {
                showAlert('⚠️ Chưa chọn user nào!', 'error');
                return;
            }

            const reason = document.getElementById('reason').value.trim();
            if (!reason) {
                showAlert('⚠️ Chưa nhập lý do cấm!', 'error');
                return;
            }

            const duration = document.getElementById('duration').value;

            const payload = {
                usernames: Array.from(selectedUsernames),
                reason: reason,
                duration: duration
            };

            if (duration === 'custom') {
                const cv = parseInt(document.getElementById('custom-value').value);
                const cu = document.getElementById('custom-unit').value;
                if (!cv || cv <= 0) {
                    showAlert('⚠️ Giá trị thời gian không hợp lệ!', 'error');
                    return;
                }
                payload.custom_value = cv;
                payload.custom_unit = cu;
            }

            btn.disabled = true;
            const originalText = btn.textContent;
            btn.textContent = '⏳ Đang xử lý...';

            try {
                const res = await fetch('/api/admin/game-ban', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (data.success) {
                    let msg = `✅ Đã cấm game ${data.banned_count} user (${data.duration_label})`;
                    if (data.skipped_count > 0) {
                        msg += ` — bỏ qua ${data.skipped_count} user`;
                    }
                    showAlert(msg, 'success');
                    selectedUsernames.clear();
                    document.getElementById('select-all').checked = false;
                    loadUsers(document.getElementById('search-input').value.trim());
                    updateTabBadge();
                } else {
                    showAlert('❌ ' + (data.error || 'Có lỗi xảy ra!'), 'error');
                }
            } catch (e) {
                showAlert('❌ Lỗi kết nối!', 'error');
            }

            btn.disabled = false;
            btn.textContent = originalText;
        }

        // ═══════════════════════════════════════
        // LOAD BAN LIST
        // ═══════════════════════════════════════
        async function loadBanList() {
            const container = document.getElementById('ban-list-container');
            container.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

            try {
                const res = await fetch('/api/admin/game-ban-list');
                const data = await res.json();

                if (!data.success) {
                    container.innerHTML = '<div class="empty">❌ Lỗi: ' + (data.error || '') + '</div>';
                    return;
                }

                updateStats(data.users);
                updateTabBadge(data.total);

                if (data.users.length === 0) {
                    container.innerHTML = `
                        <div class="empty">
                            <span class="empty-icon">✅</span>
                            Không có user nào bị cấm chơi game
                        </div>
                    `;
                    return;
                }

                container.innerHTML = `
                    <div class="ban-table-wrap">
                        <table class="ban-table">
                            <thead>
                                <tr>
                                    <th>👤 User</th>
                                    <th>🆔 User ID</th>
                                    <th>📝 Lý do</th>
                                    <th>⏱️ Thời hạn</th>
                                    <th>👑 Cấm bởi</th>
                                    <th>🕐 Cấm lúc</th>
                                    <th>⚙️ Hành động</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${data.users.map(u => `
                                    <tr>
                                        <td>
                                            <strong>${escapeHtml(u.display_name)}</strong>
                                            <div style="color:#9999bb; font-size:0.78rem; margin-top:2px;">
                                                @${escapeHtml(u.username)}
                                            </div>
                                        </td>
                                        <td class="id-cell">${escapeHtml(u.user_id)}</td>
                                        <td class="reason-cell" title="${escapeHtml(u.reason || '')}">
                                            ${escapeHtml(u.reason || '—')}
                                        </td>
                                        <td>
                                            <span class="tag ${u.is_temp ? 'temp' : 'perm'}">
                                                ${u.is_temp ? '⏰' : '♾️'} ${escapeHtml(u.duration_label)}
                                            </span>
                                            ${u.is_temp && u.ban_until ? `
                                                <div style="margin-top:6px; font-size:0.75rem; color:#9999bb;">
                                                    Hết hạn: <span class="countdown" data-until="${escapeHtml(u.ban_until)}">...</span>
                                                </div>
                                            ` : ''}
                                        </td>
                                        <td>${escapeHtml(u.banned_by || '—')}</td>
                                        <td style="font-size:0.82rem; color:#9999bb;">
                                            ${formatTime(u.banned_at)}
                                        </td>
                                        <td>
                                            <button class="btn small"
                                                    style="background:linear-gradient(135deg,#27ae60,#16a085); color:#fff;"
                                                    onclick="unbanOne('${escapeJs(u.username)}')">
                                                ✅ Bỏ cấm
                                            </button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;

                startCountdowns();
            } catch (e) {
                container.innerHTML = '<div class="empty">❌ Lỗi kết nối!</div>';
            }
        }

        // ═══════════════════════════════════════
        // UNBAN 1 USER
        // ═══════════════════════════════════════
        async function unbanOne(username) {
            if (!confirm(`✅ Bỏ cấm chơi game cho "${username}"?`)) return;

            try {
                const res = await fetch('/api/admin/game-unban', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usernames: [username] })
                });
                const data = await res.json();

                if (data.success) {
                    alert('✅ ' + data.message);
                    loadBanList();
                    updateTabBadge();
                } else {
                    alert('❌ ' + (data.error || 'Lỗi!'));
                }
            } catch (e) {
                alert('❌ Lỗi kết nối!');
            }
        }

        // ═══════════════════════════════════════
        // UPDATE STATS
        // ═══════════════════════════════════════
        function updateStats(users) {
            const total = users.length;
            const temp = users.filter(u => u.is_temp).length;
            const perm = total - temp;

            document.getElementById('stat-total-banned').textContent = total;
            document.getElementById('stat-temp-banned').textContent = temp;
            document.getElementById('stat-perm-banned').textContent = perm;
        }

        async function updateTabBadge(count = null) {
            if (count === null) {
                try {
                    const res = await fetch('/api/admin/game-ban-list');
                    const data = await res.json();
                    if (data.success) count = data.total;
                } catch (e) { return; }
            }
            document.getElementById('tab-badge-count').textContent = count || 0;
        }

        // ═══════════════════════════════════════
        // COUNTDOWN
        // ═══════════════════════════════════════
        function startCountdowns() {
            document.querySelectorAll('.countdown[data-until]').forEach(el => {
                const iso = el.getAttribute('data-until');
                if (!iso) return;

                const update = () => {
                    try {
                        const until = new Date(iso);
                        const diff = until - new Date();

                        if (diff <= 0) {
                            el.textContent = 'Đã hết hạn';
                            el.style.color = '#7bed9f';
                            return;
                        }

                        const d = Math.floor(diff / 86400000);
                        const h = Math.floor((diff % 86400000) / 3600000);
                        const m = Math.floor((diff % 3600000) / 60000);
                        const s = Math.floor((diff % 60000) / 1000);

                        let str = '';
                        if (d) str += d + 'd ';
                        if (h) str += h + 'h ';
                        if (m) str += m + 'm ';
                        str += s + 's';
                        el.textContent = str;
                    } catch (e) {
                        el.textContent = iso;
                    }
                };

                update();
                setInterval(update, 1000);
            });
        }

        // ═══════════════════════════════════════
        // FORMAT TIME
        // ═══════════════════════════════════════
        function formatTime(iso) {
            if (!iso) return '—';
            try {
                return new Date(iso).toLocaleString('vi-VN', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            } catch { return iso; }
        }

        // ═══════════════════════════════════════
        // INIT
        // ═══════════════════════════════════════
        loadUsers();
        updateTabBadge();
    </script>
</body>
</html>
